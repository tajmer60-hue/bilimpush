"Кислота + основание → соль + вода — реакция нейтрализации."},{"type":"single","text":"Какой оксид является кислотным?","options":["CaO","Na₂O","SO₃","Al₂O₃"],"correct":2,"difficulty":2,"explanation":"SO₃ — оксид неметалла в высокой степени окисления (+6), кислотный. CaO и Na₂O — основные, Al₂O₃ — амфотерный."},{"type":"single","text":"Продукты реакции Zn + H₂SO₄(разб.):","options":["ZnSO₄ + H₂","ZnO + SO₂","Zn(OH)₂ + S","реакция не идёт"],"correct":0,"difficulty":2,"explanation":"Цинк стоит до водорода в ряду активности: Zn + H₂SO₄ → ZnSO₄ + H₂↑."},{"type":"single","text":"Формула серной кислоты:","options":["HCl","HNO₃","H₂SO₄","H₂SO₃"],"correct":2,"difficulty":1,"explanation":"H₂SO₄ — серная кислота (H₂SO₃ — сернистая)."},{"type":"single","text":"Степень окисления кислорода в большинстве соединений:","options":["+2","−2","−1","0"],"correct":1,"difficulty":1,"explanation":"Обычно −2 (исключения: пероксиды −1, OF₂ +2)."},{"type":"single","text":"Соль, формула которой CaCO₃, называется:","options":["хлорид кальция","карбонат кальция","сульфат кальция","карбид кальция"],"correct":1,"difficulty":1,"explanation":"CaCO₃ — карбонат кальция (мел, известняк, мрамор)."},{"type":"single","text":"Какой оксид амфотерный?","options":["CaO","K₂O","Al₂O₃","CO₂"],"correct":2,"difficulty":2,"explanation":"Al₂O₃ реагирует и с кислотами, и со щелочами — амфотерный оксид."},{"type":"single","text":"Генетический ряд «металл → … → основание» включает:","options":["кислотный оксид","основный оксид","соль","водород"],"correct":1,"difficulty":2,"explanation":"Металл → основный оксид (Me₂Oₙ) → основание (Me(OH)ₙ) → соль."}]},{"title":"Химическая связь","grade_min":9,"grade_max":10,"order":3,"theory":"<h3>Виды химической связи<\/h3><ul><li><b>Ковалентная<\/b> — образуется общими электронными парами между неметаллами. Бывает <b>полярная<\/b> (разные неметаллы: HCl, H₂O — пара смещена к более электроотрицательному атому) и <b>неполярная<\/b> (одинаковые атомы: H₂, O₂, Cl₂).<\/li><li><b>Ионная<\/b> — между типичным металлом и неметаллом: электрон полностью переходит, образуются ионы (NaCl, CaO, KBr).<\/li><li><b>Металлическая<\/b> — в металлах и сплавах: «электронный газ» из обобществлённых электронов между ионами-атомами.<\/li><li><b>Водородная<\/b> — слабая связь между H одного молекулы и O/N/F другой (между молекулами воды, в ДНК, белках).<\/li><\/ul><h3>Электроотрицательность (ЭО)<\/h3><p>Способность атома притягивать общие электроны. Растёт в периодах слева направо и в группах снизу вверх. Самый электроотрицательный элемент — <b>фтор<\/b>. Разница ЭО &gt; 1,7 — связь ионная, меньше — ковалентная полярная.<\/p><h3>Кристаллические решётки<\/h3><ul><li><b>Ионная<\/b> (NaCl): прочные, тугоплавкие, растворы проводят ток;<\/li><li><b>Атомная<\/b> (алмаз, SiO₂, кремний): очень прочные, тугоплавкие, нерастворимы;<\/li><li><b>Молекулярная<\/b> (лёд, йод, CO₂): слабые связи между молекулами — летучие, легкоплавкие;<\/li><li><b>Металлическая<\/b>: пластичность, электро- и теплопроводность, блеск.<\/li><\/ul><h3>Валентность и степень окисления<\/h3><p>Валентность — число связей атома (I–VIII, без знака). Степень окисления — условный заряд (со знаком). В простых веществах обе = 0 (валентность может не определяться).<\/p>","questions":[{"type":"single","text":"Какая связь в молекуле NaCl?","options":["ковалентная полярная","ковалентная неполярная","ионная","металлическая"],"correct":2,"difficulty":1,"explanation":"Типичный металл Na + типичный неметалл Cl → ионная связь (Na⁺Cl⁻)."},{"type":"single","text":"Связь в молекуле H₂:","options":["ионная","ковалентная неполярная","ковалентная полярная","водородная"],"correct":1,"difficulty":1,"explanation":"Два одинаковых атома неметалла — общая пара не смещена, связь неполярная."},{"type":"single","text":"Связь в молекуле HCl:","options":["ионная","ковалентная неполярная","ковалентная полярная","металлическая"],"correct":2,"difficulty":1,"explanation":"Разные неметаллы: общая пара смещена к более электроотрицательному Cl — связь полярная."},{"type":"single","text":"Самый электроотрицательный элемент:","options":["кислород","хлор","фтор","азот"],"correct":2,"difficulty":1,"explanation":"Фтор — эталон электроотрицательности (4,0 по Полингу)."},{"type":"single","text":"Какую кристаллическую решётку имеет алмаз?","options":["ионную","молекулярную","атомную","металлическую"],"correct":2,"difficulty":2,"explanation":"Атомная решётка: атомы углерода связаны прочными ковалентными связями в каркас — поэтому алмаз самый твёрдый."},{"type":"single","text":"Вещества с молекулярной решёткой обычно:","options":["тугоплавкие и твёрдые","летучие и легкоплавкие","проводят ток в твёрдом виде","очень прочные"],"correct":1,"difficulty":2,"explanation":"Межмолекулярные силы слабы, поэтому такие вещества легко плавятся и испаряются (лёд, йод, CO₂)."},{"type":"single","text":"Какая связь удерживает вместе молекулы воды между собой?","options":["ионная","ковалентная полярная","водородная","металлическая"],"correct":2,"difficulty":2,"explanation":"Между молекулами H₂O действует водородная связь (внутри молекулы — ковалентная полярная)."},{"type":"single","text":"Степень окисления серы в SO₃:","options":["+4","+6","−2","+2"],"correct":1,"difficulty":2,"explanation":"Кислород −2 (три атома = −6), сумма равна 0 → сера +6."},{"type":"single","text":"Металлическая связь характерна для:","options":["солей","газов","металлов и сплавов","кислот"],"correct":2,"difficulty":1,"explanation":"В металлах валентные электроны обобществлены — «электронный газ» между ионами."},{"type":"single","text":"Растворы каких веществ проводят электрический ток?","options":["сахара","спирта","солей, кислот, щелочей","кислорода"],"correct":2,"difficulty":1,"explanation":"Электролиты (соли, кислоты, основания) диссоциируют на ионы — раствор проводит ток."}]},{"title":"Растворы и массовая доля","grade_min":9,"grade_max":11,"order":4,"theory":"<h3>Растворы<\/h3><p><b>Раствор<\/b> — однородная смесь растворённого вещества и растворителя. Растворимость зависит от природы веществ, температуры (для твёрдых обычно растёт, для газов — падает) и давления (для газов растёт).<\/p><h3>Массовая доля растворённого вещества<\/h3><p><b>w = m(вещества) / m(раствора) · 100%<\/b>, где m(раствора) = m(вещества) + m(воды).<\/p><p><b>Пример:<\/b> 20 г соли растворили в 180 г воды. w = 20/200 = 0,1 = 10%.<\/p><h3>Задачи на смешивание и разбавление<\/h3><ul><li>Разбавление: m(вещества) не меняется → w₁·m₁ = w₂·m₂.<\/li><li>Добавление вещества: новая w = (m₁w₁ + mвещ)/(m₁ + mвещ).<\/li><li>Смешивание двух растворов: w = (m₁w₁ + m₂w₂)/(m₁ + m₂) — «правило креста».<\/li><\/ul><h3>Электролитическая диссоциация<\/h3><p>Распад электролита на ионы в растворе: NaCl → Na⁺ + Cl⁻; H₂SO₄ → 2H⁺ + SO₄²⁻; NaOH → Na⁺ + OH⁻.<\/p><ul><li><b>Кислоты<\/b> — все катионы H⁺;<\/li><li><b>Основания<\/b> — все анионы OH⁻;<\/li><li><b>Соли<\/b> — катионы металла и анионы кислотного остатка.<\/li><\/ul><p><b>Реакции ионного обмена<\/b> идут до конца, если образуется осадок ↓, газ ↑ или вода (малодиссоциирующее вещество).<\/p><h3>Молярная концентрация<\/h3><p>C = n/V (моль/л), где n = m/M — количество вещества, M — молярная масса (г/моль, численно равна относительной молекулярной массе).<\/p>","questions":[{"type":"single","text":"Массовая доля соли в растворе, полученном растворением 10 г соли в 90 г воды:","options":["10%","11%","9%","90%"],"correct":0,"difficulty":1,"explanation":"m(раствора) = 10 + 90 = 100 г; w = 10/100 = 10%."},{"type":"single","text":"Формула массовой доли растворённого вещества:","options":["w = m(в-ва)/m(р-ра)","w = m(р-ра)/m(в-ва)","w = V/n","w = n/V"],"correct":0,"difficulty":1,"explanation":"w = масса вещества / масса всего раствора (обычно в %)."},{"type":"single","text":"Сколько граммов сахара нужно взять, чтобы приготовить 200 г 5%-ного раствора?","options":["5 г","10 г","25 г","100 г"],"correct":1,"difficulty":2,"explanation":"m = w·m(р-ра) = 0,05·200 = 10 г."},{"type":"single","text":"К 100 г 10%-ного раствора соли добавили 50 г воды. Новая массовая доля:","options":["≈6,7%","5%","15%","10%"],"correct":0,"difficulty":3,"explanation":"Соли 10 г; раствор стал 150 г → w = 10/150 ≈ 6,67%."},{"type":"single","text":"Как называется распад электролита на ионы в растворе?","options":["гидролиз","диссоциация","нейтрализация","кристаллизация"],"correct":1,"difficulty":1,"explanation":"Электролитическая диссоциация — распад на ионы."},{"type":"single","text":"При диссоциации какой кислоты образуются ионы H⁺ и Cl⁻?","options":["H₂SO₄","HCl","HNO₃","H₃PO₄"],"correct":1,"difficulty":1,"explanation":"HCl → H⁺ + Cl⁻ — соляная кислота."},{"type":"single","text":"Растворимость газов в воде при нагревании:","options":["растёт","уменьшается","не меняется","сначала растёт, потом не меняется"],"correct":1,"difficulty":2,"explanation":"Газы хуже растворяются в горячей воде (поэтому кипячение удаляет растворённый воздух)."},{"type":"single","text":"Молярная масса воды H₂O:","options":["16 г/моль","17 г/моль","18 г/моль","20 г/моль"],"correct":2,"difficulty":1,"explanation":"M = 2·1 + 16 = 18 г/моль."},{"type":"single","text":"Сколько вещества (в моль) содержится в 36 г воды?","options":["1 моль","2 моль","18 моль","0,5 моль"],"correct":1,"difficulty":2,"explanation":"n = m/M = 36/18 = 2 моль."},{"type":"single","text":"Реакция ионного обмена идёт до конца, если образуется:","options":["только вода","осадок, газ или вода","только осадок","любые продукты"],"correct":1,"difficulty":2,"explanation":"Условия необратимости: выпадение осадка ↓, выделение газа ↑ или образование малодиссоциирующего вещества (воды)."}]}]},{"title":"Органическая химия","order":2,"topics":[{"title":"Основы органической химии","grade_min":10,"grade_max":11,"order":1,"theory":"<h3>Особенности органических веществ<\/h3><p>Органические вещества содержат углерод (кроме CO, CO₂, карбонатов — их относят к неорганике). Теория строения <b>А.М. Бутлерова (1861)<\/b>: атомы соединены в определённом порядке согласно валентности (C — IV, H — I, O — II); свойства зависят не только от состава, но и от строения; атомы взаимно влияют друг на друга.<\/p><h3>Углеводороды<\/h3><ul><li><b>Алканы<\/b> CₙH₂ₙ₊₂ — предельные (одинарные связи): метан CH₄, этан C₂H₆, пропан, бутан. Реакции замещения и горения.<\/li><li><b>Алкены<\/b> CₙH₂ₙ — одна двойная связь: этилен C₂H₄. Реакции присоединения (обесцвечивают бромную воду).<\/li><li><b>Алкины<\/b> CₙH₂ₙ₋₂ — одна тройная связь: ацетилен C₂H₂.<\/li><li><b>Арены<\/b>: бензол C₆H₆ — ароматическое кольцо.<\/li><\/ul><h3>Кислородсодержащие соединения<\/h3><ul><li><b>Спирты<\/b> R–OH: метанол CH₃OH (яд!), этанол C₂H₅OH;<\/li><li><b>Альдегиды<\/b> R–CHO;<\/li><li><b>Карбоновые кислоты<\/b> R–COOH: уксусная CH₃COOH;<\/li><li><b>Эфиры<\/b> (сложные) R–COO–R′ — продукты кислот и спиртов, имеют запахи фруктов;<\/li><li><b>Жиры<\/b> — сложные эфиры глицерина и высших карбоновых кислот;<\/li><li><b>Углеводы<\/b>: глюкоза C₆H₁₂O₆, сахароза C₁₂H₂₂O₁₁, крахмал и целлюлоза (C₆H₁₀O₅)ₙ.<\/li><\/ul><h3>Азотсодержащие<\/h3><p><b>Амины<\/b> R–NH₂; <b>аминокислоты<\/b> (содержат −NH₂ и −COOH) — мономеры <b>белков<\/b>. Нуклеиновые кислоты (ДНК, РНК) — полимеры нуклеотидов.<\/p><h3>Изомерия и гомология<\/h3><p><b>Изомеры<\/b> — одинаковый состав, разное строение (бутан и изобутан). <b>Гомологи<\/b> — похожее строение, состав отличается на CH₂ (метан → этан → пропан).<\/p><h3>Полимеры<\/h3><p>Реакции <b>полимеризации<\/b> (n CH₂=CH₂ → (−CH₂−CH₂−)ₙ — полиэтилен) и <b>поликонденсации<\/b>. Пластмассы, волокна, каучуки.<\/p>","questions":[{"type":"single","text":"Общая формула алканов:","options":["CₙH₂ₙ","CₙH₂ₙ₊₂","CₙH₂ₙ₋₂","CₙHₙ"],"correct":1,"difficulty":1,"explanation":"Алканы — предельные углеводороды: CₙH₂ₙ₊₂ (метан CH₄, этан C₂H₆…)."},{"type":"single","text":"Формула метана:","options":["CH₄","C₂H₄","C₂H₂","C₆H₆"],"correct":0,"difficulty":1,"explanation":"Метан — простейший алкан: CH₄ (основной компонент природного газа)."},{"type":"single","text":"Какой углеводород содержит двойную связь?","options":["этан","этилен","ацетилен","бензол (условно)"],"correct":1,"difficulty":1,"explanation":"Этилен (этен) C₂H₄ — алкен с одной двойной связью. Ацетилен — тройная, этан — только одинарные."},{"type":"single","text":"Функциональная группа спиртов:","options":["−COOH","−OH","−NH₂","−CHO"],"correct":1,"difficulty":1,"explanation":"Гидроксильная группа −OH определяет свойства спиртов."},{"type":"single","text":"Уксусная кислота имеет формулу:","options":["CH₃OH","CH₃COOH","HCOOH","C₂H₅OH"],"correct":1,"difficulty":2,"explanation":"CH₃COOH — уксусная кислота (HCOOH — муравьиная)."},{"type":"single","text":"Гомологи — это вещества, отличающиеся по составу на группу:","options":["CH","CH₂","CH₃","OH"],"correct":1,"difficulty":2,"explanation":"Гомологическая разница — CH₂; строение и свойства сходны."},{"type":"single","text":"Бутан и изобутан — это:","options":["гомологи","изомеры","одно вещество","алкены"],"correct":1,"difficulty":2,"explanation":"Одинаковый состав C₄H₁₀, разное строение цепи — изомеры."},{"type":"single","text":"Глюкоза имеет формулу:","options":["C₆H₁₂O₆","C₁₂H₂₂O₁₁","(C₆H₁₀O₅)ₙ","C₂H₅OH"],"correct":0,"difficulty":2,"explanation":"C₆H₁₂O₆ — глюкоза; C₁₂H₂₂O₁₁ — сахароза; (C₆H₁₀O₅)ₙ — крахмал/целлюлоза."},{"type":"single","text":"Мономерами белков являются:","options":["глюкоза","нуклеотиды","аминокислоты","глицерин"],"correct":2,"difficulty":1,"explanation":"Белки — полимеры из аминокислот (нуклеотиды — мономеры ДНК/РНК)."},{"type":"single","text":"Полиэтилен получают реакцией:","options":["замещения","полимеризации этилена","нейтрализации","горения"],"correct":1,"difficulty":2,"explanation":"n CH₂=CH₂ → (−CH₂−CH₂−)ₙ — реакция полимеризации."}]}]}]},{"title":"Биология","icon":"🧬","color":"#37b24d","order":4,"sections":[{"title":"Общая биология","order":1,"topics":[{"title":"Клетка — основа жизни","grade_min":6,"grade_max":7,"order":1,"theory":"<h3>Клеточная теория<\/h3><p>Основные положения (Шлейден и Шванн, 1838–1839; дополнена Вирховым):<\/p><ol><li>Все живые организмы состоят из клеток;<\/li><li>Клетка — единица строения, жизнедеятельности, роста и развития;<\/li><li>Клетки всех организмов сходны по строению и составу;<\/li><li>Новые клетки образуются только из клеток (деление);<\/li><li>В многоклеточных организмах клетки специализированы и образуют ткани.<\/li><\/ol><h3>Строение клетки<\/h3><ul><li><b>Мембрана<\/b> — двойной слой липидов с белками; избирательная проницаемость;<\/li><li><b>Цитоплазма<\/b> — внутренняя полужидкая среда, объединяет органоиды;<\/li><li><b>Ядро<\/b> — хранит ДНК (хромосомы), управляет клеткой; содержит ядрышко;<\/li><li><b>Митохондрии<\/b> — «энергетические станции»: синтез АТФ (клеточное дыхание);<\/li><li><b>Рибосомы<\/b> — синтез белка;<\/li><li><b>ЭПС<\/b> (эндоплазматическая сеть) — транспорт веществ, синтез (шероховатая — с рибосомами — белки; гладкая — липиды и углеводы);<\/li><li><b>Аппарат Гольджи<\/b> — накопление, упаковка, секреция веществ; образование лизосом;<\/li><li><b>Лизосомы<\/b> — внутриклеточное пищеварение (ферменты);<\/li><li><b>Клеточный центр (центросома)<\/b> — участие в делении.<\/li><\/ul><h3>Отличия растительной клетки<\/h3><ul><li><b>Клеточная стенка<\/b> из целлюлозы;<\/li><li><b>Хлоропласты<\/b> — фотосинтез (содержат хлорофилл);<\/li><li><b>Вакуоли<\/b> — крупные, с клеточным соком.<\/li><\/ul><h3>Прокариоты и эукариоты<\/h3><p><b>Прокариоты<\/b> (бактерии, археи) — нет оформленного ядра, ДНК кольцевая в цитоплазме, органоидов мало. <b>Эукариоты<\/b> (растения, животные, грибы) — ядро с оболочкой, мембранные органоиды.<\/p><h3>Деление клетки<\/h3><ul><li><b>Митоз<\/b>: из 1 материнской — 2 дочерние с таким же набором хромосом (2n → 2n). Фазы: профаза, метафаза, анафаза, телофаза. Рост и регенерация.<\/li><li><b>Мейоз<\/b>: из 1 — 4 клетки с половинным набором (2n → n). Образование гамет.<\/li><\/ul>","questions":[{"type":"single","text":"Кто сформулировал клеточную теорию?","options":["Дарвин и Ламарк","Шлейден и Шванн","Мендель и Морган","Пастер и Кох"],"correct":1,"difficulty":1,"explanation":"Немецкий ботаник Шлейден и зоолог Шванн (1838–1839)."},{"type":"single","text":"Какой органоид называют «энергетической станцией» клетки?","options":["рибосома","митохондрия","лизосома","ядро"],"correct":1,"difficulty":1,"explanation":"Митохондрии синтезируют АТФ в процессе клеточного дыхания."},{"type":"single","text":"Где происходит синтез белка?","options":["в лизосомах","в рибосомах","в вакуолях","в аппарате Гольджи"],"correct":1,"difficulty":1,"explanation":"Рибосомы — немембранные органоиды, собирают белок из аминокислот."},{"type":"single","text":"Фотосинтез в растительной клетке происходит в:","options":["митохондриях","хлоропластах","лизосомах","вакуолях"],"correct":1,"difficulty":1,"explanation":"Хлоропласты содержат хлорофилл и осуществляют фотосинтез."},{"type":"single","text":"Главное отличие прокариот от эукариот:","options":["нет мембраны","нет оформленного ядра","нет ДНК","нет рибосом"],"correct":1,"difficulty":2,"explanation":"У прокариот (бактерий) ДНК лежит прямо в цитоплазме — ядра с оболочкой нет."},{"type":"single","text":"В результате митоза из одной клетки (2n) образуются:","options":["2 клетки с набором n","4 клетки с набором n","2 клетки с набором 2n","4 клетки с набором 2n"],"correct":2,"difficulty":2,"explanation":"Митоз сохраняет набор: 2n → 2 дочерние клетки 2n."},{"type":"single","text":"Какой органоид отвечает за хранение наследственной информации?","options":["ядро","аппарат Гольджи","клеточный центр","ЭПС"],"correct":0,"difficulty":1,"explanation":"В ядре находятся хромосомы (ДНК с белками)."},{"type":"single","text":"Клеточная стенка растений состоит из:","options":["хитина","целлюлозы","муреина","крахмала"],"correct":1,"difficulty":2,"explanation":"У растений — целлюлоза; у грибов — хитин; у бактерий — муреин."},{"type":"single","text":"Лизосомы выполняют функцию:","options":["синтеза АТФ","внутриклеточного пищеварения","хранения ДНК","фотосинтеза"],"correct":1,"difficulty":2,"explanation":"Лизосомы — пузырьки с ферментами, расщепляют вещества и старые органоиды."},{"type":"single","text":"Мейоз — это деление, при котором образуются:","options":["клетки тела","половые клетки (гаметы)","споры грибов всегда","бактерии"],"correct":1,"difficulty":2,"explanation":"Мейоз уменьшает набор вдвое (2n → n) и служит для образования гамет."}]},{"title":"Основы генетики","grade_min":9,"grade_max":10,"order":2,"theory":"<h3>Основные понятия<\/h3><ul><li><b>Ген<\/b> — участок ДНК, кодирующий один белок/признак;<\/li><li><b>Аллельные гены<\/b> — разные формы одного гена (A и a);<\/li><li><b>Генотип<\/b> — совокупность генов; <b>фенотип<\/b> — совокупность признаков;<\/li><li><b>Доминантный<\/b> признак (A) подавляет <b>рецессивный<\/b> (a);<\/li><li><b>Гомозигота<\/b> (AA, aa) — одинаковые аллели; <b>гетерозигота<\/b> (Aa) — разные;<\/li><li><b>Гомологичные хромосомы<\/b> — парные хромосомы (одна от матери, одна от отца).<\/li><\/ul><h3>Законы Менделя<\/h3><ol><li><b>Первый закон (единообразия гибридов F₁):<\/b> при скрещивании двух гомозигот (AA × aa) все гибриды первого поколения одинаковы — Aa, проявляется доминантный признак.<\/li><li><b>Второй закон (расщепления):<\/b> при скрещивании гибридов F₁ (Aa × Aa) во втором поколении расщепление по фенотипу <b>3:1<\/b>, по генотипу <b>1 AA : 2 Aa : 1 aa<\/b>.<\/li><li><b>Третий закон (независимого наследования):<\/b> гены разных пар признаков наследуются независимо; при дигибридном скрещивании (AaBb × AaBb) расщепление по фенотипу <b>9:3:3:1<\/b>.<\/li><\/ol><h3>Закон чистоты гамет<\/h3><p>В гамету попадает только один ген из аллельной пары: гомозигота AA даёт гаметы (A), гетерозигота Aa — (A) и (a) поровну.<\/p><h3>Решётка Пеннета<\/h3><p>Таблица для определения генотипов потомства: по горизонтали — гаметы одного родителя, по вертикали — другого.<\/p><h3>Сцепленное наследование и генетика пола<\/h3><ul><li>Гены одной хромосомы наследуются <b>сцепленно<\/b> (закон Моргана).<\/li><li>Пол человека: XX — женский, XY — мужской; вероятность рождения мальчика или девочки — 50%.<\/li><li>Признаки, сцепленные с X-хромосомой: гемофилия, дальтонизм (проявляются чаще у мужчин).<\/li><li>Группы крови: система ABO — аллели Iᴬ, Iᴮ, i⁰; Iᴬ и Iᴮ — кодоминирование (IV группа AB).<\/li><\/ul>","questions":[{"type":"single","text":"Как называется признак, подавляющий другой в гетерозиготе?","options":["рецессивный","доминантный","сцепленный","аллельный"],"correct":1,"difficulty":1,"explanation":"Доминантный признак (A) проявляется и у AA, и у Aa."},{"type":"single","text":"Генотип Aa — это:","options":["гомозигота","гетерозигота","дигибрид","рецессив"],"correct":1,"difficulty":1,"explanation":"Разные аллели одного гена — гетерозигота."},{"type":"single","text":"При скрещивании Aa × Aa расщепление по фенотипу в F₂:","options":["1:1","3:1","9:3:3:1","2:2"],"correct":1,"difficulty":2,"explanation":"Второй закон Менделя: 3 части с доминантным признаком, 1 — с рецессивным."},{"type":"single","text":"При скрещивании Aa × Aa расщепление по генотипу:","options":["1:2:1","3:1","9:3:3:1","1:1"],"correct":0,"difficulty":2,"explanation":"1 AA : 2 Aa : 1 aa."},{"type":"single","text":"Скрестили AA и aa. Какой генотип у всех гибридов F₁?","options":["AA","aa","Aa","разные"],"correct":2,"difficulty":1,"explanation":"Первый закон Менделя: все гибриды единообразны — Aa."},{"type":"single","text":"Какие гаметы образуются у организма с генотипом Aa?","options":["только A","только a","A и a","AA и aa"],"correct":2,"difficulty":2,"explanation":"Закон чистоты гамет: в гамету идёт один ген из пары — A или a (поровну)."},{"type":"single","text":"Расщепление 9:3:3:1 характерно для скрещивания:","options":["моногибридного","дигибридного (AaBb × AaBb)","анализирующего","сцепленного"],"correct":1,"difficulty":3,"explanation":"Третий закон Менделя — независимое наследование двух пар признаков."},{"type":"single","text":"Хромосомный набор мужчины:","options":["44 аутосомы + XX","44 аутосомы + XY","22 + XX","46 + XY"],"correct":1,"difficulty":2,"explanation":"44 аутосомы и половые XY (женский — XX)."},{"type":"single","text":"Вероятность рождения мальчика:","options":["25%","50%","75%","100%"],"correct":1,"difficulty":1,"explanation":"Гаметы отца X и Y равновероятны → 50%."},{"type":"single","text":"Для чего используется решётка Пеннета?","options":["определения мутаций","предсказания генотипов потомства","подсчёта хромосом","изучения ДНК"],"correct":1,"difficulty":2,"explanation":"Решётка Пеннета — таблица комбинаций гамет родителей."}]},{"title":"Эволюция и экология","grade_min":9,"grade_max":11,"order":3,"theory":"<h3>Эволюционное учение Ч. Дарвина<\/h3><p><b>Эволюция<\/b> — историческое развитие живой природы. Движущие силы по Дарвину:<\/p><ul><li><b>Наследственная изменчивость<\/b> — материал для отбора;<\/li><li><b>Борьба за существование<\/b> — следствие перенаселения и ограниченности ресурсов;<\/li><li><b>Естественный отбор<\/b> — выживание и размножение особей с полезными признаками.<\/li><\/ul><p>Результат: приспособленность видов, многообразие видов, образование новых видов. Доказательства эволюции: палеонтологические (ископаемые, переходные формы — археоптерикс, стегоцефал), сравнительно-анатомические (гомологичные органы, рудименты, атавизмы), эмбриологические (закон Геккеля–Мюллера).<\/p><h3>Виды отбора<\/h3><ul><li><b>Движущий<\/b> — сдвиг нормы признака (индустриальный меланизм бабочек);<\/li><li><b>Стабилизирующий<\/b> — сохранение средней нормы;<\/li><li><b>Дизруптивный (разрывающий)<\/b> — выживают крайние формы.<\/li><\/ul><h3>Экология: уровни организации<\/h3><p>Организм → популяция → вид → <b>биоценоз<\/b> (сообщество) → <b>экосистема/биогеоценоз<\/b> → биосфера.<\/p><h3>Экосистема<\/h3><ul><li><b>Продуценты<\/b> — производители (растения, фотосинтез);<\/li><li><b>Консументы<\/b> — потребители (травоядные — I порядка, хищники — II и выше);<\/li><li><b>Редуценты<\/b> — разрушители (бактерии, грибы) — возвращают вещества в почву.<\/li><\/ul><p><b>Пищевые цепи<\/b>: правило 10% (Линдемана) — на каждый следующий уровень переходит ~10% энергии; цепи редко длиннее 4–5 звеньев.<\/p><h3>Биосфера<\/h3><p>Учение о биосфере создал <b>В.И. Вернадский<\/b>. Живое вещество биосферы выполняет энергетическую, газовую, концентрационную и другие функции. Глобальные проблемы: парниковый эффект, разрушение озонового слоя, кислотные дожди, опустынивание.<\/p>","questions":[{"type":"single","text":"Кто создал эволюционное учение на основе естественного отбора?","options":["Ламарк","Дарвин","Мендель","Вернадский"],"correct":1,"difficulty":1,"explanation":"Чарльз Дарвин, «Происхождение видов» (1859)."},{"type":"single","text":"Движущие силы эволюции по Дарвину:","options":["только мутации","изменчивость, борьба за существование, естественный отбор","упражнение органов","скрещивание"],"correct":1,"difficulty":1,"explanation":"Три фактора: наследственная изменчивость, борьба за существование и естественный отбор."},{"type":"single","text":"Археоптерикс — это:","options":["древняя рептилия","переходная форма между пресмыкающимися и птицами","древняя рыба","предок млекопитающих"],"correct":1,"difficulty":2,"explanation":"Переходная форма: признаки рептилий (зубы, хвост) и птиц (перья)."},{"type":"single","text":"Организмы, создающие органические вещества из неорганических, — это:","options":["консументы","редуценты","продуценты","хищники"],"correct":2,"difficulty":1,"explanation":"Продуценты — зелёные растения (фотосинтез) и хемосинтетики."},{"type":"single","text":"Грибы и бактерии, разлагающие органику, относятся к:","options":["продуцентам","консументам I порядка","редуцентам","автотрофам"],"correct":2,"difficulty":1,"explanation":"Редуценты (разрушители) возвращают минеральные вещества в почву."},{"type":"single","text":"Согласно правилу 10%, на следующий уровень пищевой цепи переходит энергии:","options":["100%","50%","~10%","1%"],"correct":2,"difficulty":2,"explanation":"Правило Линдемана: ~10% энергии передаётся на следующий трофический уровень."},{"type":"single","text":"Автор учения о биосфере:","options":["Вернадский","Дарвин","Линней","Геккель"],"correct":0,"difficulty":1,"explanation":"В.И. Вернадский — создатель современного учения о биосфере."},{"type":"single","text":"Пример движущего отбора:","options":["сохранение среднего роста","индустриальный меланизм бабочек","стабильность вида","постоянство окраски"],"correct":1,"difficulty":3,"explanation":"Потемнение бабочек в загрязнённых районах — сдвиг нормы признака под давлением отбора."},{"type":"single","text":"Рудименты — это:","options":["признаки, появляющиеся у отдельных особей","недоразвитые органы, утратившие функцию","полезные новые признаки","органы хищников"],"correct":1,"difficulty":2,"explanation":"Рудименты — остатки органов предков (аппендикс, копчик, третье веко у человека). Атавизмы — проявление признаков далёких предков у отдельных особей (хвостатость)."},{"type":"single","text":"Правильная пищевая цепь:","options":["лиса → заяц → трава","трава → заяц → лиса","волк → трава → мышь","грибы → трава → корова"],"correct":1,"difficulty":1,"explanation":"Цепь начинается с продуцента: трава → травоядное → хищник."}]},{"title":"Организм человека: основные системы","grade_min":8,"grade_max":8,"order":4,"theory":"<h3>Кровеносная система<\/h3><p>Сердце — 4 камеры (2 предсердия, 2 желудочка). <b>Большой круг:<\/b> левый желудочек → аорта → артерии → капилляры органов → вены → правое предсердие. <b>Малый (лёгочный):<\/b> правый желудочек → лёгочная артерия → капилляры лёгких (газообмен) → лёгочные вены → левое предсердие.<\/p><p>Артерии — от сердца (кроме лёгочной артерии), вены — к сердцу. Кровь: плазма + эритроциты (транспорт O₂, гемоглобин), лейкоциты (иммунитет), тромбоциты (свёртывание).<\/p><h3>Дыхательная система<\/h3><p>Носовая полость → глотка → гортань → трахея → бронхи → лёгкие (альвеолы). Газообмен в альвеолах: O₂ в кровь, CO₂ из крови — по законам диффузии. Дыхательный центр — в продолговатом мозге.<\/p><h3>Пищеварительная система<\/h3><p>Ротовая полость (амилаза слюны — углеводы) → глотка → пищевод → желудок (HCl и пепсин — белки) → тонкая кишка (двенадцатиперстная: желчь из печени + сок поджелудочной; всасывание через ворсинки) → толстая кишка (всасывание воды, микрофлора).<\/p><h3>Нервная система<\/h3><ul><li><b>ЦНС:<\/b> головной мозг (5 отделов: продолговатый, задний — мост и мозжечок, средний, промежуточный, передний/большие полушария) и спинной мозг;<\/li><li><b>Периферическая:<\/b> нервы и нервные узлы; делится на соматическую (скелетные мышцы) и вегетативную (симпатическая — «стресс», парасимпатическая — «покой»);<\/li><li><b>Рефлекс<\/b> — ответная реакция на раздражение через нервную систему; основа — рефлекторная дуга (рецептор → чувствительный нейрон → ЦНС → двигательный нейрон → орган).<\/li><\/ul><h3>Эндокринная система<\/h3><p>Железы внутренней секреции выделяют гормоны в кровь: гипофиз («дирижёр»), щитовидная (тироксин — обмен веществ; при нехватке йода — зоб), надпочечники (адреналин), поджелудочная (инсулин — снижает сахар; нехватка — диабет), половые железы.<\/p><h3>Опорно-двигательная система<\/h3><p>Скелет (200+ костей) + мышцы. Соединения: неподвижные (швы черепа), полуподвижные (позвоночник), подвижные (суставы). Скелетная мышца: сокращение поперечно-полосатых волокон под действием импульсов.<\/p>","questions":[{"type":"single","text":"Из скольких камер состоит сердце человека?","options":["2","3","4","5"],"correct":2,"difficulty":1,"explanation":"Два предсердия и два желудочка — 4 камеры."},{"type":"single","text":"Малый круг кровообращения начинается в:","options":["левом желудочке","правом желудочке","левом предсердии","аорте"],"correct":1,"difficulty":2,"explanation":"Правый желудочек → лёгочная артерия → лёгкие → лёгочные вены → левое предсердие."},{"type":"single","text":"Газообмен в лёгких происходит в:","options":["бронхах","трахее","альвеолах","гортани"],"correct":2,"difficulty":1,"explanation":"Альвеолы — пузырьки, оплетённые капиллярами; там O₂ переходит в кровь, CO₂ — наружу."},{"type":"single","text":"Расщепление белков начинается в:","options":["ротовой полости","желудке","тонкой кишке","пищеводе"],"correct":1,"difficulty":2,"explanation":"В желудке пепсин в кислой среде начинает расщеплять белки (углеводы — во рту амилазой)."},{"type":"single","text":"Какая железа вырабатывает инсулин?","options":["щитовидная","гипофиз","поджелудочная","надпочечники"],"correct":2,"difficulty":2,"explanation":"Инсулин вырабатывают клетки поджелудочной железы; он снижает уровень глюкозы в крови."},{"type":"single","text":"Дыхательный центр расположен в:","options":["мозжечке","продолговатом мозге","больших полушариях","промежуточном мозге"],"correct":1,"difficulty":2,"explanation":"Продолговатый мозг регулирует дыхание, сердцебиение и другие жизненно важные рефлексы."},{"type":"single","text":"Эритроциты выполняют функцию:","options":["защиты от инфекций","переноса кислорода","свёртывания крови","выработки антител"],"correct":1,"difficulty":1,"explanation":"Гемоглобин эритроцитов переносит O₂ (и часть CO₂). Лейкоциты — защита, тромбоциты — свёртывание."},{"type":"single","text":"Какой отдел вегетативной нервной системы активируется при стрессе?","options":["парасимпатический","симпатический","соматический","центральный"],"correct":1,"difficulty":3,"explanation":"Симпатическая система — «бей или беги»; парасимпатическая — покой и восстановление."},{"type":"single","text":"Правильный порядок дыхательных путей:","options":["нос → гортань → глотка → трахея → бронхи","нос → глотка → гортань → трахея → бронхи","трахея → нос → бронхи → лёгкие","нос → трахея → гортань → бронхи"],"correct":1,"difficulty":2,"explanation":"Носовая полость → глотка → гортань → трахея → бронхи → лёгкие."},{"type":"single","text":"Рефлекторная дуга начинается с:","options":["ЦНС","рецептора","рабочего органа","двигательного нейрона"],"correct":1,"difficulty":2,"explanation":"Путь: рецептор → чувствительный нейрон → нервный центр → двигательный нейрон → эффектор (орган)."}]}]}]},{"title":"География","icon":"🌍","color":"#1098ad","order":5,"sections":[{"title":"Физическая география","order":1,"topics":[{"title":"План, карта и географические координаты","grade_min":5,"grade_max":6,"order":1,"theory":"<h3>План местности и карта<\/h3><p><b>План<\/b> — чертёж небольшого участка местности в крупном масштабе. <b>Географическая карта<\/b> — уменьшенное обобщённое изображение поверхности Земли на плоскости с помощью условных знаков.<\/p><p><b>Масштаб<\/b> — отношение длины на карте к длине на местности: 1:100 000 означает, что 1 см карты = 100 000 см = 1 км местности. Виды: именованный, численный, линейный.<\/p><h3>Стороны горизонта и азимут<\/h3><p>Основные стороны: север (С), юг (Ю), запад (З), восток (В). <b>Азимут<\/b> — угол между направлением на север и на объект, отсчитывается по часовой стрелке от 0° до 360°. На восток — 90°, на юг — 180°, на запад — 270°.<\/p><h3>Градусная сетка<\/h3><ul><li><b>Экватор<\/b> — 0° широты; <b>параллели<\/b> — линии, параллельные экватору;<\/li><li><b>Нулевой (Гринвичский) меридиан<\/b> — 0° долготы; <b>меридианы<\/b> соединяют полюса;<\/li><li><b>Географическая широта<\/b> — расстояние в градусах от экватора до параллели (северная/южная, 0–90°);<\/li><li><b>Географическая долгота<\/b> — от нулевого меридиана до объекта (западная/восточная, 0–180°).<\/li><\/ul><p>Любая точка определяется парой: широта + долгота. Пример: Астана ≈ 51° с.ш., 71° в.д.<\/p><h3>Условные знаки и изображение рельефа<\/h3><p>Рельеф на картах показывают <b>горизонталями<\/b> (изогипсами) — линиями равной высоты. Чем ближе горизонтали, тем круче склон. Бергштрихи показывают направление склона. Высоты точек — отметками, глубины — изобатами.<\/p><h3>Литосфера и рельеф Земли<\/h3><p>Земная кора + верхняя мантия = литосфера, разделённая на <b>литосферные плиты<\/b>. Границы плит — зоны землетрясений и вулканизма. Крупнейшие формы рельефа: материки и океаны, горы и равнины. Глубочайшая впадина — Марианская (11 022 м), высочайшая вершина — Джомолунгма (Эверест, 8848 м).<\/p>","questions":[{"type":"single","text":"Что показывает масштаб карты?","options":["направление на север","во сколько раз уменьшены расстояния","высоту местности","азимут"],"correct":1,"difficulty":1,"explanation":"Масштаб показывает, во сколько раз расстояния на карте меньше реальных."},{"type":"single","text":"Масштаб 1:250 000 означает, что 1 см на карте равен:","options":["250 м","2,5 км","25 км","250 км"],"correct":1,"difficulty":2,"explanation":"250 000 см = 2500 м = 2,5 км."},{"type":"single","text":"Азимут на юг равен:","options":["90°","180°","270°","0°"],"correct":1,"difficulty":1,"explanation":"От севера по часовой стрелке: восток 90°, юг 180°, запад 270°."},{"type":"single","text":"Широта отсчитывается от:","options":["нулевого меридиана","экватора","полюса","Гринвича"],"correct":1,"difficulty":1,"explanation":"Географическая широта — от экватора (0°) до полюсов (90°)."},{"type":"single","text":"Долгота отсчитывается от:","options":["экватора","нулевого (Гринвичского) меридиана","Северного полюса","меридиана 180°"],"correct":1,"difficulty":1,"explanation":"Географическая долгота — от нулевого меридиана, проходящего через Гринвич."},{"type":"single","text":"Какие линии на карте соединяют точки одинаковой высоты?","options":["меридианы","параллели","горизонтали","изобаты"],"correct":2,"difficulty":2,"explanation":"Горизонтали (изогипсы) показывают рельеф; чем они ближе, тем круче склон."},{"type":"single","text":"Самая высокая вершина Земли:","options":["Хан-Тенгри","Джомолунгма (Эверест)","Монблан","Эльбрус"],"correct":1,"difficulty":1,"explanation":"Эверест (Джомолунгма) — 8848 м, Гималаи."},{"type":"single","text":"Самая глубокая океаническая впадина:","options":["Зондская","Марианская","Курило-Камчатская","Филиппинская"],"correct":1,"difficulty":1,"explanation":"Марианский жёлоб в Тихом океане — около 11 022 м."},{"type":"single","text":"Город с координатами ≈ 51° с.ш. 71° в.д. — это:","options":["Алматы","Астана","Шымкент","Атырау"],"correct":1,"difficulty":2,"explanation":"Астана (Акмола) расположена на 51° с.ш., 71° в.д. Алматы — 43° с.ш., 77° в.д."},{"type":"single","text":"Литосферные плиты движутся, и в зонах их границ чаще происходят:","options":["наводнения","землетрясения и извержения вулканов","засухи","ураганы"],"correct":1,"difficulty":2,"explanation":"Границы плит — сейсмически и вулканически активные зоны (например, Тихоокеанское огненное кольцо)."}]}]},{"title":"География Казахстана","order":2,"topics":[{"title":"Рельеф и полезные ископаемые Казахстана","grade_min":7,"grade_max":8,"order":1,"theory":"<h3>Общая характеристика<\/h3><p>Казахстан — 9-я по площади страна мира (<b>2 724,9 тыс. км²<\/b>). Около <b>3/4 территории занимают равнины и низменности<\/b>, средняя высота — 300–400 м над уровнем моря. Крайние точки: на севере — 55° с.ш., на юге — 40° с.ш.; на западе — 46° в.д., на востоке — 87° в.д.<\/p><h3>Основные формы рельефа<\/h3><ul><li><b>Западно-Сибирская равнина<\/b> — север и северо-восток (низменная, заболоченная южная часть);<\/li><li><b>Туранская низменность<\/b> — юго-запад; здесь <b>впадина Карагие (Каракия)<\/b> — 132 м ниже уровня моря — самая низкая точка Казахстана;<\/li><li><b>Прикаспийская низменность<\/b> — запад;<\/li><li><b>Сарыарка (Казахский мелкосопочник)<\/b> — центр; древние разрушенные горы (высшая точка — Аксоран, 1566 м);<\/li><li><b>Тургайское плато<\/b> — север-центр (Тургайская ложбина — древний пролив между морями);<\/li><li><b>Устюрт<\/b> — плато на западе (граница с Туранской низменностью — чинки);<\/li><li><b>Алтай<\/b> — восток (высшая точка Казахстана — <b>г. Белуха, 4506 м<\/b>);<\/li><li><b>Жетысу (Северный) Тянь-Шань и Джунгарский Алатау<\/b> — юго-восток; <b>г. Хан-Тенгри (6995/7010 м)<\/b> — высочайшая вершина страны на границе с Кыргызстаном и Китаем.<\/li><\/ul><h3>Полезные ископаемые<\/h3><ul><li>Казахстан — «кладовая» таблицы Менделеева: найдены почти все элементы;<\/li><li><b>Нефть и газ:<\/b> Западный Казахстан (Тенгиз, Кашаган, Карачаганак, Прикаспий);<\/li><li><b>Уголь:<\/b> Карагандинский, Экибастузский бассейны;<\/li><li><b>Железо:<\/b> Соколовско-Сарбайское (Костанайская область);<\/li><li><b>Медь:<\/b> Конырат, Жезказган (жез — «медь», кен — «руда»);<\/li><li><b>Уран<\/b> — 1-е место в мире по добыче; <b>хром, фосфориты (Каратау), золото, полиметаллы Алтая<\/b>.<\/li><\/ul><h3>Сейсмичность<\/h3><p>Юг и восток — горные сейсмоактивные зоны (9–10 баллов): Алматы, Тараз, Шымкент. Землетрясения связаны со столкновением Индостанской и Евразийской плит.<\/p>","questions":[{"type":"single","text":"Какова площадь Казахстана?","options":["1,7 млн км²","2,72 млн км²","3,5 млн км²","2,1 млн км²"],"correct":1,"difficulty":1,"explanation":"2 724,9 тыс. км² — 9-е место в мире."},{"type":"single","text":"Самая низкая точка Казахстана:","options":["впадина Карагие (−132 м)","Тургайская ложбина","озеро Балхаш","Каспийская низменность"],"correct":0,"difficulty":2,"explanation":"Впадина Карагие (Каракия) на полуострове Мангышлак — 132 м ниже уровня моря."},{"type":"single","text":"Высочайшая вершина Казахстана:","options":["Белуха","Хан-Тенгри","Аксоран","Талгар"],"correct":1,"difficulty":2,"explanation":"Хан-Тенгри (6995 м по казахстанским данным) — высшая точка страны; Белуха (4506 м) — высшая точка Алтайской системы и всего Казахстанского Алтая."},{"type":"single","text":"Сарыарка — это:","options":["горы на юге","мелкосопочник в центре Казахстана","равнина на западе","плато на востоке"],"correct":1,"difficulty":1,"explanation":"Казахский мелкосопочник — древние невысокие горы в центре страны; высшая точка — Аксоран (1566 м)."},{"type":"single","text":"Главный нефтяной регион Казахстана:","options":["Западный Казахстан","Центральный","Северный","Восточный"],"correct":0,"difficulty":1,"explanation":"Прикаспийская нефтегазоносная провинция: Тенгиз, Кашаган, Карачаганак."},{"type":"single","text":"Экибастузский бассейн известен добычей:","options":["нефти","угля","железа","меди"],"correct":1,"difficulty":1,"explanation":"Экибастуз — крупный угольный бассейн (Павлодарская область)."},{"type":"single","text":"Соколовско-Сарбайское месторождение — это:","options":["железная руда","золото","фосфориты","газ"],"correct":0,"difficulty":2,"explanation":"Крупнейшее месторождение железной руды (Рудный, Костанайская область)."},{"type":"single","text":"По добыче какого полезного ископаемого Казахстан занимает 1-е место в мире?","options":["нефть","уголь","уран","золото"],"correct":2,"difficulty":2,"explanation":"Казахстан — мировой лидер по добыче урана."},{"type":"single","text":"Какая часть территории Казахстана занята равнинами и низменностями?","options":["около 1/4","около половины","около 3/4","почти всё"],"correct":2,"difficulty":2,"explanation":"Равнины и низкогорья занимают примерно 3/4 территории."},{"type":"single","text":"Какие города Казахстана находятся в наиболее сейсмоопасной зоне?","options":["Астана и Костанай","Алматы и Тараз","Актобе и Уральск","Петропавловск и Павлодар"],"correct":1,"difficulty":2,"explanation":"Юг и юго-восток (9–10 баллов): Алматы, Тараз, Шымкент — зона горного сейсмического пояса."}]},{"title":"Климат и внутренние воды Казахстана","grade_min":7,"grade_max":8,"order":2,"theory":"<h3>Климат<\/h3><p>Климат Казахстана <b>резко континентальный<\/b>: большая удалённость от океанов, равнинность территории, свободное проникновение воздушных масс с севера и юга.<\/p><ul><li>Зима холодная (от −19°C на севере до −4…−5°C на юге), лето жаркое и сухое (+19°C на севере, +28…+29°C на юге);<\/li><li>Амплитуда температур большая — до 90°C (абсолютный максимум +49°C на юге, минимум −57°C на севере, Атбасар/Аксубулак);<\/li><li>Осадков мало: на равнинах 100–300 мм/год, в горах до 1000–1600 мм;<\/li><li>Суховеи, пыльные бури, джут (зимний падеж скота из-за ледяной корки), заморозки.<\/li><\/ul><p>Влияющие факторы: солнечная радиация, циркуляция (западный перенос, сибирский антициклон зимой, южные циклоны), подстилающая поверхность.<\/p><h3>Реки<\/h3><p>В Казахстане ~8500 рек длиной более 10 км. Крупнейшие:<\/p><ul><li><b>Ертыс (Иртыш)<\/b> — 4248 км (в пределах РК — 1700 км), единственная крупная река, впадающая в океан (Северный Ледовитый, через Обь);<\/li><li><b>Сырдария<\/b> — 2212 км, впадает в Аральское море;<\/li><li><b>Жайык (Урал)<\/b> — 2428 км, в Каспий;<\/li><li><b>Или<\/b> — 1001 км, в Балхаш (даёт ~80% его стока);<\/li><li><b>Есиль, Нура, Тобол, Шу, Талас.<\/b><\/li><\/ul><p>Питание: на севере — снеговое, на юге — ледниково-снеговое (горные реки). Большинство равнинных рек юга пересыхает. Реки замерзают зимой (на севере до 5 месяцев).<\/p><h3>Озёра<\/h3><ul><li><b>Каспийское море<\/b> — крупнейшее озеро мира (371 тыс. км²);<\/li><li><b>Аральское море<\/b> — экологическая катастрофа: из-за забора воды на орошение с 1960-х усохло более чем на 90%, разделилось на Северный (Малый) и Южный Арал; Северный Арал восстанавливается после постройки Кокаральской плотины (2005);<\/li><li><b>Балхаш<\/b> — уникально: западная часть пресная, восточная — солёная (узкий пролив Ушарал);<\/li><li><b>Зайсан, Алаколь, Тенгиз, Селетенгиз, Кургальджин.<\/b><\/li><\/ul><h3>Ледники и каналы<\/h3><p>В горах ~2700 ледников (Иле Алатау, Джунгарский Алатау, Алтай). Крупнейший — Корженевского. Канал имени Каныша Сатпаева (Иртыш — Караганда, 451 км) — уникальное гидротехническое сооружение. Водохранилища: Бухтарминское, Капшагайское, Шардаринское.<\/p>","questions":[{"type":"single","text":"Тип климата Казахстана:","options":["морской","резко континентальный","муссонный","средиземноморский"],"correct":1,"difficulty":1,"explanation":"Удалённость от океанов и равнинность дают резко континентальный климат с большой амплитудой температур."},{"type":"single","text":"Самая длинная река, протекающая по территории Казахстана:","options":["Сырдария","Иртыш (Ертыс)","Урал (Жайык)","Или"],"correct":1,"difficulty":2,"explanation":"Ертыс — 4248 км общей длины (в РК — около 1700 км), самая длинная река Казахстана."},{"type":"single","text":"Единственная крупная река Казахстана, относящаяся к бассейну Северного Ледовитого океана:","options":["Или","Сырдария","Иртыш","Жайык"],"correct":2,"difficulty":2,"explanation":"Иртыш — приток Оби — несёт воды в Северный Ледовитый океан. Остальные реки — бессточные или внутреннего стока."},{"type":"single","text":"Река Или впадает в озеро:","options":["Аральское","Балхаш","Алаколь","Зайсан"],"correct":1,"difficulty":1,"explanation":"Или — главный источник питания Балхаша (~80% стока)."},{"type":"single","text":"В чём уникальность озера Балхаш?","options":["самое глубокое в мире","западная часть пресная, восточная — солёная","полностью пересыхает","расположено ниже уровня моря"],"correct":1,"difficulty":1,"explanation":"Благодаря стоку Или западная часть пресная, а узкий пролив Ушарал ограничивает перемешивание — восточная солёная."},{"type":"single","text":"Главная причина усыхания Аральского моря:","options":["землетрясения","забор воды рек на орошение","извержения вулканов","потепление климата в мире"],"correct":1,"difficulty":2,"explanation":"С 1960-х воды Сырдарии и Амударии разбирались на полив хлопковых полей — сток в море резко сократился."},{"type":"single","text":"Среднегодовое количество осадков на равнинах Казахстана:","options":["100–300 мм","500–700 мм","1000 мм","более 1500 мм"],"correct":0,"difficulty":2,"explanation":"Равнины засушливы: 100–300 мм в год; в горах — до 1000–1600 мм."},{"type":"single","text":"Джут — это:","options":["пыльная буря","зимний падеж скота из-за ледяной корки на пастбищах","летний суховей","вид орошения"],"correct":1,"difficulty":2,"explanation":"При оттепелях с последующим морозом пастбища покрываются льдом — скот не может добывать траву и гибнет."},{"type":"single","text":"Канал имени Каныша Сатпаева соединяет:","options":["Иртыш и Карагандинский регион","Арал и Каспий","Балхаш и Алаколь","Каспий и Волгу"],"correct":0,"difficulty":3,"explanation":"Канал Иртыш — Караганда (451 км) подаёт иртышскую воду в центральный Казахстан."},{"type":"single","text":"Крупнейшее озеро мира, омывающее берега Казахстана:","options":["Балхаш","Аральское","Каспийское море","Зайсан"],"correct":2,"difficulty":1,"explanation":"Каспий — крупнейшее замкнутое озеро Земли (~371 тыс. км²)."}]},{"title":"Население и хозяйство Казахстана","grade_min":9,"grade_max":10,"order":3,"theory":"<h3>Население<\/h3><p>Численность населения Казахстана превысила <b>20 млн человек (2023)<\/b>. Плотность — одна из самых низких в мире: ~7 чел./км². Размещение неравномерно: густо заселены юг, юго-восток и зоны оазисного земледелия; редко — пустыни и северные равнины.<\/p><ul><li><b>Городское население<\/b> — свыше 62%;<\/li><li>Крупнейшие города: <b>Алматы<\/b> (свыше 2 млн), <b>Астана<\/b> (столица с 1997 г., свыше 1,4 млн), <b>Шымкент<\/b> (свыше 1,1 млн) — города-миллионеры;<\/li><li>Более <b>130 этносов<\/b>; казахи — свыше 70%, русские — около 15%. Государственный язык — казахский; официальный — русский.<\/li><\/ul><h3>Экономика<\/h3><ul><li><b>Промышленность:<\/b> горнодобывающая (нефть, газ, уран, уголь, руды) — основа экспорта; металлургия (Караганда, Темиртау — «Магнитка Казахстана», Рудный, Усть-Каменогорск); нефтепереработка (Атырау, Павлодар, Шымкент);<\/li><li><b>Энергетика:<\/b> ТЭС на экибастузском угле (Экибастузская ГРЭС-1), ГЭС на Иртыше (Бухтарминская), новые ВИЭ (ветропарки, солнечные станции);<\/li><li><b>Сельское хозяйство:<\/b> север — зерновое хозяйство (пшеница, «целина»), юг — поливное земледелие (хлопок, рис, бахчевые, виноград), повсеместно — животноводство (овцеводство, коневодство, верблюдоводство);<\/li><li><b>Транспорт:<\/b> ж/д «Жезказган — Бейнеу», международный коридор «Западная Европа — Западный Китай», морские порты Актау и Курык на Каспии, трубопроводы (Казахстан — Китай, КТК).<\/li><\/ul><h3>Экономические районы<\/h3><p>Выделяют 5–8 экономических районов: Центральный (промышленность), Восточный (энергетика, металлургия Алтая), Западный (нефть и газ), Северный (зерно, железная руда), Южный (поливное земледелие, лёгкая промышленность), Жетысу.<\/p><h3>Внешняя торговля<\/h3><p>Экспорт: нефть, газ, уран, металлы, зерно. Основные партнёры: Китай, Россия, страны ЕС (Италия, Нидерланды), ЕАЭС.<\/p>","questions":[{"type":"single","text":"Столица Казахстана и год её переноса из Алматы:","options":["Астана, 1997","Шымкент, 1995","Караганда, 2000","Астана, 1991"],"correct":0,"difficulty":1,"explanation":"Столица перенесена в Акмолу (переименована в Астану) в 1997 году."},{"type":"single","text":"Средняя плотность населения Казахстана — около:","options":["7 чел./км²","70 чел./км²","2 чел./км²","30 чел./км²"],"correct":0,"difficulty":2,"explanation":"Одна из самых низких в мире: ~7 человек на км² (население >20 млн, площадь 2,72 млн км²)."},{"type":"single","text":"Самый крупный город Казахстана:","options":["Астана","Шымкент","Алматы","Караганда"],"correct":2,"difficulty":1,"explanation":"Алматы — крупнейший город (более 2 млн жителей)."},{"type":"single","text":"Какой город называют «Магниткой Казахстана»?","options":["Рудный","Темиртау","Экибастуз","Жезказган"],"correct":1,"difficulty":2,"explanation":"Темиртау — центр чёрной металлургии (Казахстанская Магнитка) рядом с Карагандой."},{"type":"single","text":"Основная зерновая зона Казахстана:","options":["юг","север","запад","центр"],"correct":1,"difficulty":1,"explanation":"Северные области (Костанайская, Акмолинская, СКО) — главная житница (пшеница)."},{"type":"single","text":"Морской порт Казахстана на Каспийском море:","options":["Актау","Атырау","Бейнеу","Жанаозен"],"correct":0,"difficulty":2,"explanation":"Актау (и новый порт Курык) — морские ворота страны на Каспии."},{"type":"single","text":"Главная статья экспорта Казахстана:","options":["зерно","нефть и нефтепродукты","лёгкая промышленность","древесина"],"correct":1,"difficulty":1,"explanation":"Топливно-энергетические товары (нефть, газ, уран) и металлы — основа экспорта."},{"type":"single","text":"Какая доля населения Казахстана живёт в городах (примерно)?","options":["около 30%","более 60%","около 90%","менее 10%"],"correct":1,"difficulty":2,"explanation":"Уровень урбанизации — свыше 62%."},{"type":"single","text":"Международный транзитный коридор через Казахстан:","options":["«Западная Европа — Западный Китай»","«Север — Юг» через Балхаш","Транссахиб","«Большой Шёлковый путь» по морю"],"correct":0,"difficulty":2,"explanation":"Автомагистраль «Западная Европа — Западный Китай» проходит через территорию Казахстана."},{"type":"single","text":"Казахстан входит в экономический союз:","options":["НАТО","ЕАЭС","ОПЕК","АСЕАН"],"correct":1,"difficulty":1,"explanation":"ЕАЭС (Евразийский экономический союз) — с 2015 года; также ШОС, ОТГ и др."}]}]}]},{"title":"История Казахстана","icon":"🏹","color":"#f59f00","order":6,"sections":[{"title":"Древний и средневековый Казахстан","order":1,"topics":[{"title":"Саки, усунь и кангюй","grade_min":5,"grade_max":6,"order":1,"theory":"<h3>Саки (VIII–III вв. до н.э.)<\/h3><p><b>Саки<\/b> — племена раннего железного века, населявшие Казахстан и Среднюю Азию. Персидские источники называли их «турами с резвыми конями», древние греки — скифами. Деление на группы:<\/p><ul><li><b>саки-тиграхауда<\/b> («носящие остроконечные шапки») — Жетысу и Сырдарья;<\/li><li><b>саки-хаомаварга<\/b> («изготовляющие напиток хаома») — Приаралье;<\/li><li><b>саки-парадарайя<\/b> («заморские») — Причерноморье.<\/li><\/ul><h3>Занятия и общество<\/h3><p>Основа хозяйства — <b>кочевое скотоводство<\/b> (лошади, овцы, верблюды) и поливное земледелие в долинах рек. Города: Чирик-Рабат, Бабиш-Молда, Балланды. Общество делилось на воинов (красная одежда), жрецов (белая), общинников-скотоводов (жёлтая, голубая). «Звериный стиль» в искусстве — изображения животных из золота.<\/p><h3>Ключевые события и личности<\/h3><ul><li><b>Царица Томирис<\/b> — в <b>530 г. до н.э.<\/b> разгромила войско персидского царя Кира II; Кир погиб;<\/li><li><b>Ширак<\/b> — сак-воин, который, по преданию, завёл войско персидского царя Дария I в безводную пустыню и погиб сам (519 г. до н.э.);<\/li><li><b>«Золотой человек»<\/b> — захоронение сакского воина (вождя) V–IV вв. до н.э. в кургане <b>Иссык<\/b> близ Алматы; найдено в 1969 г. археологом К. Акишевым; золотые украшения, серебряная чаша с надписью — древнейший памятник письменности на территории Казахстана.<\/li><\/ul><h3>Усуни (III в. до н.э. — V в. н.э.)<\/h3><p>Государство в <b>Жетысу<\/b> (Семиречье), центр — долина реки Или, район озера Иссык-Куль. Столица — <b>г. Чигучен (Красная долина)<\/b>. Правитель — <b>гуньмо<\/b> («великий князь»). Общество: знать («белые»), свободные общинники, рабы. Занимались кочевым скотоводством и земледелием. Воевали и торговали с Китаем (династические браки).<\/p><h3>Кангюй (III в. до н.э. — V в. н.э.)<\/h3><p>Государство в среднем течении <b>Сырдарьи<\/b> и предгорьях Каратау. Столица — <b>Битянь<\/b>. Правитель — верховный бек; делилось на <b>5 владений<\/b>. Контролировало участок Великого Шёлкового пути. Хозяйство: скотоводство и оазисное земледелие. Письменные свидетельства — китайские источники («Шицзи» Сыма Цяня).<\/p><h3>Великий Шёлковый путь<\/h3><p>Со II в. до н.э. через земли саков, усуней и кангюя проходил Шёлковый путь, связывавший Китай со Средиземноморьем; города юга Казахстана росли как торговые центры.<\/p>","questions":[{"type":"single","text":"Когда саки под предводительством царицы Томирис разгромили войско персидского царя Кира?","options":["в 530 г. до н.э.","в 330 г. до н.э.","в 519 г. до н.э.","в 480 г. до н.э."],"correct":0,"difficulty":2,"explanation":"530 г. до н.э. — гибель Кира II в войне с саками (массагетами) Томирис."},{"type":"single","text":"«Золотой человек» был найден в кургане:","options":["Берель","Иссык","Бесшатыр","Таксай"],"correct":1,"difficulty":1,"explanation":"Курган Иссык близ Алматы, 1969 г., экспедиция К. Акишева."},{"type":"single","text":"Саки-тиграхауда назывались так, потому что:","options":["носили остроконечные шапки","жили у моря","пили напиток хаому","воевали на колесницах"],"correct":0,"difficulty":2,"explanation":"«Тиграхауда» — «носящие остроконечные (тигровидные) шапки»; обитали в Жетысу и долине Сырдарьи."},{"type":"single","text":"Где располагалось государство усуней?","options":["в Приаралье","в Жетысу (Семиречье)","на Алтае","у Каспия"],"correct":1,"difficulty":1,"explanation":"Усуни занимали Жетысу — долину реки Или и район Иссык-Куля, столица Чигучен."},{"type":"single","text":"Как назывался правитель усуней?","options":["шаньюй","гуньмо","джебгу","хан"],"correct":1,"difficulty":2,"explanation":"Гуньмо — «великий князь», титул усуньских правителей."},{"type":"single","text":"Государство кангюй располагалось в долине реки:","options":["Или","Сырдарья","Ертыс","Жайык"],"correct":1,"difficulty":2,"explanation":"Кангюй — среднее течение Сырдарьи и предгорья Каратау, столица Битянь."},{"type":"single","text":"Сакский воин Ширак прославился тем, что:","options":["победил Кира","завёл войско Дария I в пустыню и погиб","нашёл Золотого человека","основал город Чирик-Рабат"],"correct":1,"difficulty":2,"explanation":"По преданию, Ширак обманом увёл войско персов в безводную пустыню, пожертвовав собой (519 г. до н.э.)."},{"type":"single","text":"Основное занятие саков:","options":["земледелие","кочевое скотоводство","рыболовство","ремесло и торговля"],"correct":1,"difficulty":1,"explanation":"Кочевое и полукочевое скотоводство; в долинах рек — поливное земледелие."},{"type":"single","text":"Через земли саков, усуней и кангюя проходил:","options":["Путь из варяг в греки","Великий Шёлковый путь","Соляной путь","Золотой путь"],"correct":1,"difficulty":1,"explanation":"Великий Шёлковый путь (со II в. до н.э.) связывал Китай с Западом через территорию Казахстана."},{"type":"single","text":"Художественный стиль сакского искусства называется:","options":["звериный стиль","классический","барокко","геометрический"],"correct":0,"difficulty":1,"explanation":"«Звериный стиль» — изображения животных (барсов, оленей, грифонов) на золотых украшениях."}]},{"title":"Тюркские государства средневековья","grade_min":6,"grade_max":7,"order":2,"theory":"<h3>Тюркский каганат (552–603 гг.)<\/h3><p>Основан <b>Бумыном<\/b> (титул — Иль-каган), разгромившим жужаней; его брат <b>Истеми<\/b> правил западной частью. В 603 г. каганат распался на <b>Восточный<\/b> (центр — Монголия) и <b>Западный<\/b> (центр — Суяб, Жетысу). Восточный прекратил существование в 630 г. под ударами Танского Китая, восстановлен в 682 г. (Второй Восточно-Тюркский каганат: Бильге-каган, Кюль-тегин, советник Тоныкокун — орхоно-енисейские рунические памятники).<\/p><h3>Наследники Западного каганата<\/h3><ul><li><b>Тюргешский каганат (704–756)<\/b>: основатель Ушлик (Уч-элэг); правители Сулук-чор («бодающийся»), жёлтые и чёрные тюргеши; борьба с арабами и Танским Китаем;<\/li><li><b>Карлукский каганат (756–940)<\/b>: центр — Жетысу, столица Суяб, затем Баласагун; в 751 г. карлуки поддержали арабов в <b>Таласской битве<\/b>, остановившей продвижение Танского Китая на запад.<\/li><\/ul><h3>Огузское государство (конец IX — начало XI в.)<\/h3><p>Низовья Сырдарьи и Приаралье, столица — <b>Янгикент<\/b>. Правитель — <b>джабгу<\/b>. Огузы воевали с печенегами и хазарами; союз с Киевской Русью (Святослав). От огузов происходят туркмены, гагаузы и часть казахов.<\/p><h3>Кимекский каганат (конец IX — начало XI в.)<\/h3><p>Район Иртыша, правитель — <b>джегуб (каган)<\/b>, столица Имакия. Племена: кимеки, кыпчаки и др. Предки кыпчаков (половцев) вошли в состав многих тюркских народов; Дешт-и-Кыпчак — «Степь кыпчаков».<\/p><h3>Караханидское государство (942–1212)<\/h3><ul><li>Первое крупное государство, принявшее <b>ислам как государственную религию<\/b> (Сатук Богра-хан, 960 г.);<\/li><li>Столицы: Баласагун, затем Кашгар; владения — Жетысу, Восточный Туркестан, Мавераннахр;<\/li><li>Расцвет тюркской культуры: <b>Юсуф Баласагуни — «Кутадгу билиг» («Благодатное знание»)<\/b>, <b>Махмуд Кашгари — «Диуани лугат ат-тюрк» («Словарь тюркских наречий»)<\/b>, Ахмед Яссави — «Диван-и хикмет», городская культура Отрара и Тараза;<\/li><li>В 1212 г. пало под ударами хорезмшаха Мухаммеда и каракитаев.<\/li><\/ul><h3>Каракитаи и найманы<\/h3><p><b>Каракитайское ханство (1124–1218)<\/b>: основано Елюй Даши (киданьская знать), столица Баласагун; разбили сельджуков в <b>Катванской битве (1141)<\/b>. Пало при найманском хане Кучлуке. <b>Найманское ханство<\/b> — восток Казахстана (Алтай, Иртыш), хан Таян, Кучлук; часть найманов ушла в Монголию к Чингисхану.<\/p>","questions":[{"type":"single","text":"Годы существования Тюркского каганата:","options":["552–603","603–756","756–940","942–1212"],"correct":0,"difficulty":2,"explanation":"Тюркский каганат создан Бумыном в 552 г. и распался в 603 г. на Восточный и Западный."},{"type":"single","text":"Основатель Тюркского каганата:","options":["Истеми","Бумын","Сулук","Сатук Богра-хан"],"correct":1,"difficulty":2,"explanation":"Бумын-каган (Иль-каган) разгромил жужаней и основал каганат в 552 г.; его брат Истеми правил западными владениями."},{"type":"single","text":"В какой битве 751 г. карлуки и арабы остановили продвижение танского Китая?","options":["Катванской","Таласской","Аныракайской","Булатинской"],"correct":1,"difficulty":3,"explanation":"Таласская битва 751 г. на реке Талас; её исход закрепил влияние ислама в регионе."},{"type":"single","text":"Столица огузского государства:","options":["Суяб","Янгикент","Баласагун","Имакия"],"correct":1,"difficulty":2,"explanation":"Огузы: низовья Сырдарьи, столица Янгикент; правитель — джабгу."},{"type":"single","text":"Какое государство первым сделало ислам государственной религией в регионе?","options":["Тюргешский каганат","Караханидское государство","Огузское государство","Кимекский каганат"],"correct":1,"difficulty":2,"explanation":"Караханиды: Сатук Богра-хан принял ислам, в 960 г. он объявлен государственной религией."},{"type":"single","text":"Автор поэмы «Кутадгу билиг» («Благодатное знание»):","options":["Махмуд Кашгари","Юсуф Баласагуни","Ахмед Яссави","Кожа Ахмет"],"correct":1,"difficulty":2,"explanation":"Юсуф Баласагуни, 1069–1070 гг., посвящена кагану Табгач Богра-хану."},{"type":"single","text":"«Диуани лугат ат-тюрк» («Словарь тюркских наречий») написал:","options":["Махмуд Кашгари","Баласагуни","Аль-Фараби","Яссави"],"correct":0,"difficulty":2,"explanation":"Махмуд Кашгари (1072–1077) — энциклопедический словарь тюркских языков."},{"type":"single","text":"Каракитайское ханство основал:","options":["Елюй Даши","Кучлук","Таян-хан","Бумын"],"correct":0,"difficulty":3,"explanation":"Елюй Даши (кыданьский принц) основал государство каракитаев в 1124 г.; Кучлук — найманский хан, захвативший его в 1211–1218 гг."},{"type":"single","text":"Кимекский каганат располагался в районе реки:","options":["Сырдарья","Иртыш","Талас","Или"],"correct":1,"difficulty":2,"explanation":"Кимеки — Иртыш и Восточный Казахстан, столица Имакия; предки кыпчаков."},{"type":"single","text":"Столица Западного Тюркского каганата:","options":["Отрар","Суяб","Янгикент","Битянь"],"correct":1,"difficulty":3,"explanation":"Суяб в Жетысу (Чуйская долина) — центр Западного каганата."}]},{"title":"Монгольская эпоха: Золотая Орда, Ак-Орда, Могулистан","grade_min":7,"grade_max":8,"order":3,"theory":"<h3>Завоевания Чингисхана<\/h3><p>В <b>1206 г.<\/b> на курултае Темучин провозглашён <b>Чингисханом<\/b> — правителем всех монголов. Создана империя с военной организацией (десятки, сотни, тысячи — тумены), сводом законов «<b>Яса<\/b>» и письменностью (уйгурский алфавит). В 1218 г. пало Каракитайское ханство, в 1219–1224 гг. монголы завоевали Среднюю Азию и Казахстан (гибель Отрара после убийства послов — повод к походу).<\/p><h3>Улусы<\/h3><p>Перед смертью (1227) Чингисхан разделил империю между сыновьями. Территория Казахстана вошла в улусы <b>Джучи<\/b> (запад и центр), <b>Чагатая<\/b> (Жетысу, Восточный Туркестан) и Угэдэя (часть Алтая и Тарбагатая).<\/p><h3>Золотая Орда (Улус Джучи)<\/h3><ul><li>Окончательно оформлена при <b>Бату (Батый)<\/b> после западного похода 1236–1242 гг.; столицы — Сарай-Бату, затем Сарай-Берке (Нижняя Волга);<\/li><li>Хан <b>Берке<\/b> (1255–1266) первым из ордынских ханов принял <b>ислам<\/b>;<\/li><li>Расцвет при хане <b>Узбеке<\/b> (1313–1341): ислам — государственная религия;<\/li><li>Экономика: кочевое скотоводство, города Шёлкового пути (Сарайчик на Жайыке, Отрар, Сыгнак), ремёсла, монетная чеканка;<\/li><li>С середины XIV в. — кризис и распад; выделились Ак-Орда, Ногайская Орда, Сибирское ханство и др.<\/li><\/ul><h3>Ак-Орда (Белая Орда), XIII–XV вв.<\/h3><p>Удел старшего сына Джучи — <b>Орда-Ежена<\/b>. Территория — от Иртыша до низовьев Сырдарьи, Приаралье. Столица — <b>Сыгнак<\/b>. При <b>Урус-хане<\/b> (ок. 1361–1376/77) усилилась и претендовала на Сарай. Ак-Орда — прямая предшественница Казахского ханства: Керей и Жанибек — потомки Урус-хана.<\/p><h3>Могулистан (1347–начало XVI в.)<\/h3><p>Образовался в Жетысу и Восточном Туркестане при поддержке эмира <b>Пуладчи<\/b>; первый хан — <b>Тоглук-Тимур<\/b> (принял ислам, столица <b>Алмалык<\/b>). Ханы: Хызр-Ходжа, <b>Есен-Буга<\/b> (при нём Керей и Жанибек получили приют в Жетысу). Могулистан воевал с Тимуром и поддерживал казахов; распался в начале XVI в.<\/p><h3>Ногайская Орда и Узбекское ханство<\/h3><p><b>Ногайская Орда<\/b> (XV–XVI вв.): низовья Жайыка и Волги, столица Сарайчик; правитель — бий (Едиге — основатель мангытской династии). <b>Государство кочевых узбеков (ханство Абулхаира, 1428–1468)<\/b>: из его владений Керей и Жанибек со своими племенами ушли в Могулистан, что привело к образованию Казахского ханства.<\/p>","questions":[{"type":"single","text":"В каком году Темучин был провозглашён Чингисханом?","options":["1206","1219","1227","1236"],"correct":0,"difficulty":1,"explanation":"1206 г. — курултай на реке Онон, образование Монгольской империи."},{"type":"single","text":"Территория Казахстана в основном вошла в улус:","options":["Тулуя","Джучи","Угэдэя","Хубилая"],"correct":1,"difficulty":2,"explanation":"Западные и центральные земли (будущая Золотая Орда) достались старшему сыну Джучи."},{"type":"single","text":"Кто возглавил западный поход монголов 1236–1242 гг.?","options":["Чингисхан","Бату (Батый)","Узбек","Берке"],"correct":1,"difficulty":2,"explanation":"Батый — внук Чингисхана; после похода он утвердился в Нижнем Поволжье (Сарай-Бату)."},{"type":"single","text":"Первый хан Золотой Орды, принявший ислам:","options":["Бату","Берке","Узбек","Тохтамыш"],"correct":1,"difficulty":3,"explanation":"Хан Берке (1255–1266). Государственной религией ислам стал позже — при Узбеке (1313)."},{"type":"single","text":"Столица Ак-Орды:","options":["Сарайчик","Сыгнак","Алмалык","Суяб"],"correct":1,"difficulty":3,"explanation":"Сыгнак на Сырдарье — центр Ак-Орды; Сарайчик — столица Ногайской Орды, Алмалык — Могулистана."},{"type":"single","text":"Первый хан Могулистана:","options":["Есен-Буга","Тоглук-Тимур","Урус","Хызр-Ходжа"],"correct":1,"difficulty":3,"explanation":"Тоглук-Тимур (1347–1363) — первый хан Могулистана, принял ислам."},{"type":"single","text":"Поводом к походу Чингисхана на Среднюю Азию стало:","options":["убийство торговых послов в Отраре","нападение на Монголию","отказ платить дань усунями","союз Руси с Хорезмом"],"correct":0,"difficulty":2,"explanation":"Отрарская катастрофа 1218 г.: правитель Отрара Каир-хан перебил караван и послов Чингисхана."},{"type":"single","text":"Государство кочевых узбеков (1428–1468) возглавлял хан:","options":["Абулхаир","Барадж","Едиге","Тохтамыш"],"correct":0,"difficulty":3,"explanation":"Абулхаир-хан; недовольные его правлением Керей и Жанибек откочевали в Могулистан."},{"type":"single","text":"Столица Ногайской Орды:","options":["Сарайчик","Сыгнак","Сауран","Туркестан"],"correct":0,"difficulty":3,"explanation":"Сарайчик в низовьях Жайыка — ставка ногайских биев; правящая династия вела род от эмира Едиге."},{"type":"single","text":"При каком хане Ак-Орда достигла наибольшего могущества и претендовала на власть в Сарае?","options":["при Орда-Ежене","при Урус-хане","при Мубарак-ходже","при Тохтамысе"],"correct":1,"difficulty":3,"explanation":"Урус-хан (ок. 1361–1376/77) даже занимал Сарай; его потомки Керей и Жанибек основали Казахское ханство."}]},{"title":"Казахское ханство (XV–XVIII вв.)","grade_min":8,"grade_max":9,"order":4,"theory":"<h3>Образование ханства<\/h3><p><b>1465–1466 гг.<\/b> — султаны <b>Керей и Жанибек<\/b> (потомки Урус-хана из династии Джучидов) откочевали из государства Абулхаира в Западное Жетысу (долины рек Чу и Талас) под покровительство могулистанского хана Есен-Буги и образовали <b>Казахское ханство<\/b>. Слово «казах» означало свободного кочевника-скитальца. Первым ханом стал Керей. Население быстро росло за счёт племён, уходивших от междоусобиц.<\/p><h3>Укрепление при Касым-хане (1511–1518)<\/h3><p>Границы достигли Иртыша и Урала, численность войск — до 1 млн всадников (по Мухаммаду Хайдару Дулати). Принят свод законов <b>«Қазақ жолы» («Светлый путь Касыма»)<\/b>. Столица — Сыгнак. При Касым-хане название «казахи» утвердилось как этноним; установил дипломатические отношения с Русским государством.<\/p><h3>Хакназар-хан (1538–1580)<\/h3><p>Воссоединил земли после периода раздробленности, вернул города Сырдарьи, воевал с Ногайской Ордой, Сибирским ханством и Могулистаном; развивал торговлю с Бухарой, Хивой, Россией.<\/p><h3>Есим-хан (1598–1628)<\/h3><p>Столица перенесена в Туркестан. Свод правил «Есім ханның ескі жолы» («Древний путь Есим-хана»). Отражены набеги джунгар; подавлен мятеж Турсун-хана в Ташкенте.<\/p><h3>Тауке-хан (1680–1715)<\/h3><p>Период «золотого века»: свод законов <b>«Жеті жарғы» («Семь установлений»)<\/b>, разработанный с биями — <b>Толе би<\/b> (Старший жуз), <b>Казыбек би<\/b> (Средний жуз), <b>Айтеке би<\/b> (Младший жуз). Укреплён совет биев, снижены междоусобицы. Казахское общество делилось на три жуза (Старший, Средний, Младший).<\/p><h3>Джунгарское нашествие<\/h3><ul><li>Джунгарское ханство (ойраты) образовано в 1635 г.;<\/li><li><b>1723–1727 гг. — «Годы великого бедствия» (Ақтабан шұбырынды)<\/b>: джунгары захватили Ташкент, Сайрам, Туркестан; массовая гибель и бегство населения;<\/li><li>Победы: <b>Булантинская битва (1726/1728)<\/b>, <b>Аныракайская битва (1729/1730)<\/b> — перелом в борьбе (полководцы Богенбай, Кабанбай, Наурызбай, Жанкожа);<\/li><li><b>Абылай-хан (1771–1781)<\/b>: объединил три жуза, лавировал между Россией и Китаем (двойное подданство), укрепил государственность; признан выдающимся политиком («арыстан-тәуке — арыстан Абылай»).<\/li><\/ul><h3>Вхождение в состав России<\/h3><p><b>1731 г.<\/b> — хан Младшего жуза <b>Абулхаир<\/b> принял присягу России (миссия А. Тевкелева). Постепенно (до 1840-х) в российское подданство вошли Средний и Старший жузы. Строительство крепостей, изъятие земель. <b>1822 г. — «Устав о сибирских киргизах»<\/b> (Сперанский) ликвидировал ханскую власть в Среднем жузе. <b>Последний хан — Кенесары Касымов (1841–1847)<\/b>, возглавивший национально-освободительное восстание 1837–1847 гг.<\/p>","questions":[{"type":"single","text":"Годы образования Казахского ханства:","options":["1465–1466","1511–1518","1428","1520"],"correct":0,"difficulty":1,"explanation":"В 1465–1466 гг. Керей и Жанибек основали Казахское ханство в Западном Жетысу (Чу и Талас)."},{"type":"single","text":"Основатели Казахского ханства:","options":["Тауке и Абылай","Керей и Жанибек","Касым и Хакназар","Толе и Казыбек"],"correct":1,"difficulty":1,"explanation":"Султаны Керей и Жанибек — потомки Урус-хана; первым ханом стал Керей."},{"type":"single","text":"При каком хане был принят свод законов «Қазақ жолы»?","options":["при Есим-хане","при Тауке-хане","при Касым-хане","при Абылай-хане"],"correct":2,"difficulty":2,"explanation":"Касым-хан (1511–1518) — «Светлый путь Касым-хана»; ханство достигло наибольших границ."},{"type":"single","text":"«Жеті жарғы» («Семь установлений») — свод законов хана:","options":["Касыма","Есима","Тауке","Кенесары"],"correct":2,"difficulty":2,"explanation":"Тауке-хан (1680–1715) совместно с тремя биями — Толе, Казыбеком и Айтеке."},{"type":"single","text":"«Годы великого бедствия» (Ақтабан шұбырынды) — это:","options":["1723–1727 гг., джунгарское нашествие","1465–1466 гг.","1837–1847 гг.","1771–1781 гг."],"correct":0,"difficulty":2,"explanation":"Разорительное вторжение джунгар в 1723–1727 гг.; народ покидал пастбища, гибли города."},{"type":"single","text":"Битва, закрепившая перелом в борьбе с джунгарами (1729/1730):","options":["Булантинская","Аныракайская","Таласская","Катванская"],"correct":1,"difficulty":3,"explanation":"Аныракайская битва («место стона и рыданий врага») — крупная победа объединённого ополчения трёх жузов."},{"type":"single","text":"В каком году хан Младшего жуза Абулхаир принял присягу России?","options":["1731","1822","1841","1865"],"correct":0,"difficulty":2,"explanation":"1731 г. — миссия А. Тевкелева; начало вхождения казахских земель в состав России."},{"type":"single","text":"Последний хан, возглавивший национально-освободительное восстание 1837–1847 гг.:","options":["Абылай","Кенесары Касымов","Абулхаир","Жангир"],"correct":1,"difficulty":2,"explanation":"Кенесары Касымов (1841 г. провозглашён ханом всех жузов) — последний казахский хан."},{"type":"single","text":"На какие три части делилось казахское общество по хозяйственно-территориальному признаку?","options":["улусы","жузы","орды","бекства"],"correct":1,"difficulty":1,"explanation":"Старший (Ұлы), Средний (Орта) и Младший (Кіші) жузы."},{"type":"single","text":"Абылай-хан правил в:","options":["1680–1715","1771–1781","1511–1518","1822–1841"],"correct":1,"difficulty":3,"explanation":"Абылай (1771–1781) объединил жузы, проводил политику баланса между Россией и Цинской империей."}]}]},{"title":"Казахстан в XX–XXI веках","order":2,"topics":[{"title":"От Алаш-Орды до Независимости","grade_min":10,"grade_max":11,"order":1,"theory":"<h3>Алаш и Алаш-Орда (1917–1920)<\/h3><p>Партия <b>«Алаш»<\/b> создана в июле 1917 г.; лидеры — <b>Алихан Букейханов, Ахмет Байтурсынов, Миржакып Дулатов, Халел и Жанша Досмухамедовы<\/b>. В декабре 1917 г. II Всеказахский съезд провозгласил автономию <b>Алаш-Орда<\/b> со столицей в Семипалатинске — первое национальное правительство. В 1920 г. большевики ликвидировали автономию; лидеры Алаша репрессированы (Букейханов расстрелян в 1937).<\/p><h3>Советский период<\/h3><ul><li><b>1920 г.<\/b> — образована Киргизская (Казахская) АССР в составе РСФСР (столица Оренбург); с 1925 — КазАССР (столица перенесена в Кызылорду, в 1929 — в Алма-Ату);<\/li><li><b>1936 г.<\/b> — Казахстан стал союзной республикой (КазССР);<\/li><li><b>Голод 1931–1933 гг. (Ашаршылық)<\/b> — результат насильственной коллективизации и конфискации скота: погибло около 1,5–2 млн казахов (по разным оценкам до 40% этноса);<\/li><li><b>Репрессии 1937–1938 гг.<\/b>: расстреляны деятели Алаша, науки и культуры (А. Байтурсынов, М. Жумабаев, С. Сейфуллин, И. Жансугуров, С. Асфендияров и др.); лагеря — КарЛАГ, АЛЖИР;<\/li><li><b>Индустриализация<\/b>: Карагандинский угольный бассейн, Прибалхашский медеплавильный комбинат, Турксиб (1930);<\/li><li><b>Великая Отечественная война<\/b>: из Казахстана мобилизовано свыше 1,2 млн человек (около 18% населения); сформированы 12 стрелковых дивизий; легендарные панфиловцы (316-я дивизия, подвиг у разъезда Дубосеково, 1941); Герои Советского Союза — <b>Маншук Маметова, Алия Молдагулова, Талгат Бегельдинов, Сергей Луганский, Сагадат Нурмагамбетов, Хиуаз Доспанова<\/b>; Казахстан — арсенал фронта (свинец, медь, уголь); в эвакуации — заводы, вузы, деятели культуры;<\/li><li><b>Освоение целины (1954–1963)<\/b>: распашка ~25,5 млн га на севере; приток переселенцев, изменение этнодемографии;<\/li><li><b>Семипалатинский ядерный полигон<\/b>: с 1949 г. проведено 456 испытаний; <b>29 августа 1989 г.<\/b> О. Сулейменов создал движение «Невада — Семей», <b>29 августа 1991 г.<\/b> полигон закрыт. Наследие: пострадавшие территории, но Казахстан отказался от 4-го в мире ядерного арсенала (1993–1995);<\/li><li><b>Декабрьские события 1986 г. (Желтоқсан)<\/b>: в Алма-Ате молодёжь вышла на протест против назначения Г. Колбина вместо Д. Кунаева; впервые названы «националистическим выступлением», позже — реабилитированы как начало борьбы за независимость.<\/li><\/ul><h3>Независимый Казахстан<\/h3><ul><li><b>25 октября 1990 г.<\/b> — Декларация о государственном суверенитете;<\/li><li><b>16 декабря 1991 г.<\/b> — принят Конституционный закон «О государственной независимости»; <b>2 марта 1992 г.<\/b> — членство в ООН;<\/li><li>Первый Президент — <b>Нурсултан Назарбаев<\/b> (избран 1 декабря 1991 г.);<\/li><li><b>15 ноября 1993 г.<\/b> — введена национальная валюта <b>тенге<\/b>;<\/li><li><b>1997 г.<\/b> — перенос столицы из Алматы в Акмолу (с 1998 — Астана);<\/li><li><b>30 августа 1995 г.<\/b> — на республиканском референдуме принята действующая Конституция;<\/li><li>Созданы Ассамблея народа Казахстана (1995), проведены съезды лидеров мировых религий, председательство в ОБСЕ (2010), ЭКСПО-2017 в Астане;<\/li><li><b>2019 г.<\/b> — отставка Н. Назарбаева, Президентом избран К.-Ж. Токаев; столица переименована в Нур-Султан (в 2022 возвращено название Астана);<\/li><li><b>2022 г.<\/b> — январские события и конституционный референдум 5 июня («Вторая Республика»): ограничение полномочий Президента, новый парламент; <b>2025 г.<\/b> — референдум о конституционной реформе (однопалатный парламент Курултай);<\/li><li>Сегодня Казахстан — лидер Центральной Азии по ВВП, член ООН, ШОС, ЕАЭС, ОТГ, проводит многовекторную внешнюю политику.<\/li><\/ul>","questions":[{"type":"single","text":"Когда была провозглашена автономия Алаш-Орда?","options":["в феврале 1917 г.","в декабре 1917 г.","в 1920 г.","в 1916 г."],"correct":1,"difficulty":3,"explanation":"II Всеказахский съезд в Оренбурге (декабрь 1917) провозгласил автономию Алаш-Орда."},{"type":"single","text":"Лидер партии «Алаш»:","options":["Ахмет Байтурсынов","Алихан Букейханов","Миржакып Дулатов","Турар Рыскулов"],"correct":1,"difficulty":2,"explanation":"Алихан Букейханов — идеолог и председатель Алаш-Орды, расстрелян в 1937 г."},{"type":"single","text":"Главная причина голода 1931–1933 гг. в Казахстане:","options":["засуха","насильственная коллективизация и конфискация скота","война","нашествие саранчи"],"correct":1,"difficulty":2,"explanation":"Политика «малого Октября» Ф. Голощёкина, изъятие скота и оседание кочевников привели к катастрофе (Ашаршылық)."},{"type":"single","text":"Сколько человек было мобилизовано из Казахстана в годы Великой Отечественной войны?","options":["около 300 тыс.","свыше 1,2 млн","около 500 тыс.","свыше 3 млн"],"correct":1,"difficulty":2,"explanation":"Свыше 1,2 млн человек — около 18% населения республики; погибли более 600 тыс."},{"type":"single","text":"Казахстанские девушки — Герои Советского Союза, пулемётчица и снайпер:","options":["Маншук Маметова и Алия Молдагулова","Хиуаз Доспанова и Талгат Бегельдинов","Алия Молдагулова и Роза Багланова","Маншук Маметова и Хиуаз Доспанова"],"correct":0,"difficulty":1,"explanation":"Маншук Маметова — пулемётчица (панфиловская дивизия), Алия Молдагулова — снайпер."},{"type":"single","text":"Когда было создано антиядерное движение «Невада — Семей»?","options":["29 августа 1989 г.","29 августа 1991 г.","16 декабря 1991 г.","15 ноября 1993 г."],"correct":0,"difficulty":2,"explanation":"Движение основано Олжасом Сулейменовым 28 февраля 1989 г., первая акция — 29 августа 1989 г.; полигон закрыт 29 августа 1991 г."},{"type":"single","text":"Дата принятия Декларации о государственном суверенитете Казахстана:","options":["25 октября 1990 г.","16 декабря 1991 г.","29 августа 1991 г.","30 августа 1995 г."],"correct":0,"difficulty":2,"explanation":"25 октября 1990 г. — Декларация о суверенитете; 16 декабря 1991 г. — закон о независимости (теперь 25 октября — День Республики)."},{"type":"single","text":"Когда введён тенге?","options":["16 декабря 1991 г.","15 ноября 1993 г.","30 августа 1995 г.","1 января 1994 г."],"correct":1,"difficulty":1,"explanation":"15 ноября 1993 г. — национальная валюта тенге; 15 ноября отмечается как День национальной валюты."},{"type":"single","text":"Декабрьские события 1986 г. (Желтоқсан) произошли из-за:","options":["введения карточной системы","назначения Г. Колбина первым секретарём ЦК вместо Д. Кунаева","закрытия полигона","повышения цен на хлеб"],"correct":1,"difficulty":2,"explanation":"Пленум ЦК назначил «не связанного с республикой» Г. Колбина; молодёжь вышла на площадь Брежнева (ныне Республика) в Алма-Ате."},{"type":"single","text":"Когда столица была перенесена из Алматы в Акмолу (Астану)?","options":["1991","1995","1997","2000"],"correct":2,"difficulty":1,"explanation":"1997 г. — перенос столицы; 6 июля отмечается как День столицы."},{"type":"single","text":"Действующая Конституция РК принята:","options":["28 января 1993 г.","30 августа 1995 г.","16 декабря 1991 г.","5 июня 2022 г."],"correct":1,"difficulty":1,"explanation":"30 августа 1995 г. на республиканском референдуме; этот день — праздник День Конституции."},{"type":"single","text":"Когда Казахстан был принят в ООН?","options":["16 декабря 1991 г.","2 марта 1992 г.","15 ноября 1993 г.","25 октября 1990 г."],"correct":1,"difficulty":2,"explanation":"2 марта 1992 г. Казахстан стал членом ООН."}]}]}]},{"title":"Всемирная история","icon":"🏛️","color":"#7048e8","order":7,"sections":[{"title":"Древний мир и Средневековье","order":1,"topics":[{"title":"Древний мир: Египет, Греция, Рим","grade_min":5,"grade_max":7,"order":1,"theory":"<h3>Древний Египет<\/h3><p>Цивилизация в долине Нила (~3000 г. до н.э. — объединение Верхнего и Нижнего Египта фараоном <b>Менесом<\/b>). Правители — <b>фараоны<\/b> (обожествлялись). Пирамиды Гизы (Хеопса, Хефрена, Микерина, XXVI в. до н.э.), письменность — <b>иероглифы<\/b> (расшифрованы Шампольоном в 1822 г. с помощью Розеттского камня), религия — многобожие (Ра, Осирис, Исида), вера в загробную жизнь и мумификация.<\/p><h3
