>Древняя Греция<\/h3><ul><li><b>Полисы<\/b> — города-государства: Афины (демократия), Спарта (военная олигархия);<\/li><li><b>Афинская демократия<\/b>: реформы Солона (594 до н.э.), Клисфена; народное собрание, суд присяжных; стратегом Перикл — «золотой век» Афин;<\/li><li><b>Греко-персидские войны (500–449 до н.э.)<\/b>: Марафон (490, Мильтиад), Фермопилы (480, царь Леонид и 300 спартанцев), Саламинское морское сражение (480, Фемистокл);<\/li><li>Философия: Сократ, Платон (Академия), Аристотель (Ликей, учитель Александра Македонского);<\/li><li><b>Александр Македонский<\/b>: в 338 г. до н.э. Македония подчинила Грецию (битва при Херонее); в 334 г. начал поход на Восток — разгром Персидской державы (Граник, Исс, Гавгамелы), дошёл до Индии; умер в 323 г. в Вавилоне; его держава распалась на эллинистические царства;<\/li><li>Олимпийские игры — с 776 г. до н.э.<\/li><\/ul><h3>Древний Рим<\/h3><ul><li>Основан, по преданию, в 753 г. до н.э. Ромулом; периоды: царский (753–509 до н.э.), <b>республика<\/b> (509–27 до н.э.), <b>империя<\/b> (27 до н.э. — 476 н.э.);<\/li><li>Управление республики: сенат, консулы, народные трибуны; борьба патрициев и плебеев; <b>Законы XII таблиц<\/b> (450 до н.э.) — основа римского права;<\/li><li><b>Пунические войны<\/b> (Рим vs Карфаген): во 2-й — поход Ганнибала через Альпы (218–201 до н.э.); в 3-й — разрушение Карфагена (146 до н.э., Сципион);<\/li><li>Гражданские войны: Гай Юлий Цезарь (переход через Рубикон, 49 до н.э.; диктатор, убит в 44 до н.э. — мартовские иды, Брут); Октавиан Август — первый император (27 до н.э.);<\/li><li>Христианство возникло в I в. н.э. в Иудее (провинция Рима); при Константине — Миланский эдикт 313 г. (свобода вероисповедания);<\/li><li><b>476 г.<\/b> — низложение Ромула Августула вождём германцев Одоакром — конец Западной Римской империи и древнего мира; Восточная (Византия) просуществовала до 1453 г.<\/li><\/ul>","questions":[{"type":"single","text":"Письменность Древнего Египта:","options":["клинопись","иероглифы","финикийский алфавит","руны"],"correct":1,"difficulty":1,"explanation":"Иероглифы; расшифровал Жан-Франсуа Шампольон (1822) по Розеттскому камню. Клинопись — у шумеров."},{"type":"single","text":"В какой битве 300 спартанцев царя Леонида сдерживали армию персов?","options":["Марафон","Фермопилы","Саламин","Платеи"],"correct":1,"difficulty":1,"explanation":"Фермопильское ущелье, 480 г. до н.э."},{"type":"single","text":"Афины славились как центр:","options":["военной дисциплины","демократии","торговли с Египтом","жречества"],"correct":1,"difficulty":1,"explanation":"Афинская демократия: народное собрание, выборность должностей (реформы Солона и Клисфена). Спарта — военное государство."},{"type":"single","text":"Учителем Александра Македонского был:","options":["Сократ","Платон","Аристотель","Перикл"],"correct":2,"difficulty":1,"explanation":"Аристотель воспитывал Александра по приглашению Филиппа II Македонского."},{"type":"single","text":"В каком году начался поход Александра Македонского на Восток?","options":["356 до н.э.","338 до н.э.","334 до н.э.","323 до н.э."],"correct":2,"difficulty":2,"explanation":"334 г. до н.э. — переход в Малую Азию; 323 г. до н.э. — смерть Александра в Вавилоне."},{"type":"single","text":"Римская республика сменилась империей в:","options":["509 г. до н.э.","44 г. до н.э.","27 г. до н.э.","476 г. н.э."],"correct":2,"difficulty":2,"explanation":"В 27 г. до н.э. Октавиан получил титул Августа — начало империи."},{"type":"single","text":"С кем Рим вёл Пунические войны?","options":["с Грецией","с Карфагеном","с Египтом","с галлами"],"correct":1,"difficulty":1,"explanation":"Пунические войны (264–146 до н.э.) — Рим против Карфагена; Ганнибал — знаменитый карфагенский полководец."},{"type":"single","text":"Год падения Западной Римской империи:","options":["410","455","476","1453"],"correct":2,"difficulty":1,"explanation":"476 г. — Одоакр низложил Ромула Августула. 1453 — падение Византии (Константинополя)."},{"type":"single","text":"Миланский эдикт 313 г. связан с:","options":["запретом гладиаторских боёв","свободой христианства при Константине","законами XII таблиц","разделом империи"],"correct":1,"difficulty":3,"explanation":"Константин Великий даровал христианству свободу вероисповедания (Миланский эдикт, 313 г.)."},{"type":"single","text":"Первые Олимпийские игры в Древней Греции прошли в:","options":["776 г. до н.э.","490 г. до н.э.","500 г. до н.э.","356 г. до н.э."],"correct":0,"difficulty":2,"explanation":"776 г. до н.э. — традиционная дата первых Олимпийских игр в Олимпии."}]},{"title":"Средние века","grade_min":6,"grade_max":8,"order":2,"theory":"<h3>Периодизация<\/h3><p><b>Средние века<\/b> — V–XV вв. (от падения Западной Римской империи 476 г. до Великих географических открытий / падения Константинополя 1453 г.). Делятся на раннее (V–X), классическое/зрелое (XI–XIII) и позднее (XIV–XV) Средневековье.<\/p><h3>Византия<\/h3><p>Восточная Римская империя со столицей Константинополем (основан в 330 г.). Расцвет при <b>Юстиниане I (527–565)<\/b>: кодекс римского права, храм Святой Софии. Пала в <b>1453 г.<\/b> под ударами османов (Мехмед II).<\/p><h3>Западная Европа<\/h3><ul><li><b>Франкское государство<\/b>: Хлодвиг (крещение франков, Салическая правда); <b>Карл Великий<\/b> — император с 800 г.; после Верденского раздела 843 г. — зачатки Франции, Германии, Италии;<\/li><li><b>Феодализм<\/b>: земля — главная ценность; иерархия «сеньор — вассал»; крестьяне (зависимые) платили оброк и барщину; «феодальная лестница»;<\/li><li><b>Крестовые походы (1096–1291)<\/b> — 8 походов на Восток под религиозными лозунгами; 1099 — взятие Иерусалима; последствия: развитие торговли, упадок феодализма;<\/li><li>Сословия: духовенство, рыцарство/дворянство, крестьянство и горожане;<\/li><li><b>Столетняя война (1337–1453)<\/b> Англия — Франция: Жанна д'Арк (Орлеан, 1429);<\/li><li>Города, цехи, гильдии, ярмарки; университеты (Болонья, Париж — Сорбонна, Оксфорд);<\/li><li><b>Чёрная смерть<\/b> — чума 1347–1351 гг. унесла до трети населения Европы.<\/li><\/ul><h3>Арабский халифат и исламская цивилизация<\/h3><p>Ислам возник в VII в. (пророк Мухаммед, хиджра 622 г. — начало мусульманского летоисчисления). Арабский халифат: Омейяды (Дамаск), Аббасиды (Багдад). «Золотой век»: Ибн Сина (медицина, «Канон»), аль-Хорезми (алгебра, алгоритм), Ибн Рушд, обсерватория Улугбека (Самарканд, XV в.).<\/p><h3>Монгольская империя<\/h3><p>1206 г. — образование; завоевания в Азии и Европе (1237–1242 — поход Батыя на Русь и Восточную Европу). Последствия: Pax Mongolica — безопасность торговых путей (Шёлковый путь), культурный обмен, но и разрушения.<\/p><h3>Османская империя<\/h3><p>Возникла в Малой Азии (ок. 1299); <b>1453 г. — взятие Константинополя Мехмедом II<\/b>; Сулейман Великолепный (XVI в.) — пик могущества; контролировала Ближний Восток, Северную Африку, Балканы до начала XX в.<\/p>","questions":[{"type":"single","text":"Хронологические рамки Средних веков:","options":["I–V вв.","V–XV вв.","XV–XVIII вв.","III–X вв."],"correct":1,"difficulty":1,"explanation":"От падения Западной Римской империи (476) до середины XV в. (1453 — падение Константинополя)."},{"type":"single","text":"Первым императором франков (800 г.) стал:","options":["Хлодвиг","Карл Великий","Юстиниан","Оттон I"],"correct":1,"difficulty":2,"explanation":"Карл Великий коронован императором в Риме в 800 г. Хлодвиг — основатель династии Меровингов (V в.)."},{"type":"single","text":"Крестовые походы проходили в:","options":["1096–1291","1337–1453","1206–1260","1453–1517"],"correct":0,"difficulty":2,"explanation":"Восемь походов 1096–1291 гг.; 1099 — взятие Иерусалима крестоносцами."},{"type":"single","text":"Основная хозяйственная единица феодальной Европы:","options":["полис","феод (земельное владение сеньора)","цех","колония"],"correct":1,"difficulty":1,"explanation":"Феод — земля сеньора, обрабатываемая зависимыми крестьянами; «земля — кормилица феодализма»."},{"type":"single","text":"Столетняя война (1337–1453) шла между:","options":["Англией и Францией","Римом и Карфагеном","Византией и Османами","Испанией и Португалией"],"correct":0,"difficulty":1,"explanation":"Англия против Франции; героиня — Жанна д'Арк, снявшая осаду Орлеана (1429)."},{"type":"single","text":"Константинополь пал под ударами османов в:","options":["1204","1389","1453","1492"],"correct":2,"difficulty":1,"explanation":"29 мая 1453 г. — Мехмед II взял город; конец Византии."},{"type":"single","text":"Эпидемия, унёсшая до трети населения Европы в середине XIV в.:","options":["испанка","чума («Чёрная смерть»)","холера","оспа"],"correct":1,"difficulty":1,"explanation":"Пандемия бубонной чумы 1347–1351 гг."},{"type":"single","text":"Автор «Канона врачебной науки»:","options":["аль-Хорезми","Ибн Сина (Авиценна)","Ибн Рушд","Улугбек"],"correct":1,"difficulty":2,"explanation":"Ибн Сина (Авиценна, 980–1037) — энциклопедист, его «Канон» веками был учебником медицины."},{"type":"single","text":"Хиджра — переселение Мухаммеда из Мекки в Медину (622 г.) — это:","options":["название молитвы","точка отсчёта мусульманского календаря","название войны","столп ислама"],"correct":1,"difficulty":2,"explanation":"С 622 г. ведётся отсчёт мусульманского (лунного) летосчисления."},{"type":"single","text":"Верденский договор 843 г. разделил империю Карла Великого на части — предшественницы:","options":["Франции, Германии, Италии","Англии, Испании, Португалии","Польши, Чехии, Венгрии","Византии, Рима, Карфагена"],"correct":0,"difficulty":3,"explanation":"Три части достались внукам Карла: Западно-Франкское (Франция), Восточно-Франкское (Германия) и Срединное (с Северной Италией) королевства."}]}]},{"title":"Новое и новейшее время","order":2,"topics":[{"title":"Великие географические открытия и Новое время","grade_min":7,"grade_max":9,"order":1,"theory":"<h3>Предпосылки Великих географических открытий (конец XV — середина XVII в.)<\/h3><p>Поиск морских путей в Индию (после того как Османская империя перекрыла сухопутные маршруты), нехватка золота в Европе, развитие кораблестроения (каравелла) и навигации (компас, астролябия), дух Ренессанса.<\/p><h3>Ключевые открытия<\/h3><ul><li><b>1492 г. — Христофор Колумб<\/b> (под флагом Испании) открыл Америку, ища западный путь в Индию (4 плавания; Сан-Сальвадор, Куба, Гаити);<\/li><li><b>1498 г. — Васко да Гама<\/b> (Португалия) обогнул Африку (мыс Доброй Надежды открыт Бартоломеу Диашем в 1488) и достиг Индии (Каликут);<\/li><li><b>1519–1522 гг. — Фернан Магеллан<\/b>: первое кругосветное плавание (завершил Элькано) — доказательство шарообразности Земли и существования единого Мирового океана;<\/li><li>Америка названа в честь <b>Америго Веспуччи<\/b>, предложившего идею «Нового Света»;<\/li><li>1642–1644 — Тасман открыл Австралию (Новая Голландия) и Тасманию.<\/li><\/ul><h3>Последствия<\/h3><p>Колониальные империи (Испания, Португалия, позже Англия, Франция, Нидерланды), «колумбов обмен» (кукуруза, картофель, томаты — в Европу; лошади, болезни — в Америку), конкиста (Кортес — ацтеки 1521, Писарро — инки 1533), приток золота, <b>революция цен<\/b>, зарождение мирового рынка, работорговля.<\/p><h3>Новое время: революции<\/h3><ul><li><b>Английская революция (1640–1660)<\/b>: парламент против Карла I; Кромвель; 1649 — казнь короля, республика; 1689 — Билль о правах, конституционная монархия;<\/li><li><b>Война за независимость США (1775–1783)<\/b>: 4 июля 1776 — Декларация независимости (Джефферсон); Вашингтон — первый президент; 1787 — Конституция США;<\/li><li><b>Великая французская революция (1789–1799)<\/b>: 14 июля 1789 — взятие Бастилии; «Декларация прав человека и гражданина»; лозунг «Свобода, равенство, братство»; якобинская диктатура (Робеспьер); приход Наполеона;<\/li><li><b>Наполеоновские войны<\/b>: империя (1804–1815), поражение в России (1812), Ватерлоо (1815) → Венский конгресс (1814–1815) — реставрация.<\/li><\/ul><h3>Промышленный переворот<\/h3><p>XVIII–XIX вв.: переход от мануфактуры к фабрике; паровая машина Уатта (1769–1784), станки, железные дороги (Стивенсон, 1825 — первый паровоз на Стоктон–Дарлингтонской дороге). Начало — Англия. Итоги: индустриальное общество, урбанизация, классы буржуазии и пролетариата.<\/p>","questions":[{"type":"single","text":"Кто открыл Америку в 1492 году?","options":["Васко да Гама","Колумб","Магеллан","Веспуччи"],"correct":1,"difficulty":1,"explanation":"Христофор Колумб, испанская экспедиция; он искал западный путь в Индию."},{"type":"single","text":"Первое кругосветное плавание совершила экспедиция:","options":["Колумба","Магеллана","Васко да Гамы","Кука"],"correct":1,"difficulty":1,"explanation":"1519–1522 гг.; сам Магеллан погиб на Филиппинах, экспедицию завершил Элькано."},{"type":"single","text":"Морской путь в Индию вокруг Африки открыл:","options":["Колумб","Диаш","Васко да Гама","Магеллан"],"correct":2,"difficulty":2,"explanation":"Васко да Гама достиг Каликута (Индия) в 1498 г.; мыс Доброй Надежды ранее обогнул Диаш (1488)."},{"type":"single","text":"Америка названа в честь:","options":["Америго Веспуччи","Колумба","Магеллана","короля Америки"],"correct":0,"difficulty":1,"explanation":"Веспуччи первым предложил считать открытые земли «Новым Светом» — новым материком."},{"type":"single","text":"Взятие Бастилии (начало Великой французской революции) произошло:","options":["4 июля 1776 г.","14 июля 1789 г.","18 июня 1815 г.","2 сентября 1792 г."],"correct":1,"difficulty":1,"explanation":"14 июля 1789 г. — штурм Бастилии; день взятия — национальный праздник Франции."},{"type":"single","text":"Декларация независимости США принята:","options":["4 июля 1776 г.","14 июля 1789 г.","17 сентября 1787 г.","4 июля 1789 г."],"correct":0,"difficulty":2,"explanation":"4 июля 1776 г. (автор — Томас Джефферсон); Конституция США — 1787 г."},{"type":"single","text":"Наполеон потерпел окончательное поражение в битве при:","options":["Аустерлице","Трафальгаре","Ватерлоо","Бородино"],"correct":2,"difficulty":2,"explanation":"18 июня 1815 г. — Ватерлоо; затем ссылка на остров Святой Елены."},{"type":"single","text":"Промышленный переворот начался в:","options":["Франции","Англии","Германии","США"],"correct":1,"difficulty":1,"explanation":"Англия, вторая половина XVIII в.: станки, паровая машина Уатта, фабрики."},{"type":"single","text":"Империя ацтеков была завоёвана конкистадором:","options":["Писарро","Кортесом","Бальбоа","Писарро и Альмагро"],"correct":1,"difficulty":2,"explanation":"Эрнан Кортес (1519–1521, падение Теночтитлана); Франсиско Писарро — завоеватель империи инков (1532–1533)."},{"type":"single","text":"Английская революция XVII в. завершилась установлением:","options":["абсолютной монархии","конституционной монархии (1689, Билль о правах)","республики на века","диктатуры короля"],"correct":1,"difficulty":3,"explanation":"После реставрации Стюартов «Славная революция» 1688 г. и Билль о правах 1689 г. утвердили конституционную монархию."}]},{"title":"Мировые войны и Холодная война","grade_min":10,"grade_max":11,"order":2,"theory":"<h3>Первая мировая война (1914–1918)<\/h3><ul><li>Причины: борьба империй за передел мира и колоний; блоки — <b>Тройственный союз<\/b> (Германия, Австро-Венгрия, Италия*) и <b>Антанта<\/b> (Франция, Россия, Великобритания); (*Италия в 1915 перешла к Антанте);<\/li><li>Повод: убийство эрцгерцога Франца Фердинанда в Сараеве (28 июня 1914, Гаврило Принцип);<\/li><li>Ключевые события: Марна (1914 — срыв блицкрига), Верден («Верденская мясорубка», 1916), Сомма (1916, первые танки), Брусиловский прорыв (1916); вступление США (апрель 1917);<\/li><li>Итоги: 10 млн погибших солдат; распад 4 империй (Российской, Германской, Австро-Венгерской, Османской); Версальско-Вашигтонская система (1919–1922); создана Лига Наций (1920).<\/li><\/ul><h3>Вторая мировая война (1939–1945)<\/h3><ul><li>Начало: <b>1 сентября 1939 г.<\/b> — нападение Германии на Польшу;<\/li><li>1940 — оккупация Дании, Норвегии, Бельгии, Голландии, Франции; «Битва за Британию»;<\/li><li><b>22 июня 1941 г.<\/b> — нападение на СССР (план «Барбаросса»); Московская битва (1941–1942) — первое крупное поражение вермахта;<\/li><li>7 декабря 1941 — Пёрл-Харбор; США вступили в войну; антигитлеровская коалиция («Большая тройка»: Сталин, Рузвельт, Черчилль; конференции Тегеран-1943, Ялта-1945, Потсдам-1945);<\/li><li>Коренной перелом: <b>Сталинград (1942–1943)<\/b> и Курская дуга (1943); 6 июня 1944 — высадка в Нормандии (второй фронт);<\/li><li>8 мая 1945 — капитуляция Германии (9 мая — День Победы); 2 сентября 1945 — капитуляция Японии после атомных бомбардировок Хиросимы и Нагасаки (6 и 9 августа 1945);<\/li><li>Итоги: 60–70 млн погибших; Холокост (геноцид 6 млн евреев); создана <b>ООН (Устав — 26 июня 1945, Сан-Франциско)<\/b>; Нюрнбергский процесс (1945–1946) над нацистскими преступниками.<\/li><\/ul><h3>Холодная война (1946–1991)<\/h3><ul><li>Противостояние двух сверхдержав — США и СССР: идеология, гонка вооружений, локальные конфликты (Корея 1950–1953, Вьетнам, Афганистан 1979–1989), Карибский кризис (1962 — мир на грани ядерной войны);<\/li><li>Блоки: НАТО (1949) и ОВД (1955); план Маршалла (1947) vs СЭВ (1949); Берлинский кризис и стена (1961);<\/li><li>Космическая гонка: Спутник-1 (1957), Гагарин (12 апреля 1961), высадка США на Луну (1969);<\/li><li>Разрядка 1970-х (ОСВ-1, Хельсинкский акт 1975), новый виток в начале 1980-х, перестройка и <b>распад СССР (декабрь 1991)<\/b> — конец Холодной войны. ФРКГ: падение Берлинской стены (9 ноября 1989), объединение Германии (1990).<\/li><\/ul><h3>Современный мир<\/h3><p>Многополярность, глобализация, ЕС (Маастрихтский договор 1992, евро — 1999/2002), международный терроризм (11 сентября 2001), цифровая революция.<\/p>","questions":[{"type":"single","text":"Поводом к Первой мировой войне стало:","options":["нападение на Польшу","убийство Франца Фердинанда в Сараеве","потопление «Лузитании»","Карибский кризис"],"correct":1,"difficulty":1,"explanation":"28 июня 1914 г. Гаврило Принцип застрелил наследника австро-венгерского престола; через месяц началась война."},{"type":"single","text":"Дата начала Второй мировой войны:","options":["22 июня 1941","1 сентября 1939","7 декабря 1941","1 августа 1914"],"correct":1,"difficulty":1,"explanation":"1 сентября 1939 г. — нападение Германии на Польшу."},{"type":"single","text":"Битва, ставшая началом коренного перелома во Второй мировой войне:","options":["Московская","Сталинградская","Курская","Берлинская"],"correct":1,"difficulty":2,"explanation":"Сталинград (июль 1942 — февраль 1943): окружение и разгром 6-й армии Паулюса; перелом закрепила Курская дуга (1943)."},{"type":"single","text":"Второй фронт в Европе был открыт:","options":["6 июня 1944 г. в Нормандии","в 1943 г. в Италии","8 мая 1945 г.","в 1942 г. под Эль-Аламейном"],"correct":0,"difficulty":2,"explanation":"День «Д» — 6 июня 1944 г., высадка союзников в Нормандии (операция «Оверлорд»)."},{"type":"single","text":"ООН была создана в:","options":["1919","1945","1955","1991"],"correct":1,"difficulty":1,"explanation":"Устав ООН подписан 26 июня 1945 г. в Сан-Франциско; 24 октября 1945 — вступление в силу (День ООН)."},{"type":"single","text":"Карибский кризис — пик Холодной войны — произошёл в:","options":["1949","1962","1975","1989"],"correct":1,"difficulty":2,"explanation":"Октябрь 1962 г.: размещение советских ракет на Кубе; мир был на грани ядерной войны."},{"type":"single","text":"Военно-политический блок, созданный в 1949 г. во главе с США:","options":["ОВД","НАТО","СЭВ","Лига Наций"],"correct":1,"difficulty":1,"explanation":"НАТО (1949); в ответ СССР создал ОВД в 1955 г."},{"type":"single","text":"Первый человек в космосе:","options":["Нил Армстронг","Юрий Гагарин","Алан Шепард","Герман Титов"],"correct":1,"difficulty":1,"explanation":"12 апреля 1961 г. — Юрий Гагарин, корабль «Восток-1»."},{"type":"single","text":"Распад СССР и конец Холодной войны произошли в:","options":["1985","1989","1991","1993"],"correct":2,"difficulty":1,"explanation":"Декабрь 1991 г. — Беловежские соглашения и отставка Горбачёва; падение Берлинской стены было в 1989 г."},{"type":"single","text":"Версальский мирный договор (1919) юридически завершил:","options":["Вторую мировую войну","Первую мировую войну","Холодную войну","Франко-прусскую войну"],"correct":1,"difficulty":2,"explanation":"Версальско-Вашигтонская система закрепила итоги Первой мировой; с Германией подписан Версальский договор (28 июня 1919)."}]}]}]},{"title":"Основы права","icon":"⚖️","color":"#c2255c","order":8,"sections":[{"title":"Конституционные основы Республики Казахстан","order":1,"topics":[{"title":"Конституция РК: основы строя","grade_min":9,"grade_max":9,"order":1,"theory":"<h3>Конституция РК<\/h3><p>Действующая Конституция принята на республиканском референдуме <b>30 августа 1995 года<\/b> (День Конституции). Она имеет высшую юридическую силу и прямое действие на всей территории страны. Состоит из <b>9 разделов, 98 статей<\/b>. Изменения вносились референдумами 1998, 2007, 2011, 2017, 2022 годов.<\/p><h3>Основы конституционного строя (раздел I)<\/h3><ul><li>Казахстан утверждает себя <b>демократическим, светским, правовым и социальным государством<\/b>, высшие ценности которого — <b>человек, его жизнь, права и свободы<\/b>;<\/li><li><b>Народный суверенитет<\/b>: единственным источником государственной власти является народ, осуществляющий власть напрямую (референдум, выборы) и через государственные органы;<\/li><li><b>Государственный суверенитет<\/b>: единство, целостность, неприкосновенность и неотчуждаемость территории;<\/li><li><b>Разделение властей<\/b> на законодательную, исполнительную и судебную с системой сдержек и противовесов;<\/li><li>Идеологическое и политическое многообразие; запрещены политические партии других государств, религиозные партии, военизированные формирования;<\/li><li><b>Светский характер<\/b>: религия отделена от государства;<\/li><li>Собственность: признаются <b>государственная и частная<\/b> собственность (равно защищаются); земля может находиться и в частной собственности (кроме отдельных категорий);<\/li><li><b>Государственный язык — казахский<\/b>; в государственных организациях и органах местного самоуправления наравне с казахским официально употребляется <b>русский язык<\/b>;<\/li><li>Государственные символы: <b>Флаг, Герб, Гимн<\/b> (авторы гимна — Шамши Калдаяков, Жумекен Нажимеденов, Нурсултан Назарбаев; герб — Жандарбек Малибеков, Шот-Аман Уалиханов; флаг — Шакен Ниязбеков).<\/li><\/ul><h3>Форма государства<\/h3><p>Форма правления — <b>президентская республика<\/b> (после реформ 2022 г. — с усилением роли Парламента, модель «сильный Президент — влиятельный Парламент — подотчётное Правительство»). Административно-территориальное устройство: <b>17 областей и 3 города республиканского значения<\/b> (Астана, Алматы, Шымкент). Столица — <b>Астана<\/b>.<\/p>","questions":[{"type":"single","text":"Когда была принята действующая Конституция РК?","options":["28 января 1993 г.","30 августа 1995 г.","16 декабря 1991 г.","5 июня 2022 г."],"correct":1,"difficulty":1,"explanation":"30 августа 1995 г. на республиканском референдуме; этот день — государственный праздник."},{"type":"single","text":"Согласно Конституции, высшие ценности Казахстана — это:","options":["государство и его границы","человек, его жизнь, права и свободы","экономика и собственность","религия и традиции"],"correct":1,"difficulty":1,"explanation":"Статья 1: высшие ценности — человек, его жизнь, права и свободы."},{"type":"single","text":"Единственный источник государственной власти в РК:","options":["Президент","Парламент","народ","Правительство"],"correct":2,"difficulty":1,"explanation":"Статья 3: власть принадлежит народу; он осуществляет её через референдум, выборы и госорганы."},{"type":"single","text":"Государственный язык Республики Казахстан:","options":["русский","казахский","казахский и русский","английский"],"correct":1,"difficulty":1,"explanation":"Статья 7: государственный язык — казахский; русский официально употребляется наравне с казахским."},{"type":"single","text":"Какая форма правления установлена Конституцией РК?","options":["парламентская республика","президентская республика","конституционная монархия","федерация"],"correct":1,"difficulty":2,"explanation":"Республика Казахстан — президентская республика; после реформ 2022 г. Президент — глава государства, Парламент однопалатный (Курултай, с 2025 реформы), Правительство подотчётно Президенту и Парламенту."},{"type":"single","text":"Принцип разделения властей в РК охватывает ветви:","options":["президентскую, правительственную, местную","законодательную, исполнительную, судебную","федеральную и региональную","светскую и религиозную"],"correct":1,"difficulty":1,"explanation":"Статья 3: власть делится на законодательную, исполнительную и судебную — с системой сдержек и противовесов."},{"type":"single","text":"Столица Республики Казахстан:","options":["Алматы","Шымкент","Астана","Караганда"],"correct":2,"difficulty":1,"explanation":"Статья 2: столица Казахстана — Астана."},{"type":"single","text":"Какая собственность признаётся и равно защищается государством?","options":["только государственная","только частная","государственная и частная","коллективная"],"correct":2,"difficulty":2,"explanation":"Статья 6: собственность (государственная и частная) неприкосновенна и охраняется законом."},{"type":"single","text":"Сколько городов республиканского значения в Казахстане?","options":["1","2","3","4"],"correct":2,"difficulty":2,"explanation":"Три: Астана, Алматы и Шымкент (статус с 2018 г.)."},{"type":"single","text":"Светское государство — это государство, в котором:","options":["запрещена любая религия","религия отделена от государства","государственная религия — ислам","религия определяет законы"],"correct":1,"difficulty":2,"explanation":"Казахстан — светское государство: церковь (религиозные объединения) отделена от государства, гарантирована свобода совести."}]},{"title":"Ветви государственной власти РК","grade_min":9,"grade_max":11,"order":2,"theory":"<h3>Президент — глава государства<\/h3><p>Президент РК — <b>глава государства<\/b>, высшее должностное лицо, символ и гарант единства народа и государственной власти, прав и свобод человека. По реформам 2022–2025 гг.:<\/p><ul><li>избирается народом на <b>один 7-летний срок<\/b> без права переизбрания;<\/li><li>кандидат — гражданин РК по рождению, не моложе 40 лет, с высшим образованием и стажем госслужбы/депутатства не менее 5 лет;<\/li><li>полномочия: определяет основные направления внутренней и внешней политики, является Верховным Главнокомандующим, подписывает законы, назначает выборы, формирует Правительство (Премьер-министр — с согласия Парламента), назначает акимов областей и городов республиканского значения, обладает правом законодательной инициативы;<\/li><li>ограничения: не может состоять в политической партии (на период полномочий), близкие родственники не вправе занимать руководящие посты в квазигосударственном секторе.<\/li><\/ul><h3>Парламент — законодательная власть<\/h3><p>По конституционной реформе 2025 г. Парламент стал <b>однопалатным — Курултай<\/b> (145 депутатов, избираются по пропорциональной системе на 5 лет). До 2023–2025 гг. действовал двухпалатный Парламент: <b>Сенат<\/b> (депутаты от регионов + назначаемые Президентом) и <b>Мажилис<\/b> (98 депутатов, смешанная система). Функции: принятие законов, утверждение бюджета, ратификация договоров, дача согласия на назначение Премьер-министра, объявление войны и мира по предложению Президента.<\/p><h3>Правительство — исполнительная власть<\/h3><p>Состав: Премьер-министр, заместители, министры. Осуществляет исполнительную власть, возглавляет систему исполнительных органов, разрабатывает и исполняет бюджет, проводит социально-экономическую политику. Подотчётно Президенту и Парламенту.<\/p><h3>Судебная власть<\/h3><ul><li><b>Верховный Суд РК<\/b> — высший судебный орган по гражданским, уголовным и иным делам;<\/li><li>Местные суды: областные, районные (городские), специализированные;<\/li><li><b>Конституционный Суд РК<\/b> (с 2023 г., вместо Конституционного Совета) — проверяет соответствие законов Конституции, рассматривает обращения граждан;<\/li><li>Судьи независимы и подчиняются только закону и Конституции; правосудие осуществляется от имени Республики.<\/li><\/ul><h3>Иные высшие органы<\/h3><p><b>Прокуратура<\/b> — высший надзор за соблюдением законности; <b>Уполномоченный по правам человека<\/b>; <b>Центральная избирательная комиссия<\/b>; <b>Высшая аудиторская палата<\/b>; <b>Агентство по противодействию коррупции<\/b>; <b>Курултай<\/b> как общенациональный представительный орган (реформа 2025 г. создала также Курултай как парламент, а Национальный курултай сохраняется как консультативный орган до реформ).<\/p>","questions":[{"type":"single","text":"Кто является главой государства в РК?","options":["Премьер-министр","Президент","Председатель Парламента","Председатель Верховного Суда"],"correct":1,"difficulty":1,"explanation":"Президент — глава государства, его высшее должностное лицо, символ единства народа и власти."},{"type":"single","text":"Срок полномочий Президента РК (после реформы):","options":["4 года","5 лет","7 лет без права переизбрания","не ограничен"],"correct":2,"difficulty":2,"explanation":"По реформам Президент избирается на один 7-летний срок без права переизбрания."},{"type":"single","text":"Законодательную власть в РК осуществляет:","options":["Правительство","Парламент","Верховный Суд","Прокуратура"],"correct":1,"difficulty":1,"explanation":"Парламент (с 2025–2026 гг. — однопалатный Курултай) принимает законы и утверждает бюджет."},{"type":"single","text":"Исполнительную власть в РК возглавляет:","options":["Президент","Правительство","Сенат","Акимат"],"correct":1,"difficulty":1,"explanation":"Правительство во главе с Премьер-министром осуществляет исполнительную власть."},{"type":"single","text":"Высший судебный орган по гражданским и уголовным делам:","options":["Конституционный Суд","Верховный Суд","Областной суд","Генеральная прокуратура"],"correct":1,"difficulty":1,"explanation":"Верховный Суд РК — высший судебный орган; Конституционный Суд проверяет законы на соответствие Конституции."},{"type":"single","text":"Какой орган в 2023 году пришёл на смену Конституционному Совету?","options":["Счётный комитет","Конституционный Суд","Высший судебный совет","Курултай"],"correct":1,"difficulty":3,"explanation":"С 2023 г. действует Конституционный Суд РК, куда могут обращаться и граждане."},{"type":"single","text":"Как называется Парламент Казахстана после конституционной реформы (однопалатный)?","options":["Мажилис","Сенат","Курултай","Маслихат"],"correct":2,"difficulty":3,"explanation":"Реформа, одобренная на референдуме 8 июня 2025 г., учредила однопалатный Парламент — Курултай (145 депутатов)."},{"type":"single","text":"Местное самоуправление в областях и городах представлено:","options":["Сенатом","акимами и маслихатами","Правительством","Прокуратурой"],"correct":1,"difficulty":2,"explanation":"Аким — глава исполнительной власти региона, маслихат — представительный орган местного самоуправления."},{"type":"single","text":"Верховный Главнокомандующий Вооружёнными Силами РК — это:","options":["Министр обороны","Президент","Премьер-министр","Начальник Генштаба"],"correct":1,"difficulty":1,"explanation":"Президент является Верховным Главнокомандующим."},{"type":"single","text":"Высший надзор за точным и единообразным применением законов осуществляет:","options":["суд","полиция","прокуратура","Агентство по делам госслужбы"],"correct":2,"difficulty":2,"explanation":"Прокуратура от имени государства осуществляет высший надзор за соблюдением законности."}]}]},{"title":"Права человека и отрасли права","order":2,"topics":[{"title":"Права и свободы человека и гражданина","grade_min":9,"grade_max":9,"order":1,"theory":"<h3>Понятие и поколения прав<\/h3><p><b>Права человека<\/b> — принадлежащие каждому от рождения неотъемлемые возможности. Поколения прав: 1-е — гражданские и политические; 2-е — социально-экономические и культурные; 3-е — коллективные (на развитие, мир, чистую среду).<\/p><h3>Международные документы<\/h3><ul><li><b>Всеобщая декларация прав человека<\/b> (ООН, <b>10 декабря 1948 г.<\/b> — отмечается Международный день прав человека);<\/li><li>Международные пакты о правах (1966): гражданских и политических; экономических, социальных и культурных;<\/li><li>Конвенция о правах ребёнка (1989).<\/li><\/ul><h3>Права и свободы по Конституции РК (раздел II)<\/h3><ul><li><b>Личные:<\/b> право на жизнь (смертная казнь отменена — пожизненное заключение как исключительная мера), личная свобода и неприкосновенность, достоинство, неприкосновенность частной жизни, тайна переписки и телефонных переговоров, свобода передвижения, свобода совести;<\/li><li><b>Политические:<\/b> свобода слова и творчества, право на объединение, право участвовать в управлении государством (избирать и быть избранным с 18 лет), право мирно собираться (уведомительный порядок, закон 2020 г.), право на обращение (петиции — закон 2022 г.);<\/li><li><b>Социально-экономические:<\/b> право частной собственности, свобода предпринимательства, право на труд и отдых, на охрану здоровья и бесплатную медпомощь в гарантированном объёме (ОСМС), на жилище, на социальное обеспечение по возрасту, в случае болезни и инвалидности;<\/li><li><b>Культурные:<\/b> право на образование (бесплатное среднее обязательно; закон «О статусе педагога»), пользование родным языком и культурой;<\/li><li><b>Юридические гарантии:<\/b> презумпция невиновности, право на квалифицированную юридическую помощь, никто не обязан свидетельствовать против себя, супруга и близких родственников; запрет обратной силы законов, ухудшающих положение; принцип «незнание закона не освобождает от ответственности».<\/li><\/ul><h3>Обязанности гражданина (ст. 34–37)<\/h3><p>Соблюдать Конституцию и законы, уважать права и свободы других лиц, уважать государственные символы, платить законно установленные налоги и сборы, беречь природу, защищать Республику Казахстан (воинская обязанность).<\/p>","questions":[{"type":"single","text":"Всеобщая декларация прав человека принята ООН:","options":["24 октября 1945 г.","10 декабря 1948 г.","4 июля 1776 г.","26 июня 1945 г."],"correct":1,"difficulty":1,"explanation":"10 декабря 1948 г. (Париж); дата отмечается как Международный день прав человека."},{"type":"single","text":"Право на жизнь, личная свобода и достоинство относятся к правам:","options":["политическим","личным (гражданским)","социальным","культурным"],"correct":1,"difficulty":1,"explanation":"Личные (гражданские) права принадлежат каждому от рождения и не зависят от гражданства."},{"type":"single","text":"Право избирать и быть избранным возникает с:","options":["16 лет","18 лет","21 года","25 лет"],"correct":1,"difficulty":1,"explanation":"Избирательное право — с 18 лет (ст. 33 Конституции РК)."},{"type":"single","text":"Презумпция невиновности означает, что:","options":["все виновны, пока не докажут обратное","обвиняемый невиновен, пока вина не доказана судом","суд всегда прав","обвиняемый должен доказать невиновность"],"correct":1,"difficulty":1,"explanation":"Обвиняемый считается невиновным, пока вина не будет доказана в законном порядке и установлена приговором суда."},{"type":"single","text":"Какая мера наказания в Казахстане отменена?","options":["штраф","смертная казнь","конфискация","арест"],"correct":1,"difficulty":2,"explanation":"Смертная казнь отменена окончательно (2021 г. ратифицирован протокол; пожизненное заключение — максимальная мера)."},{"type":"single","text":"Право на труд, отдых, жилище и социальное обеспечение — это права:","options":["первого поколения (гражданские)","второго поколения (социально-экономические)","третьего поколения","политические"],"correct":1,"difficulty":2,"explanation":"Социально-экономические права («второе поколение») закреплены в Конституции и международных пактах."},{"type":"single","text":"Какие обязанности гражданина закреплены Конституцией РК?","options":["только платить налоги","соблюдать законы, платить налоги, беречь природу, защищать Республику","служить в армии и учиться","участвовать в выборах"],"correct":1,"difficulty":2,"explanation":"Ст. 34–37: соблюдение Конституции и законов, уважение прав других и госимволов, уплата налогов, охрана природы, защита Республики."},{"type":"single","text":"Свобода совести — это право:","options":["не соблюдать законы","исповедовать любую религию или не исповедовать никакой","создавать партии","не платить налоги"],"correct":1,"difficulty":1,"explanation":"Каждый сам определяет своё отношение к религии; светский характер государства гарантирует свободу совести."},{"type":"single","text":"Кто может обращаться в Конституционный Суд РК после реформы 2022–2023 гг.?","options":["только Президент","только Парламент","в том числе граждане","только прокуроры"],"correct":2,"difficulty":3,"explanation":"С 2023 г. граждане вправе напрямую обращаться в Конституционный Суд, если считают, что закон нарушает их права."},{"type":"single","text":"Никто не обязан свидетельствовать против:","options":["любого гражданина","себя, супруга и близких родственников","государства","своего работодателя"],"correct":1,"difficulty":2,"explanation":"Конституционная гарантия: свидетельствовать против себя, супруга (супруги) и близких родственников — право, а не обязанность."}]},{"title":"Юридическая ответственность несовершеннолетних","grade_min":8,"grade_max":9,"order":2,"theory":"<h3>Понятие юридической ответственности<\/h3><p><b>Юридическая ответственность<\/b> — обязанность лица претерпеть неблагоприятные последствия за правонарушение. Виды: уголовная, административная, гражданско-правовая, дисциплинарная.<\/p><h3>Возраст ответственности в Казахстане<\/h3><ul><li><b>Уголовная ответственность<\/b> (УК РК): общий возраст — с <b>16 лет<\/b>; за тяжкие и особо тяжкие преступления (убийство, изнасилование, кража, грабёж, разбой, вымогательство, терроризм, угон и др.) — с <b>14 лет<\/b>;<\/li><li><b>Административная ответственность<\/b> (КоАП РК): с <b>16 лет<\/b>; при недостижении возраста ответственность за некоторые правонарушения несут родители (ст. 127 КоАП — неисполнение обязанностей по воспитанию);<\/li><li><b>Гражданско-правовая<\/b>: малолетние до 14 лет не отвечают (отвечают родители/опекуны); с 14 до 18 лет — несут ответственность сами, при отсутствии средств — субсидиарно родители; с 18 лет (или при эмансипации/вступлении в брак) — полная дееспособность;<\/li><li><b>Дисциплинарная<\/b>: по Трудовому кодексу — с 16 лет (заключение трудового договора по общему правилу с 16; лёгкий труд с 15, с 14 — с согласия родителя и без ущерба учёбе).<\/li><\/ul><h3>Правонарушения<\/h3><ul><li><b>Проступок<\/b> — деяние небольшой опасности (административное правонарушение): безбилетный проезд, мелкое хулиганство, нарушение ПДД;<\/li><li><b>Преступление<\/b> — общественно опасное деяние, запрещённое УК: кража, грабёж, угон, вандализм, киберпреступления.<\/li><\/ul><h3>Виды наказаний для несовершеннолетних (УК РК)<\/h3><p>Штраф (при наличии заработка/имущества), общественные работы, исправительные работы, ограничение свободы, лишение свободы (сроки сокращены; к малолетним — особые колонии; до 16 лет — не более 6 лет, за особо тяжкие — не более 10 лет). Учитываются условия жизни, влияние старших, возможность исправления без наказания.<\/p><h3>Профилактика<\/h3><p>Несовершеннолетние, совершившие правонарушения, ставятся на учёт в органах внутренних дел (ювенальная полиция); действуют школы с особым режимом; ювенальная юстиция — специализированные суды по делам несовершеннолетних.<\/p><h3>Кибербезопасность<\/h3><p>Ответственность за киберпреступления (мошенничество в сети, распространение запрещённого контента, буллинг) наступает на общих основаниях — с 14/16 лет. Будьте осторожны: репост, участие в группах с запрещённым контентом могут иметь правовые последствия.<\/p>","questions":[{"type":"single","text":"Общий возраст уголовной ответственности в РК:","options":["14 лет","16 лет","18 лет","12 лет"],"correct":1,"difficulty":1,"explanation":"По общему правилу — с 16 лет; за тяжкие и особо тяжкие преступления — с 14 лет."},{"type":"single","text":"За убийство и кражу уголовная ответственность наступает с:","options":["14 лет","16 лет","18 лет","21 года"],"correct":0,"difficulty":2,"explanation":"Перечень преступлений с пониженным возрастом ответственности (14 лет) включает убийство, кражу, грабёж, разбой и др."},{"type":"single","text":"Административная ответственность в РК наступает с:","options":["14 лет","15 лет","16 лет","18 лет"],"correct":2,"difficulty":1,"explanation":"КоАП РК — с 16 лет; за малолетних отвечают родители (штраф, учёт)."},{"type":"single","text":"Полная гражданская дееспособность по общему правилу наступает с:","options":["14 лет","16 лет","18 лет","21 года"],"correct":2,"difficulty":1,"explanation":"С 18 лет; возможно раньше — при эмансипации или вступлении в брак."},{"type":"single","text":"Кто несёт гражданскую ответственность за вред, причинённый 10-летним ребёнком?","options":["сам ребёнок","родители (опекуны)","школа всегда","никто"],"correct":1,"difficulty":2,"explanation":"Малолетние до 14 лет недееспособны — ответственность несут родители/опекуны, если не докажут отсутствие своей вины."},{"type":"single","text":"Кража чужого имущества — это:","options":["административный проступок любой","уголовное преступление","дисциплинарный проступок","гражданская сделка"],"correct":1,"difficulty":1,"explanation":"Кража — тайное хищение — запрещена УК РК (мелкое хищение может быть административным правонарушением)."},{"type":"single","text":"Безбилетный проезд в автобусе — это:","options":["преступление","административное правонарушение","дисциплинарный проступок","гражданско-правовое нарушение"],"correct":1,"difficulty":1,"explanation":"Это административный проступок (штраф по КоАП); для лиц младше 16 лет штрафуют родителей."},{"type":"single","text":"Трудовой договор по общему правилу можно заключать с:","options":["14 лет","15 лет","16 лет","18 лет"],"correct":2,"difficulty":2,"explanation":"С 16 лет; с 15 — на лёгкий труд без ущерба учёбе; с 14 — с письменного согласия родителя."},{"type":"single","text":"Специализированные органы полиции, работающие с подростками-правонарушителями:","options":["криминальная полиция","ювенальная полиция","налоговая полиция","транспортная полиция"],"correct":1,"difficulty":2,"explanation":"Ювенальная полиция занимается профилактикой правонарушений среди несовершеннолетних."},{"type":"single","text":"Какое наказание НЕ может применяться к несовершеннолетним?","options":["штраф","общественные работы","смертная казнь","ограничение свободы"],"correct":2,"difficulty":1,"explanation":"Смертная казнь в Казахстане отменена вообще, а к несовершеннолетним не применяются также пожизненное заключение и ряд мер."}]},{"title":"Основы трудового и гражданского права","grade_min":10,"grade_max":11,"order":3,"theory":"<h3>Трудовое право (Трудовой кодекс РК)<\/h3><p><b>Трудовой договор<\/b> — соглашение между работником и работодателем: работник лично выполняет работу за плату, подчиняясь правилам, работодатель обеспечивает условия и платит зарплату. Обязателен в письменной форме; без договора работа считается незаконной.<\/p><ul><li>Рабочее время: норма — не более <b>40 часов в неделю<\/b>; для 14–16 лет — не более 24 ч, для 16–18 лет — не более 36 ч; запрещено привлекать несовершеннолетних к тяжёлым и вредным работам, ночным сменам;<\/li><li>Отпуск: оплачиваемый ежегодный — не менее <b>24 календарных дней<\/b>;<\/li><li>Зарплата — не ниже минимальной (МЗП), выплачивается не реже раза в месяц;<\/li><li>Расторжение: по соглашению сторон, по инициативе работника (предупреждение за 1 месяц), по инициативе работодателя (сокращение, прогул — отсутствие более 3 часов без причины и др.);<\/li><li>Испытательный срок — не более 3 месяцев (для руководителей и главных бухгалтеров — до 6);<\/li><li>Споры решаются согласительной комиссией и судом.<\/li><\/ul><h3>Гражданское право (Гражданский кодекс РК)<\/h3><ul><li><b>Дееспособность:<\/b> полная — с 18 лет; частичная 14–18 лет (мелкие бытовые сделки, распоряжение своим заработком, вклады в банках — с согласия законных представителей); малолетние 7–14 лет — мелкие бытовые сделки;<\/li><li><b>Сделки:<\/b> односторонние (завещание, доверенность) и двусторонние/многосторонние (договоры); форма — устная, простая письменная, нотариальная (купля-продажа жилья, завещание, доверенность на управление имуществом);<\/li><li>Недействительные сделки: мнимые, притворные, совершённые недееспособным, под влиянием обмана или насилия;<\/li><li><b>Договоры:<\/b> купли-продажи, аренды (найма), займа, подряда, оказания услуг; свобода договора;<\/li><li><b>Наследование:<\/b> по завещанию и по закону (очереди: 1-я — дети, супруг(а), родители; 2-я — братья/сёстры, дедушки/бабушки…); срок принятия наследства — <b>6 месяцев<\/b>; обязательная доля — несовершеннолетним детям и нетрудоспособным иждивенцам;<\/li><li><b>Исковая давность:<\/b> общий срок — <b>3 года<\/b>.<\/li><\/ul><h3>Семейное право (Кодекс «О браке (супружестве) и семье»)<\/h3><p>Брачный возраст — <b>18 лет<\/b>; брак регистрируется в органах РАГС (религиозный обряд без регистрации не создаёт правовых последствий); права и обязанности супругов равны; брачный договор возможен; алименты на детей — 1/4 на одного, 1/3 на двух, 1/2 на трёх и более.<\/p>","questions":[{"type":"single","text":"Нормальная продолжительность рабочего времени в неделю по ТК РК:","options":["не более 36 часов","не более 40 часов","не более 45 часов","48 часов"],"correct":1,"difficulty":1,"explanation":"Не более 40 часов в неделю; для несовершеннолетних — сокращённое (24/36 ч)."},{"type":"single","text":"Минимальная продолжительность оплачиваемого ежегодного трудового отпуска:","options":["18 календарных дней","21 день","24 календарных дня","30 дней"],"correct":2,"difficulty":1,"explanation":"Не менее 24 календарных дней (больше — для педагогов, госслужащих, инвалидов и др.)."},{"type":"single","text":"С какого возраста работник вправе сам распоряжаться своим заработком?","options":["с 7 лет","с 14 лет","с 16 лет","с 18 лет"],"correct":1,"difficulty":2,"explanation":"С 14 лет (частичная дееспособность): мелкие бытовые сделки и распоряжение своим заработком/стипендией."},{"type":"single","text":"Общий срок исковой давности в гражданском праве РК:","options":["6 месяцев","1 год","3 года","10 лет"],"correct":2,"difficulty":2,"explanation":"Общий срок исковой давности — 3 года (для отдельных требований установлены специальные сроки)."},{"type":"single","text":"Срок для принятия наследства по закону:","options":["3 месяца","6 месяцев","1 год","2 года"],"correct":1,"difficulty":2,"explanation":"Наследство принимается в течение 6 месяцев со дня открытия (смерти наследодателя)."},{"type":"single","text":"К первой очереди наследников по закону относятся:","options":["братья и сёстры","дети, супруг(а), родители","дяди и тёти","внуки всегда"],"correct":1,"difficulty":2,"explanation":"Первая очередь: дети, супруг(а) и родители наследодателя; внуки наследуют по праву представления."},{"type":"single","text":"Брачный возраст в Казахстане:","options":["16 лет","17 лет","18 лет","21 год"],"correct":2,"difficulty":1,"explanation":"18 лет; снижение возможно не более чем на 2 года при беременности/рождении ребёнка."},{"type":"single","text":"Какая форма обязательна для завещания?","options":["устная","простая письменная","нотариально удостоверенная","электронная"],"correct":2,"difficulty":2,"explanation":"Завещание требует нотариального удостоверения (в исключительных случаях приравниваются удостоверения других должностных лиц)."},{"type":"single","text":"Работник, увольняясь по своей инициативе, обязан предупредить работодателя:","options":["за 2 недели","за 1 месяц","за 3 дня","не обязан"],"correct":1,"difficulty":2,"explanation":"По ТК РК — письменное уведомление не менее чем за 1 месяц (если не согласован иной срок)."},{"type":"single","text":"Размер алиментов на одного ребёнка по общему правилу:","options":["1/4 заработка","1/3","1/2","10%"],"correct":0,"difficulty":2,"explanation":"На одного ребёнка — 1/4, на двух — 1/3, на трёх и более — 1/2 заработка или иного дохода."}]}]}]},{"title":"Информатика","icon":"💻","color":"#1c7ed6","order":9,"sections":[{"title":"Основы информатики","order":1,"topics":[{"title":"Системы счисления","grade_min":7,"grade_max":8,"order":1,"theory":"<h3>Что такое система счисления<\/h3><p><b>Система счисления (СС)<\/b> — способ записи чисел с помощью символов (цифр). Бывают <b>позиционные<\/b> (значение цифры зависит от её позиции: десятичная, двоичная, восьмеричная, шестнадцатеричная) и <b>непозиционные<\/b> (римская: I=1, V=5, X=10, L=50, C=100, D=500, M=1000).<\/p><h3>Двоичная система<\/h3><p>Основание 2, цифры 0 и 1 — базовая система компьютеров. Перевод из двоичной в десятичную: сумма степеней двойки.<\/p><p><b>Пример:<\/b> 1011₂ = 1·2³ + 0·2² + 1·2¹ + 1·2⁰ = 8 + 0 + 2 + 1 = 11₁₀.<\/p><h3>Перевод из десятичной в двоичную<\/h3><p>Деление числа на 2 с записью остатков; результат читается «снизу вверх».<\/p><p><b>Пример:<\/b> 13 → 13/2 = 6 (ост. 1), 6/2 = 3 (ост. 0), 3/2 = 1 (ост. 1), 1/2 = 0 (ост. 1) → 1101₂.<\/p><h3>Восьмеричная и шестнадцатеричная<\/h3><ul><li>Восьмеричная: основание 8, цифры 0–7. Перевод из двоичной — по <b>триадам<\/b> (3 двоичных разряда = 1 восьмеричная цифра): 110 101₂ = 65₈.<\/li><li>Шестнадцатеричная: основание 16, цифры 0–9 и A=10, B=11, C=12, D=13, E=14, F=15. Перевод — по <b>тетрадам<\/b> (4 разряда): 1111 1010₂ = FA₁₆.<\/li><\/ul><h3>Единицы измерения информации<\/h3><p>1 бит — минимальная единица (0 или 1). 1 байт = 8 бит. 1 КБ = 1024 байта, 1 МБ = 1024 КБ, 1 ГБ = 1024 МБ, 1 ТБ = 1024 ГБ.<\/p><h3>Формула мощности алфавита<\/h3><p>Число возможных сообщений из n разрядов: <b>N = 2ⁿ<\/b>. Мощность алфавита: N = 2ⁱ, где i — информационный вес символа (бит). Пример: алфавит из 32 символов несёт i = 5 бит на символ.<\/p><h3>Объём информации<\/h3><p>I = K · i, где K — число символов, i — вес одного символа в битах.<\/p>","questions":[{"type":"single","text":"Переведите двоичное число 1011 в десятичную систему.","options":["9","11","13","10"],"correct":1,"difficulty":1,"explanation":"1·8 + 0·4 + 1·2 + 1·1 = 11."},{"type":"single","text":"Переведите десятичное число 13 в двоичную систему.","options":["1101","1011","1110","1001"],"correct":0,"difficulty":2,"explanation":"13 = 8+4+1 → 1101₂ (или делением: остатки 1, 0, 1, 1 снизу вверх)."},{"type":"single","text":"Сколько бит в одном байте?","options":["4","8","16","1024"],"correct":1,"difficulty":1,"explanation":"1 байт = 8 бит."},{"type":"single","text":"Сколько байт в 1 КБ?","options":["100","1000","1024","512"],"correct":2,"difficulty":1,"explanation":"1 КБ = 2¹⁰ байт = 1024 байта."},{"type":"single","text":"Какое число обозначает шестнадцатеричная цифра F?","options":["14","15","16","13"],"correct":1,"difficulty":2,"explanation":"A=10, B=11, C=12, D=13, E=14, F=15."},{"type":"single","text":"Чему равно число 25 в двоичной системе?","options":["11001","10101","11010","10011"],"correct":0,"difficulty":2,"explanation":"25 = 16 + 8 + 1 = 11001₂."},{"type":"single","text":"Алфавит состоит из 32 символов. Сколько бит несёт один символ?","options":["4","5","6","32"],"correct":1,"difficulty":2,"explanation":"N = 2ⁱ → 32 = 2⁵ → i = 5 бит."},{"type":"single","text":"Переведите двоичное 110101 в восьмеричную систему (по триадам).","options":["65₈","53₈","325₈","125₈"],"correct":0,"difficulty":3,"explanation":"110 = 6, 101 = 5 → 65₈."},{"type":"single","text":"Римское число XIV равно:","options":["12","14","16","24"],"correct":1,"difficulty":1,"explanation":"X = 10, IV = 4 → 14. Римская система — непозиционная."},{"type":"single","text":"Сколько различных чисел можно записать с помощью 4 двоичных разрядов?","options":["4","8","16","15"],"correct":2,"difficulty":2,"explanation":"N = 2ⁿ = 2⁴ = 16 чисел (от 0 до 15)."}]},{"title":"Алгоритмы и основы программирования","grade_min":8,"grade_max":9,"order":2,"theory":"<h3>Алгоритм<\/h3><p><b>Алгоритм<\/b> — конечная последовательность точных инструкций для решения задачи. Свойства:<\/p><ul><li><b>Дискретность<\/b> — разбит на шаги;<\/li><li><b>Понятность<\/b> — команды известны исполнителю;<\/li><li><b>Определённость (детерминированность)<\/b> — каждая команда однозначна;<\/li><li><b>Конечность (результативность)<\/b> — завершается за конечное число шагов с результатом;<\/li><li><b>Массовость<\/b> — применим ко всему классу задач.<\/li><\/ul><h3>Способы записи<\/h3><p>Словесный, графический (<b>блок-схема<\/b>: овал — начало/конец, прямоугольник — действие, ромб — условие, параллелограмм — ввод/вывод), псевдокод, программа на языке программирования.<\/h3><h3>Структуры алгоритмов<\/h3><ul><li><b>Следование (линейный)<\/b> — команды по порядку;<\/li><li><b>Ветвление<\/b> — if / else (полное и неполное);<\/li><li><b>Цикл<\/b> — повторение: «пока» (while), «до» (do…while), «для» (for — счётчик).<\/li><\/ul><h3>Основы программирования (Python)<\/h3><p>Переменная — именованная область памяти. Типы данных: int (целые), float (вещественные), str (строки), bool (True/False), list (списки).<\/p><pre>print(\"Привет\")      # вывод\nx = int(input())     # ввод и преобразование\nif x > 0:\n    print(\"положительное\")\nelif x == 0:\n    print(\"ноль\")\nelse:\n    print(\"отрицательное\")\nfor i in range(5):   # 0,1,2,3,4\n    print(i)\nwhile x < 10:\n    x += 1<\/pre><h3>Операции<\/h3><p>Арифметические: + − * / (деление, результат float), // (целочисленное), % (остаток), ** (степень). Логические: and, or, not. Сравнение: == != &gt; &lt; &gt;= &lt;=.<\/p><p><b>Пример:<\/b> 17 // 5 = 3, 17 % 5 = 2, 2 ** 3 = 8.<\/p><h3>Исполнители<\/h3><p>Формальный исполнитель (робот, компьютер) не понимает смысл — выполняет команды точно. Система команд исполнителя (СКИ) — набор допустимых команд.<\/p>","questions":[{"type":"single","text":"Какое свойство алгоритма означает, что он завершается за конечное число шагов?","options":["дискретность","массовость","конечность (результативность)","понятность"],"correct":2,"difficulty":1,"explanation":"Конечность: алгоритм должен завершиться и дать результат за конечное число шагов."},{"type":"single","text":"В блок-схеме условие изображается фигурой:","options":["овал","прямоугольник","ромб","параллелограмм"],"correct":2,"difficulty":1,"explanation":"Ромб — ветвление/условие; прямоугольник — действие; овал — начало/конец; параллелограмм — ввод/вывод."},{"type":"single","text":"Какая структура алгоритма отвечает за повторение действий?","options":["следование","ветвление","цикл","подпрограмма"],"correct":2,"difficulty":1,"explanation":"Цикл (while, for) — многократное выполнение команд."},{"type":"single","text":"Чему равно 17 % 5 в Python?","options":["3","2","3.4","12"],"correct":1,"difficulty":2,"explanation":"% — остаток от деления: 17 = 3·5 + 2 → остаток 2. (17 // 5 = 3.)"},{"type":"single","text":"Что выведет range(3) в цикле for?","options":["1, 2, 3","0, 1, 2","0, 1, 2, 3","3, 3, 3"],"correct":1,"difficulty":2,"explanation":"range(3) генерирует 0, 1, 2 — от 0 до n−1."},{"type":"single","text":"Какой тип данных в Python хранит текст?","options":["int","float","str","bool"],"correct":2,"difficulty":1,"explanation":"str (string) — строковый тип: «Привет», 'abc'."},{"type":"single","text":"Результат выражения 2 ** 4:","options":["8","6","16","24"],"correct":2,"difficulty":1,"explanation":"** — возведение в степень: 2⁴ = 16."},{"type":"single","text":"Какое логическое выражение истинно (True)?","options":["5 > 7","3 == 4","10 >= 10","2 < 1"],"correct":2,"difficulty":1,"explanation":">= — «больше или равно»: 10 >= 10 истинно."},{"type":"single","text":"Свойство «массовость» алгоритма означает:","options":["алгоритм тяжёлый по объёму","применимость к целому классу задач","работу с большими данными","выполнение на многих компьютерах"],"correct":1,"difficulty":2,"explanation":"Массовость — алгоритм решает не одну конкретную задачу, а класс подобных (любые входные данные)."},{"type":"single","text":"Формальный исполнитель (например, робот) отличается от человека тем, что:","options":["понимает смысл команд","не рассуждает и точно выполняет СКИ","может нарушать алгоритм","работает быстрее всегда"],"correct":1,"difficulty":2,"explanation":"Формальный исполнитель не вникает в смысл — выполняет команды системы команд исполнителя."}]},{"title":"Компьютерные сети и информационная безопасность","grade_min":8,"grade_max":9,"order":3,"theory":"<h3>Компьютерные сети<\/h3><p><b>Компьютерная сеть<\/b> — совокупность устройств, соединённых каналами связи для обмена данными. Виды по охвату: <b>PAN<\/b> (персональная, Bluetooth), <b>LAN<\/b> (локальная — класс, офис), <b>MAN<\/b> (городская), <b>WAN<\/b> (глобальная — Интернет).<\/p><h3>Основы Интернета<\/h3><ul><li><b>IP-адрес<\/b> — уникальный адрес устройства в сети (IPv4: 4 числа 0–255, напр. 192.168.1.5; IPv6 — 128-битный);<\/li><li><b>DNS<\/b> — система доменных имён: переводит имена (bilim.kz) в IP-адреса;<\/li><li><b>Протоколы<\/b>: HTTP/HTTPS (веб, HTTPS — защищённый с SSL/TLS), FTP (файлы), SMTP/IMAP/POP3 (почта), TCP/IP (основной набор);<\/li><li><b>URL<\/b> — адрес ресурса: протокол://домен/путь?параметры;<\/li><li>Устройства: модем, маршрутизатор (роутер), коммутатор (свитч), точка доступа Wi-Fi.<\/li><\/ul><h3>Информационная безопасность<\/h3><ul><li><b>Три кита ИБ (CIA):<\/b> конфиденциальность, целостность, доступность;<\/li><li><b>Пароли:<\/b> длинные (12+ символов), разные для разных сервисов, двухфакторная аутентификация (2FA);<\/li><li><b>Угрозы:<\/b> вирусы, черви, трояны, фишинг (поддельные сайты/письма), социальная инженерия, ransomware (шифровальщики), DDoS-атаки;<\/li><li><b>Защита:<\/b> антивирус, обновления, резервные копии (3-2-1), осторожность с вложениями и ссылками, HTTPS;<\/li><li>Персональные данные: не публиковать чужие данные, соблюдать цифровую гигиену и цифровой этикет.<\/li><\/ul><h3>Правовые основы Казахстана<\/h3><p>Закон РК «Об информатизации», «О персональных данных и их защите» (2013); уголовная ответственность за неправомерный доступ к информации и создание вредоносных программ (УК РК, гл. 7 — преступления в сфере компьютерной информации); egov.kz — электронное правительство, ЭЦП (электронная цифровая подпись).<\/p>","questions":[{"type":"single","text":"Локальная сеть обозначается аббревиатурой:","options":["WAN","LAN","DNS","URL"],"correct":1,"difficulty":1,"explanation":"LAN (Local Area Network) — локальная сеть; WAN — глобальная."},{"type":"single","text":"Что делает DNS?","options":["шифрует трафик","преобразует доменные имена в IP-адреса","защищает от вирусов","ускоряет интернет"],"correct":1,"difficulty":1,"explanation":"DNS — «телефонная книга» Интернета: имя сайта → IP-адрес."},{"type":"single","text":"Какой протокол обеспечивает защищённое соединение с сайтом?","options":["HTTP","FTP","HTTPS","SMTP"],"correct":2,"difficulty":1,"explanation":"HTTPS = HTTP + шифрование SSL/TLS; значок замка в адресной строке."},{"type":"single","text":"Пример корректного IPv4-адреса:","options":["256.1.1.1","192.168.1.5","192.168.1","http://1.1.1"],"correct":1,"difficulty":2,"explanation":"IPv4 — четыре числа от 0 до 255 через точки; 256 — недопустимо."},{"type":"single","text":"Фишинг — это:","options":["вид компьютерной игры","мошенничество с поддельными сайтами и письмами для кражи данных","способ ускорения сети","вид резервного копирования"],"correct":1,"difficulty":1,"explanation":"Фишинг выманивает логины, пароли и данные карт через подделки известных сайтов/писем."},{"type":"single","text":"Три основных свойства информационной безопасности:","options":["скорость, цена, качество","конфиденциальность, целостность, доступность","шифрование, сжатие, передача","ввод, обработка, вывод"],"correct":1,"difficulty":2,"explanation":"Модель CIA: Confidentiality, Integrity, Availability."},{"type":"single","text":"Какая практика НЕ повышает безопасность аккаунта?","options":["двухфакторная аутентификация","один пароль на все сайты","длинные уникальные пароли","регулярные обновления"],"correct":1,"difficulty":1,"explanation":"Один пароль везде опасен: утечка одного сервиса компрометирует все аккаунты."},{"type":"single","text":"ЭЦП в Казахстане используется для:","options":["рисования","подписания электронных документов на egov.kz и в банках","ускорения интернета","создания сайтов"],"correct":1,"difficulty":1,"explanation":"Электронная цифровая подпись придаёт документу юридическую силу (egov.kz, банковские операции)."},{"type":"single","text":"Программа-шифровальщик (ransomware) делает:","options":["ускоряет систему","шифрует данные и требует выкуп","чистит кэш","обновляет драйверы"],"correct":1,"difficulty":2,"explanation":"Ransomware блокирует доступ к данным с требованием выкупа; защита — резервные копии."},{"type":"single","text":"Глобальная компьютерная сеть — это:","options":["LAN","PAN","Интернет (WAN)","интранет офиса"],"correct":2,"difficulty":1,"explanation":"Интернет — крупнейшая WAN, объединяющая сети всего мира."}]}]}]}];</script>
<script>
"use strict";
/* ============ Bilim+ DEMO — вся логика локально ============ */
const TEST_SIZE = 10, PASS = 0.7;
const $app = document.getElementById("app");

/* ---------- индексация контента ---------- */
const SUBJECTS = [];   // {id,title,icon,color,sections:[{id,title,topics:[{id,title,grade_min,grade_max,theory,questions}]}]}
const TOPICS = {};     // id -> {topic, sectionTitle, subjectId, subjectTitle, icon, color}
(function indexContent() {
  let sid = 1, secid = 1, tid = 1;
  for (const sp of window.BILIM_DATA) {
    const subj = { id: sid++, title: sp.title, icon: sp.icon, color: sp.color, sections: [] };
    for (const sd of (sp.sections || [])) {
      const sec = { id: secid++, title: sd.title, topics: [] };
      for (const td of (sd.topics || [])) {
        const t = { id: tid++, title: td.title, grade_min: td.grade_min, grade_max: td.grade_max,
                    theory: td.theory, questions: (td.questions || []).map(q => ({ ...q })) };
        t.questions.forEach((q, i) => { q.id = t.id * 1000 + i; });
        sec.topics.push(t);
        TOPICS[t.id] = { t, sectionTitle: sec.title, subjectId: subj.id, subjectTitle: subj.title,
                         icon: subj.icon, color: subj.color };
      }
      subj.sections.push(sec);
    }
    SUBJECTS.push(subj);
  }
})();

/* ---------- состояние (прогресс) ---------- */
const MEM = { v: null };
function lsGet() { try { return localStorage.getItem("bilim_demo_v1"); } catch (e) { return MEM.v; } }
function lsSet(v) { try { localStorage.setItem("bilim_demo_v1", v); } catch (e) { MEM.v = v; } }
let STATE = JSON.parse(lsGet() || "null") || { name: null, read: [], attempts: [] };
function saveState() { lsSet(JSON.stringify(STATE)); }

/* ---------- утилиты ---------- */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pct(x) { return Math.round((x || 0) * 100); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg) { document.querySelectorAll(".toast").forEach(t => t.remove()); const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
function fmtDate(iso) { const d = new Date(iso); return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); }
function statusBadge(st, best) {
  if (st === "passed") return '<span class="badge passed">✓ Сдано ' + pct(best) + '%</span>';
  if (st === "read") return '<span class="badge read">📖 Прочитано</span>';
  return '<span class="badge new">Новое</span>';
}

/* ---------- локальный «бэкенд»: прогресс ---------- */
function topicProgress(tid) {
  const atts = STATE.attempts.filter(a => a.topic_id === tid && a.submitted);
  const passed = atts.some(a => a.passed);
  const best = atts.reduce((m, a) => Math.max(m, a.score || 0), 0);
  const read = STATE.read.includes(tid);
  return {
    attempts_count: atts.length, best_score: best,
    status: passed ? "passed" : (atts.length || read ? "read" : "new"),
  };
}
function markRead(tid) { if (!STATE.read.includes(tid)) { STATE.read.push(tid); saveState(); } }

/* ---------- локальный «бэкенд»: адаптивная генерация теста ---------- */
function buildQuestionSet(topic) {
  const pool = topic.questions.slice();
  if (!pool.length) throw new Error("Банк вопросов пуст");
  const byId = {}; pool.forEach(q => byId[q.id] = q);
  const prev = STATE.attempts.filter(a => a.topic_id === topic.id && a.submitted);
  const K = Math.min(TEST_SIZE, pool.length);

  if (!prev.length) {
    const byDiff = { 1: [], 2: [], 3: [] };
    pool.forEach(q => (byDiff[q.difficulty] || byDiff[1]).push(q));
    Object.values(byDiff).forEach(shuffle);
    const picked = []; let i = 0;
    while (picked.length < K && Object.values(byDiff).some(a => a.length)) {
      const d = [1, 2, 3][i % 3];
      if (byDiff[d] && byDiff[d].length) picked.push(byDiff[d].pop());
      i++;
    }
    return { questions: shuffle(picked), isRetry: false, reason: null };
  }

  const wrong = new Set(), seen = new Set();
  prev.forEach(a => (a.answers || []).forEach(an => { seen.add(an.question_id); if (!an.is_correct) wrong.add(an.question_id); }));
  const lastIds = new Set(prev[prev.length - 1].question_ids || []);

  const picked = [];
  const wrongPool = shuffle([...wrong].filter(id => byId[id]).map(id => byId[id]));
  const maxWrong = Math.max(1, Math.floor(K * 0.6));
  picked.push(...wrongPool.slice(0, maxWrong));

  const pickedIds = () => new Set(picked.map(q => q.id));
  let fresh = shuffle(pool.filter(q => !seen.has(q.id) && !lastIds.has(q.id)));
  for (const q of fresh) { if (picked.length >= K) break; picked.push(q); }
  if (picked.length < K) {
    const rest = shuffle(pool.filter(q => !pickedIds().has(q.id) && !lastIds.has(q.id)));
    for (const q of rest) { if (picked.length >= K) break; picked.push(q); }
  }
  if (picked.length < K) {
    const rest = shuffle(pool.filter(q => !pickedIds().has(q.id)));
    for (const q of rest) { if (picked.length >= K) break; picked.push(q); }
  }
  const reason = wrongPool.length
    ? `Прошлый тест не сдан. В новый тест включено ${Math.min(wrongPool.length, maxWrong)} вопрос(ов), где были ошибки, остальные — новые.`
    : "Новый тест с другими вопросами из банка темы.";
  return { questions: shuffle(picked), isRetry: true, reason };
}

function startTestLocal(tid) {
  const topic = TOPICS[tid] && TOPICS[tid].t;
  if (!topic) return toast("Тема не найдена");
  markRead(tid);
  let set; try { set = buildQuestionSet(topic); } catch (e) { return toast(e.message); }
  const attempt = {
    id: Date.now(), topic_id: tid,
    question_ids: set.questions.map(q => q.id),
    questions: set.questions,           // demo: храним сами вопросы
    is_retry: set.isRetry, retry_reason: set.reason,
    submitted: false, score: null, passed: null, answers: [],
    created_at: new Date().toISOString(),
  };
  STATE.attempts.push(attempt); saveState();
  TEST_STATE = { attempt, picks: {}, result: null };
  go("#/test/" + attempt.id);
}

function isCorrect(sel, correct, type) {
  if (type === "multiple") {
    const a = Array.isArray(sel) ? sel.slice().sort() : (sel == null ? [] : [sel]);
    const b = (Array.isArray(correct) ? correct : [correct]).slice().sort();
    return a.length === b.length && a.every((v, i) => v === b[i]);
  }
  return sel != null && sel === correct;
}

function submitTestLocal() {
  const { attempt } = TEST_STATE;
  const answers = attempt.questions.map(q => ({
    question_id: q.id, selected: TEST_STATE.picks[q.id] ?? null,
    is_correct: isCorrect(TEST_STATE.picks[q.id] ?? null, q.correct, q.type),
  }));
  const unansweredQ = attempt.questions.filter(q => {
    const s = TEST_STATE.picks[q.id];
    return s === null || s === undefined || (Array.isArray(s) && !s.length);
  });
  if (unansweredQ.length) {
    toast(`Осталось ответить: ${unansweredQ.length}`);
    const el = document.getElementById("qcard-" + unansweredQ[0].id);
    if (el && el.scrollIntoView) { try { el.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {} }
    return;
  }
  const correctCount = answers.filter(a => a.is_correct).length;
  const score = correctCount / answers.length;
  const passed = score >= PASS;
  Object.assign(attempt, { submitted: true, answers, score, passed });
  saveState();
  const need = Math.ceil(PASS * answers.length);
  TEST_STATE.result = {
    score, passed, total: answers.length, correct_count: correctCount, can_retry: !passed,
    retry_hint: passed ? null : `Нужно минимум ${need} из ${answers.length} правильных ответов (70%). Разбери ошибки ниже и пройди новый тест — он будет составлен с учётом твоих слабых мест.`,
    results: attempt.questions.map(q => {
      const an = answers.find(a => a.question_id === q.id);
      return { question_id: q.id, text: q.text, options: q.options, selected: an.selected, correct: q.correct, is_correct: an.is_correct, explanation: q.explanation };
    }),
  };
  go("#/result/" + attempt.id);
}

let _resetArmed = false;
function logoutDemo() {
  if (!_resetArmed) {
    _resetArmed = true;
    const btn = document.getElementById("resetBtn");
    if (btn) btn.textContent = "Точно? ↺";
    setTimeout(() => { _resetArmed = false; const b = document.getElementById("resetBtn"); if (b) b.textContent = "↺"; }, 3000);
    return;
  }
  _resetArmed = false;
  STATE = { name: null, read: [], attempts: [] }; saveState(); TEST_STATE = null;

/* ---------- экраны ---------- */
function screenAuth() {
  $app.innerHTML = `<div class="auth-wrap"><div class="auth-card">
    <div class="auth-logo">🎓</div><div class="auth-title">Bilim+</div>
    <div class="auth-sub">Школьная база Казахстана: теория и адаптивные тесты по 9 предметам для 5–11 классов.<br><br><b>Демо-режим:</b> весь контент и логика тестов работают прямо в этом файле, прогресс сохраняется в браузере. В полной версии — аккаунты и сервер.</div>
    <div class="field"><label>Как тебя зовут?</label>
      <input id="fName" placeholder="Например, Аружан" autocomplete="off"></div>
    <div class="error-msg" id="nameErr" style="display:none">Введи имя — минимум 2 буквы</div>
    <button class="btn" type="button" data-action="login">Начать обучение →</button>
  </div></div>`;
  const nameEl = document.getElementById("fName");
