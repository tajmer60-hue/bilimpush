<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilim+ — демо (офлайн)</title>
<style>
:root {
  --bg: #f1f3f9; --card: #ffffff; --text: #1a2233; --muted: #64748b;
  --primary: #4263eb; --primary-dark: #364fc7; --primary-light: #edf2ff;
  --green: #2f9e44; --green-light: #ebfbee;
  --red: #e03131; --red-light: #fff5f5;
  --amber: #f08c00; --amber-light: #fff9db;
  --radius: 16px; --shadow: 0 2px 12px rgba(26,34,51,.07);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.55; min-height:100vh; }
button { font-family:inherit; cursor:pointer; }
a { color:var(--primary); text-decoration:none; }
.header { background:linear-gradient(135deg,#4263eb 0%,#5f3dc4 100%); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:50; box-shadow:0 2px 10px rgba(66,99,235,.35); flex-wrap:wrap; }
.header .logo { font-size:20px; font-weight:800; cursor:pointer; }
.header .logo span { opacity:.8; font-weight:400; }
.header nav { margin-left:auto; display:flex; gap:6px; align-items:center; }
.nav-btn { background:rgba(255,255,255,.14); border:none; color:#fff; padding:8px 14px; border-radius:10px; font-size:14px; font-weight:600; }
.nav-btn:hover,.nav-btn.active { background:rgba(255,255,255,.28); }
.demo-chip { background:#ffe066; color:#7a5b00; font-size:11px; font-weight:800; padding:3px 9px; border-radius:20px; }
.container { max-width:960px; margin:0 auto; padding:20px 16px 60px; }
.auth-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#4263eb 0%,#5f3dc4 55%,#7048e8 100%); padding:20px; }
.auth-card { background:var(--card); border-radius:22px; padding:36px 30px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,.28); }
.auth-logo { text-align:center; margin-bottom:6px; font-size:44px; }
.auth-title { text-align:center; font-size:26px; font-weight:800; color:var(--primary-dark); }
.auth-sub { text-align:center; color:var(--muted); font-size:14px; margin-bottom:22px; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:5px; }
.field input { width:100%; padding:12px 14px; border:1.5px solid #dde3ee; border-radius:11px; font-size:15px; outline:none; background:#fbfcfe; }
.field input:focus { border-color:var(--primary); background:#fff; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--primary); color:#fff; border:none; padding:13px 22px; border-radius:12px; font-size:15px; font-weight:700; width:100%; }
.btn:hover { background:var(--primary-dark); }
.btn.green { background:var(--green); }
.btn.green:hover { background:#2b8a3e; }
.btn.outline { background:transparent; color:var(--primary); border:2px solid var(--primary); }
.btn.outline:hover { background:var(--primary-light); }
.page-title { font-size:24px; font-weight:800; margin-bottom:4px; }
.page-sub { color:var(--muted); font-size:14.5px; margin-bottom:20px; }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px; }
.stat-card { background:var(--card); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); text-align:center; }
.stat-num { font-size:26px; font-weight:800; color:var(--primary); }
.stat-label { font-size:12.5px; color:var(--muted); font-weight:600; margin-top:2px; }
.card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:16px; }
.card h3 { font-size:16.5px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.subject-progress { display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid #f0f2f8; }
.subject-progress:last-child { border-bottom:none; }
.subject-progress .sp-icon { font-size:22px; width:34px; text-align:center; }
.subject-progress .sp-info { flex:1; min-width:0; }
.subject-progress .sp-title { font-size:14px; font-weight:700; }
.subject-progress .sp-bar { height:7px; background:var(--bg); border-radius:4px; margin-top:5px; overflow:hidden; }
.subject-progress .sp-fill { height:100%; background:linear-gradient(90deg,#4263eb,#7048e8); border-radius:4px; }
.subject-progress .sp-count { font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap; }
.weak-item { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #f0f2f8; cursor:pointer; }
.weak-item:last-child { border-bottom:none; }
.wi-badge { background:var(--red-light); color:var(--red); font-weight:800; font-size:12.5px; padding:4px 10px; border-radius:8px; }
.wi-title { font-size:14px; font-weight:600; flex:1; }
.wi-subject { font-size:12px; color:var(--muted); }
.recent-item { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #f0f2f8; font-size:14px; }
.recent-item:last-child { border-bottom:none; }
.recent-score { font-weight:800; padding:3px 10px; border-radius:8px; font-size:12.5px; }
.recent-score.pass { background:var(--green-light); color:var(--green); }
.recent-score.fail { background:var(--red-light); color:var(--red); }
.subjects-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; }
.subject-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; cursor:pointer; border-left:5px solid var(--primary); transition:transform .15s; }
.subject-card:hover { transform:translateY(-3px); }
.subject-card .sc-icon { font-size:34px; margin-bottom:8px; }
.subject-card .sc-title { font-size:17px; font-weight:800; margin-bottom:4px; }
.subject-card .sc-meta { font-size:13px; color:var(--muted); }
.subject-card .sc-bar { height:6px; background:var(--bg); border-radius:3px; margin-top:12px; overflow:hidden; }
.subject-card .sc-fill { height:100%; border-radius:3px; background:var(--green); }
.breadcrumbs { font-size:13.5px; color:var(--muted); margin-bottom:14px; display:flex; gap:6px; flex-wrap:wrap; }
.section-block { margin-bottom:22px; }
.section-title { font-size:15px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:10px; }
.topic-item { background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:15px 17px; margin-bottom:10px; cursor:pointer; display:flex; align-items:center; gap:14px; transition:transform .12s; }
.topic-item:hover { transform:translateX(4px); }
.topic-status { width:42px; height:42px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:19px; background:var(--bg); }
.topic-status.read { background:var(--amber-light); }
.topic-status.passed { background:var(--green-light); }
.topic-info { flex:1; min-width:0; }
.topic-title { font-weight:700; font-size:15px; }
.topic-meta { font-size:12.5px; color:var(--muted); margin-top:2px; }
.badge { font-size:11.5px; font-weight:800; padding:4px 10px; border-radius:20px; white-space:nowrap; }
.badge.new { background:var(--bg); color:var(--muted); }
.badge.read { background:var(--amber-light); color:var(--amber); }
.badge.passed { background:var(--green-light); color:var(--green); }
.badge.grade { background:var(--primary-light); color:var(--primary); }
.theory-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px 24px; margin-bottom:16px; }
.theory-card h2 { font-size:21px; margin-bottom:16px; }
.theory-content { font-size:15.2px; }
.theory-content h3 { font-size:16.5px; margin:20px 0 8px; color:var(--primary-dark); }
.theory-content h3:first-child { margin-top:0; }
.theory-content p { margin-bottom:10px; }
.theory-content ul,.theory-content ol { margin:8px 0 12px 22px; }
.theory-content li { margin-bottom:5px; }
.theory-content b { color:var(--primary-dark); }
.theory-content pre { background:#2b2d42; color:#e8eaf2; padding:14px 16px; border-radius:12px; overflow-x:auto; font-size:13.5px; margin:10px 0; }
.theory-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
.theory-actions .btn { width:auto; flex:1; min-width:200px; }
.test-info { background:var(--primary-light); border-radius:12px; padding:12px 16px; font-size:13.5px; color:var(--primary-dark); margin-bottom:16px; display:flex; gap:10px; align-items:center; }
.test-header { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px; position:sticky; top:66px; z-index:40; }
.test-progress-bar { height:8px; background:var(--bg); border-radius:4px; overflow:hidden; margin-top:8px; }
.test-progress-fill { height:100%; background:linear-gradient(90deg,var(--primary),#7048e8); border-radius:4px; transition:width .25s; }
.test-progress-text { font-size:13px; color:var(--muted); font-weight:600; display:flex; justify-content:space-between; }
.retry-banner { background:var(--amber-light); border:1px solid #ffe066; color:#946200; border-radius:12px; padding:12px 16px; font-size:13.5px; margin-bottom:14px; }
.q-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:12px; }
.q-num { font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
.q-text { font-size:15.5px; font-weight:650; margin-bottom:14px; }
.q-hint { font-size:12px; color:var(--muted); margin-bottom:10px; }
.option { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1.8px solid #e4e8f2; border-radius:12px; margin-bottom:8px; cursor:pointer; font-size:14.5px; user-select:none; transition:border .12s,background .12s; }
.option:hover { border-color:#b9c4de; }
.option.selected { border-color:var(--primary); background:var(--primary-light); }
.option .opt-marker { width:24px; height:24px; border-radius:50%; border:2px solid #c5cde0; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:var(--muted); background:#fff; }
.option.selected .opt-marker { border-color:var(--primary); background:var(--primary); color:#fff; }
.option.multi .opt-marker { border-radius:7px; }
.submit-row { display:flex; gap:10px; margin-top:18px; }
.submit-row .btn { flex:1; }
.result-hero { text-align:center; padding:30px 20px; }
.result-ring { width:150px; height:150px; margin:0 auto 16px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:34px; font-weight:800; border:10px solid; }
.result-ring.pass { border-color:var(--green); color:var(--green); background:var(--green-light); }
.result-ring.fail { border-color:var(--red); color:var(--red); background:var(--red-light); }
.result-ring small { font-size:12.5px; font-weight:600; opacity:.75; }
.result-title { font-size:21px; font-weight:800; }
.result-sub { color:var(--muted); font-size:14px; margin-top:4px; max-width:460px; margin-left:auto; margin-right:auto; }
.result-actions { display:flex; gap:10px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
.result-actions .btn { width:auto; min-width:180px; }
.review-item { border-radius:14px; padding:16px 18px; margin-bottom:10px; background:var(--card); box-shadow:var(--shadow); border-left:5px solid; }
.review-item.ok { border-color:var(--green); }
.review-item.bad { border-color:var(--red); }
.review-q { font-weight:700; font-size:14.5px; margin-bottom:8px; }
.review-answers { font-size:13.5px; margin-bottom:6px; }
.review-answers .your { color:var(--red); font-weight:600; }
.review-answers .your.ok { color:var(--green); }
.review-answers .correct { color:var(--green); font-weight:700; }
.review-exp { font-size:13px; color:var(--muted); background:var(--bg); border-radius:10px; padding:10px 12px; margin-top:8px; }
.review-exp b { color:var(--text); }
.empty { text-align:center; color:var(--muted); padding:40px 20px; font-size:14.5px; }
.error-msg { background:var(--red-light); color:var(--red); padding:10px 14px; border-radius:10px; font-size:13.5px; margin-bottom:14px; }
.crumb-link { color:var(--primary); font-weight:600; cursor:pointer; }
[data-go],[data-action] { cursor:pointer; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1a2233; color:#fff; padding:12px 22px; border-radius:12px; font-size:14px; z-index:100; box-shadow:0 8px 30px rgba(0,0,0,.3); }
@media (max-width:600px) {
  .container { padding:14px 12px 50px; }
  .header { padding:12px 14px; }
  .nav-btn span.label { display:none; }
  .theory-card { padding:20px 16px; }
  .result-actions .btn { width:100%; }
}
</style>
</head>

<div id="app"></div>
<script>window.BILIM_DATA = [{"title":"Математика","icon":"📐","color":"#4f7cff","order":1,"sections":[{"title":"Алгебра","order":1,"topics":[{"title":"Дроби и проценты","grade_min":5,"grade_max":6,"order":1,"theory":"<h3>Обыкновенные дроби<\/h3><p>Дробь <b>a/b<\/b> — это запись числа, где <b>a<\/b> (числитель) показывает, сколько частей взято, а <b>b<\/b> (знаменатель) — на сколько равных частей разделено целое. Дроби бывают <b>правильные<\/b> (числитель меньше знаменателя, например 3/7) и <b>неправильные<\/b> (числитель не меньше знаменателя, например 9/4). Неправильную дробь можно записать как смешанное число: 9/4 = 2¼.<\/p><h3>Основное свойство дроби<\/h3><p>Если числитель и знаменатель умножить (или разделить) на одно и то же ненулевое число, значение дроби не изменится: a/b = (a·c)/(b·c). На этом свойстве основаны <b>сокращение дробей<\/b> (6/8 = 3/4) и <b>приведение к общему знаменателю<\/b>.<\/p><h3>Действия с дробями<\/h3><ul><li><b>Сложение/вычитание с одинаковыми знаменателями:<\/b> a/c ± b/c = (a ± b)/c.<\/li><li><b>С разными знаменателями:<\/b> сначала приводим к общему знаменателю (обычно НОК знаменателей), затем складываем числители.<\/li><li><b>Умножение:<\/b> (a/b)·(c/d) = (a·c)/(b·d). Перед умножением удобно сокращать.<\/li><li><b>Деление:<\/b> (a/b) : (c/d) = (a/b)·(d/c) — умножаем на перевёрнутую дробь.<\/li><\/ul><h3>Десятичные дроби<\/h3><p>0,75 = 75/100 = ¾. При сложении/вычитании десятичных дробей записываем «запятая под запятой». При умножении считаем суммарное число знаков после запятой у множителей и столько же отсчитываем в произведении.<\/p><h3>Проценты<\/h3><p><b>1 процент (1%)<\/b> — одна сотая часть числа: 1% = 1/100 = 0,01.<\/p><ul><li>Найти <b>p% от числа A<\/b>: A · p / 100. Пример: 20% от 150 = 150·20/100 = 30.<\/li><li>Найти число по его процентам: если p% числа равны B, то число = B · 100 / p.<\/li><li>Найти, сколько процентов составляет B от A: (B/A) · 100%.<\/li><\/ul><p>Типовые задачи: скидки (цена уменьшилась на 15% → новая цена = 0,85 от старой), проценты по вкладу, концентрация растворов.<\/p>","questions":[{"type":"single","text":"Чему равна сумма 1/4 + 3/8?","options":["4/12","5/8","4/8","4/32"],"correct":1,"difficulty":1,"explanation":"Общий знаменатель 8: 1/4 = 2/8, значит 2/8 + 3/8 = 5/8."},{"type":"single","text":"Сократите дробь 24/36.","options":["2/3","3/4","4/6","12/18"],"correct":0,"difficulty":1,"explanation":"НОД(24; 36) = 12. Делим числитель и знаменатель на 12: 24/36 = 2/3."},{"type":"single","text":"Вычислите: 3/5 · 10/9.","options":["30/45","2/3","1/3","5/9"],"correct":1,"difficulty":1,"explanation":"3/5 · 10/9 = 30/45 = 2/3 (после сокращения на 15). Можно сократить сразу: 3 с 9 и 10 с 5 → 2/3."},{"type":"single","text":"Вычислите: 7/8 : 7/4.","options":["49/32","1/2","2","7/32"],"correct":1,"difficulty":2,"explanation":"Деление заменяем умножением на перевёрнутую дробь: 7/8 · 4/7 = 28/56 = 1/2."},{"type":"single","text":"Найдите 15% от числа 240.","options":["24","36","15","48"],"correct":1,"difficulty":1,"explanation":"240 · 15/100 = 240 · 0,15 = 36."},{"type":"single","text":"Товар стоил 2000 тенге, цену снизили на 10%. Какова новая цена?","options":["1900 тг","1800 тг","1000 тг","2100 тг"],"correct":1,"difficulty":1,"explanation":"Скидка: 2000 · 0,1 = 200 тг. Новая цена: 2000 − 200 = 1800 тг (или сразу 2000 · 0,9)."},{"type":"single","text":"25% числа равны 60. Найдите это число.","options":["15","120","240","85"],"correct":2,"difficulty":2,"explanation":"Число = 60 · 100 / 25 = 240."},{"type":"truefalse","text":"Верно ли, что 0,25 = 1/4?","options":["Верно","Неверно"],"correct":0,"difficulty":1,"explanation":"1/4 = 1 : 4 = 0,25 — верно."},{"type":"single","text":"Какое число является результатом 2,5 · 0,4?","options":["1","10","0,1","1,5"],"correct":0,"difficulty":1,"explanation":"25 · 4 = 100; суммарно два знака после запятой → 1,00 = 1."},{"type":"single","text":"В классе 30 учеников, 60% из них девочки. Сколько мальчиков в классе?","options":["18","12","15","6"],"correct":1,"difficulty":2,"explanation":"Девочек: 30 · 0,6 = 18. Мальчиков: 30 − 18 = 12 (или 40% от 30 = 12)."}]},{"title":"Линейные уравнения и неравенства","grade_min":7,"grade_max":8,"order":2,"theory":"<h3>Линейное уравнение<\/h3><p><b>Линейное уравнение с одной переменной<\/b> имеет вид <b>ax + b = 0<\/b>, где a и b — числа, x — неизвестное.<\/p><ul><li>Если a ≠ 0: единственный корень x = −b/a.<\/li><li>Если a = 0 и b = 0: корней бесконечно много (любое x).<\/li><li>Если a = 0 и b ≠ 0: корней нет.<\/li><\/ul><h3>Правила решения<\/h3><ol><li>Раскрыть скобки (используя распределительное свойство).<\/li><li>Перенести слагаемые с переменной в левую часть, числа — в правую, <b>меняя знак<\/b> переносимого слагаемого.<\/li><li>Привести подобные слагаемые.<\/li><li>Разделить обе части на коэффициент при x.<\/li><\/ol><p>Пример: 3(x − 2) = x + 4 → 3x − 6 = x + 4 → 2x = 10 → x = 5.<\/p><h3>Проверка корня<\/h3><p>Подставь найденное значение в исходное уравнение: обе части должны совпасть.<\/p><h3>Линейные неравенства<\/h3><p>Неравенства решаются так же, как уравнения, но с <b>главным правилом<\/b>: при умножении или делении обеих частей на <b>отрицательное<\/b> число знак неравенства меняется на противоположный.<\/p><p>Пример: −2x &gt; 6 → x &lt; −3. Ответ записывают в виде промежутка: x ∈ (−∞; −3).<\/p><h3>Числовые промежутки<\/h3><ul><li>(a; b) — открытый промежуток, a &lt; x &lt; b;<\/li><li>[a; b] — отрезок, a ≤ x ≤ b;<\/li><li>[a; b) — полуинтервал: a входит, b — нет.<\/li><\/ul><p>При решении систем неравенств ответ — <b>пересечение<\/b> решений; при совокупности — объединение.<\/p>","questions":[{"type":"single","text":"Решите уравнение: 2x + 6 = 0.","options":["x = 3","x = −3","x = 6","x = −6"],"correct":1,"difficulty":1,"explanation":"2x = −6 → x = −3."},{"type":"single","text":"Решите уравнение: 5x − 3 = 2x + 9.","options":["x = 4","x = 2","x = 6","x = −4"],"correct":0,"difficulty":1,"explanation":"5x − 2x = 9 + 3 → 3x = 12 → x = 4."},{"type":"single","text":"Решите уравнение: 3(x − 2) = x + 4.","options":["x = 5","x = 1","x = 10","x = −5"],"correct":0,"difficulty":2,"explanation":"3x − 6 = x + 4 → 2x = 10 → x = 5."},{"type":"single","text":"Сколько корней у уравнения 0·x = 5?","options":["Один","Два","Корней нет","Бесконечно много"],"correct":2,"difficulty":1,"explanation":"При a = 0 и b ≠ 0 уравнение ax + b = 0 корней не имеет: 0 не может равняться 5."},{"type":"single","text":"Решите неравенство: 4x − 8 > 0.","options":["x > 2","x < 2","x > −2","x < −2"],"correct":0,"difficulty":1,"explanation":"4x > 8 → x > 2 (делим на положительное 4, знак сохраняется)."},{"type":"single","text":"Решите неравенство: −3x ≤ 12.","options":["x ≤ −4","x ≥ −4","x ≤ 4","x ≥ 4"],"correct":1,"difficulty":2,"explanation":"Делим на −3 и меняем знак: x ≥ −4."},{"type":"single","text":"Какой промежуток является решением неравенства x > −1?","options":["(−∞; −1)","[−1; +∞)","(−1; +∞)","(−∞; −1]"],"correct":2,"difficulty":2,"explanation":"Строгое неравенство x > −1 — открытый промежуток (−1; +∞); точка −1 не включается."},{"type":"single","text":"Решите уравнение: (x + 1)/2 = 3.","options":["x = 5","x = 6","x = 2","x = 7"],"correct":0,"difficulty":2,"explanation":"x + 1 = 6 → x = 5."},{"type":"single","text":"При каком значении a уравнение ax = 0 имеет бесконечно много корней?","options":["a = 1","a = 0","a = −1","при любом a"],"correct":1,"difficulty":2,"explanation":"При a = 0 получаем 0·x = 0 — верное равенство при любом x, то есть бесконечно много корней."},{"type":"single","text":"Решите систему: x > 2 и x < 5.","options":["(2; 5)","(−∞; 2)","(5; +∞)","решений нет"],"correct":0,"difficulty":2,"explanation":"Система — пересечение решений: 2 < x < 5, то есть промежуток (2; 5)."}]},{"title":"Степень с целым показателем","grade_min":7,"grade_max":8,"order":3,"theory":"<h3>Что такое степень<\/h3><p><b>aⁿ<\/b> — произведение n множителей, каждый из которых равен a: aⁿ = a·a·…·a (n раз). Число a — <b>основание<\/b>, n — <b>показатель<\/b> степени.<\/p><h3>Свойства степеней<\/h3><ul><li>aⁿ · aᵐ = aⁿ⁺ᵐ (при умножении степеней с одинаковым основанием показатели складываются);<\/li><li>aⁿ : aᵐ = aⁿ⁻ᵐ (при делении — вычитаются), a ≠ 0;<\/li><li>(aⁿ)ᵐ = aⁿ·ᵐ (степень степени — показатели перемножаются);<\/li><li>(a·b)ⁿ = aⁿ·bⁿ;<\/li><li>(a/b)ⁿ = aⁿ/bⁿ.<\/li><\/ul><h3>Особые случаи<\/h3><ul><li>a¹ = a;<\/li><li>a⁰ = 1 при a ≠ 0 (нулевая степень);<\/li><li>1ⁿ = 1, 0ⁿ = 0 при n &gt; 0;<\/li><li>a⁻ⁿ = 1/aⁿ — степень с отрицательным показателем.<\/li><\/ul><p>Примеры: 2³ · 2⁴ = 2⁷ = 128; (3²)³ = 3⁶ = 729; 5⁻² = 1/25 = 0,04; (−2)³ = −8, но (−2)² = 4 — <b>знак зависит от чётности показателя<\/b>: при чётном n степень отрицательного числа положительна.<\/p><h3>Стандартный вид числа<\/h3><p>Любое число можно записать как a·10ⁿ, где 1 ≤ |a| &lt; 10. Например, 3500 = 3,5·10³; 0,0072 = 7,2·10⁻³. Такая запись удобна в физике и астрономии.<\/p><h3>Одночлены<\/h3><p>Одночлен — произведение чисел, переменных и их степеней: 5x²y. Стандартный вид: числовой коэффициент (перед буквами) и каждая переменная в одной степени. При умножении одночленов коэффициенты перемножаются, а степени одинаковых переменных складываются.<\/p>","questions":[{"type":"single","text":"Вычислите: 2⁵.","options":["10","25","32","64"],"correct":2,"difficulty":1,"explanation":"2⁵ = 2·2·2·2·2 = 32."},{"type":"single","text":"Упростите: a⁴ · a⁶.","options":["a¹⁰","a²⁴","a²","2a¹⁰"],"correct":0,"difficulty":1,"explanation":"При умножении степеней с одинаковым основанием показатели складываются: a⁴⁺⁶ = a¹⁰."},{"type":"single","text":"Упростите: x⁹ : x³.","options":["x³","x⁶","x¹²","x²⁷"],"correct":1,"difficulty":1,"explanation":"При делении показатели вычитаются: x⁹⁻³ = x⁶."},{"type":"single","text":"Чему равно (3²)³?","options":["3⁵","3⁶","3⁸","9⁶"],"correct":1,"difficulty":2,"explanation":"Степень степени: показатели перемножаются — 3²·³ = 3⁶ = 729."},{"type":"single","text":"Чему равно 5⁰?","options":["0","5","1","не определено"],"correct":2,"difficulty":1,"explanation":"Любое ненулевое число в нулевой степени равно 1."},{"type":"single","text":"Чему равно 2⁻³?","options":["−8","−6","1/8","8"],"correct":2,"difficulty":2,"explanation":"2⁻³ = 1/2³ = 1/8. Отрицательный показатель — это не отрицательное число!"},{"type":"single","text":"Чему равно (−2)⁴?","options":["−16","16","−8","8"],"correct":1,"difficulty":2,"explanation":"Чётная степень отрицательного числа положительна: (−2)⁴ = 16."},{"type":"single","text":"Упростите: (2ab²)³.","options":["6a³b⁶","8a³b⁶","8ab⁶","2a³b⁵"],"correct":1,"difficulty":2,"explanation":"(2ab²)³ = 2³·a³·(b²)³ = 8a³b⁶."},{"type":"single","text":"Представьте 0,0045 в стандартном виде.","options":["4,5·10³","4,5·10⁻³","45·10⁻⁴","4,5·10⁻²"],"correct":1,"difficulty":2,"explanation":"0,0045 = 4,5·10⁻³: запятая сдвинута на 3 знака вправо, поэтому степень −3."},{"type":"single","text":"Вычислите: 10³ · 10⁻⁵.","options":["10⁻²","10⁸","10²","10⁻⁸"],"correct":0,"difficulty":2,"explanation":"Показатели складываются: 10³⁺⁽⁻⁵⁾ = 10⁻² = 0,01."}]},{"title":"Квадратные уравнения","grade_min":8,"grade_max":9,"order":4,"theory":"<h3>Определение<\/h3><p><b>Квадратное уравнение<\/b> — уравнение вида <b>ax² + bx + c = 0<\/b>, где a ≠ 0. Коэффициенты: a — старший, b — второй, c — свободный член.<\/p><h3>Дискриминант<\/h3><p><b>D = b² − 4ac<\/b> определяет число корней:<\/p><ul><li>D &gt; 0 — два различных корня;<\/li><li>D = 0 — один корень (два совпадающих);<\/li><li>D &lt; 0 — действительных корней нет.<\/li><\/ul><h3>Формула корней<\/h3><p>x = (−b ± √D) / (2a)<\/p><p>Для <b>приведённого<\/b> уравнения x² + px + q = 0 действует <b>теорема Виета<\/b>: x₁ + x₂ = −p, x₁ · x₂ = q. Для общего вида: x₁ + x₂ = −b/a, x₁ · x₂ = c/a.<\/p><h3>Неполные квадратные уравнения<\/h3><ul><li>ax² + c = 0 → x² = −c/a (если −c/a ≥ 0, два корня x = ±√(−c/a));<\/li><li>ax² + bx = 0 → x(ax + b) = 0 → x = 0 или x = −b/a;<\/li><li>ax² = 0 → x = 0.<\/li><\/ul><h3>Разложение на множители<\/h3><p>Если x₁ и x₂ — корни, то ax² + bx + c = a(x − x₁)(x − x₂). Это используется для решения неравенств методом интервалов и сокращения дробей.<\/p><p><b>Пример:<\/b> x² − 5x + 6 = 0. D = 25 − 24 = 1, x = (5 ± 1)/2 → x₁ = 3, x₂ = 2. Проверка по Виету: 3 + 2 = 5 ✓, 3 · 2 = 6 ✓.<\/p>","questions":[{"type":"single","text":"Найдите дискриминант уравнения x² − 5x + 6 = 0.","options":["1","−1","49","24"],"correct":0,"difficulty":1,"explanation":"D = b² − 4ac = (−5)² − 4·1·6 = 25 − 24 = 1."},{"type":"single","text":"Решите уравнение x² − 9 = 0.","options":["x = 3","x = ±3","x = 9","корней нет"],"correct":1,"difficulty":1,"explanation":"x² = 9 → x = ±3."},{"type":"single","text":"Сколько корней у уравнения x² + 4x + 5 = 0?","options":["Два","Один","Ни одного","Бесконечно много"],"correct":2,"difficulty":2,"explanation":"D = 16 − 20 = −4 < 0 — действительных корней нет."},{"type":"single","text":"Решите уравнение x² − 7x + 12 = 0.","options":["x = 3; x = 4","x = −3; x = −4","x = 2; x = 6","x = 1; x = 12"],"correct":0,"difficulty":2,"explanation":"По Виету: сумма корней 7, произведение 12 → корни 3 и 4."},{"type":"single","text":"Чему равна сумма корней уравнения x² + 6x − 7 = 0?","options":["6","−6","7","−7"],"correct":1,"difficulty":2,"explanation":"По теореме Виета x₁ + x₂ = −b/a = −6. (Сами корни: 1 и −7.)"},{"type":"single","text":"Решите уравнение x² + 5x = 0.","options":["x = 0; x = 5","x = 0; x = −5","x = −5","x = 5"],"correct":1,"difficulty":1,"explanation":"x(x + 5) = 0 → x = 0 или x = −5."},{"type":"single","text":"При каком значении b уравнение x² + bx + 9 = 0 имеет один корень (b > 0)?","options":["3","6","9","18"],"correct":1,"difficulty":3,"explanation":"Один корень при D = 0: b² − 36 = 0 → b = ±6; при b > 0 → b = 6."},{"type":"single","text":"Разложите на множители: x² − 5x + 6.","options":["(x − 2)(x − 3)","(x + 2)(x + 3)","(x − 1)(x − 6)","(x − 6)(x + 1)"],"correct":0,"difficulty":2,"explanation":"Корни 2 и 3, значит x² − 5x + 6 = (x − 2)(x − 3)."},{"type":"single","text":"Решите уравнение 2x² − 8 = 0.","options":["x = ±2","x = ±4","x = 2","x = ±√8"],"correct":0,"difficulty":2,"explanation":"2x² = 8 → x² = 4 → x = ±2."},{"type":"single","text":"Чему равно произведение корней уравнения 2x² − 3x − 5 = 0?","options":["−5/2","5/2","−3/2","3/2"],"correct":0,"difficulty":3,"explanation":"По Виету x₁·x₂ = c/a = −5/2."}]},{"title":"Арифметическая и геометрическая прогрессии","grade_min":9,"grade_max":10,"order":5,"theory":"<h3>Арифметическая прогрессия<\/h3><p><b>(aₙ)<\/b> — последовательность, в которой каждый следующий член больше предыдущего на одно и то же число <b>d<\/b> (разность прогрессии): aₙ₊₁ = aₙ + d.<\/p><ul><li>Формула n-го члена: <b>aₙ = a₁ + d(n − 1)<\/b>.<\/li><li>Сумма первых n членов: <b>Sₙ = (a₁ + aₙ)·n/2 = (2a₁ + d(n−1))·n/2<\/b>.<\/li><li>Характеристическое свойство: aₙ = (aₙ₋₁ + aₙ₊₁)/2.<\/li><\/ul><p>Пример: 2, 5, 8, 11, … — d = 3; a₁₀ = 2 + 3·9 = 29.<\/p><h3>Геометрическая прогрессия<\/h3><p><b>(bₙ)<\/b> — последовательность, в которой каждый следующий член получается умножением предыдущего на постоянное число <b>q ≠ 0<\/b> (знаменатель): bₙ₊₁ = bₙ · q.<\/p><ul><li>Формула n-го члена: <b>bₙ = b₁ · qⁿ⁻¹<\/b>.<\/li><li>Сумма первых n членов: <b>Sₙ = b₁(qⁿ − 1)/(q − 1)<\/b> при q ≠ 1.<\/li><li>Характеристическое свойство: bₙ² = bₙ₋₁ · bₙ₊₁.<\/li><\/ul><p>Пример: 3, 6, 12, 24, … — q = 2; b₅ = 3·2⁴ = 48.<\/p><h3>Бесконечно убывающая геометрическая прогрессия<\/h3><p>Если |q| &lt; 1, сумма всех членов конечна: <b>S = b₁/(1 − q)<\/b>. Пример: 1 + 1/2 + 1/4 + … = 1/(1 − 1/2) = 2.<\/p><h3>Где применяются<\/h3><p>Арифметическая — равномерный рост (тарифы, stacking); геометрическая — проценты по вкладу (сложный процент), рост бактерий, распад вещества.<\/p>","questions":[{"type":"single","text":"В арифметической прогрессии a₁ = 3, d = 4. Найдите a₅.","options":["19","23","15","20"],"correct":0,"difficulty":1,"explanation":"a₅ = a₁ + 4d = 3 + 16 = 19."},{"type":"single","text":"Дана прогрессия 5, 9, 13, 17, … Чему равна разность d?","options":["5","4","9","−4"],"correct":1,"difficulty":1,"explanation":"d = 9 − 5 = 4."},{"type":"single","text":"Найдите сумму первых 10 членов арифметической прогрессии, если a₁ = 1, d = 2.","options":["100","90","110","55"],"correct":0,"difficulty":2,"explanation":"S₁₀ = (2·1 + 2·9)·10/2 = 20·10/2 = 100. (Это 1+3+5+…+19 — сумма первых 10 нечётных = 100.)"},{"type":"single","text":"Какая последовательность является геометрической прогрессией?","options":["2, 4, 6, 8","2, 4, 8, 16","1, 3, 5, 7","10, 8, 6, 4"],"correct":1,"difficulty":1,"explanation":"2, 4, 8, 16 — каждый следующий член в 2 раза больше предыдущего (q = 2). Остальные — арифметические."},{"type":"single","text":"В геометрической прогрессии b₁ = 2, q = 3. Найдите b₄.","options":["18","54","162","24"],"correct":1,"difficulty":2,"explanation":"b₄ = b₁·q³ = 2·27 = 54."},{"type":"single","text":"Найдите сумму первых 5 членов геометрической прогрессии: b₁ = 1, q = 2.","options":["16","31","32","15"],"correct":1,"difficulty":2,"explanation":"S₅ = 1·(2⁵ − 1)/(2 − 1) = 31. (1+2+4+8+16 = 31.)"},{"type":"single","text":"Найдите сумму бесконечно убывающей прогрессии 1 + 1/3 + 1/9 + …","options":["3/2","4/3","3","2"],"correct":0,"difficulty":3,"explanation":"S = b₁/(1 − q) = 1/(1 − 1/3) = 1/(2/3) = 3/2."},{"type":"single","text":"В арифметической прогрессии a₃ = 7, a₅ = 13. Найдите d.","options":["2","3","6","4"],"correct":1,"difficulty":3,"explanation":"a₅ − a₃ = 2d → d = (13 − 7)/2 = 3."},{"type":"single","text":"Является ли число 30 членом прогрессии 2, 5, 8, 11, …?","options":["Да, это a₁₀","Да, это a₉","Нет","Да, это a₁₁"],"correct":2,"difficulty":3,"explanation":"aₙ = 2 + 3(n−1) = 30 → 3(n−1) = 28. Целого решения нет (28 не делится на 3), значит 30 не является членом этой прогрессии. a₁₀ = 29, a₁₁ = 32."},{"type":"single","text":"Вклад 100 000 тг растёт на 10% в год (сложный процент). Какая сумма будет через 2 года?","options":["120 000 тг","121 000 тг","110 000 тг","122 000 тг"],"correct":1,"difficulty":2,"explanation":"Геометрическая прогрессия: 100 000·1,1² = 100 000·1,21 = 121 000 тг."}]},{"title":"Производная и её применение","grade_min":10,"grade_max":11,"order":6,"theory":"<h3>Понятие производной<\/h3><p><b>Производная функции f(x)<\/b> — предел отношения приращения функции к приращению аргумента при стремлении последнего к нулю: f′(x) = lim (Δf/Δx). Геометрически <b>f′(x₀) = k<\/b> — угловой коэффициент касательной к графику в точке x₀.<\/p><h3>Уравнение касательной<\/h3><p>y = f(x₀) + f′(x₀)·(x − x₀)<\/p><h3>Таблица производных (основное)<\/h3><ul><li>(C)′ = 0;<\/li><li>(x)′ = 1;<\/li><li>(xⁿ)′ = n·xⁿ⁻¹;<\/li><li>(√x)′ = 1/(2√x);<\/li><li>(1/x)′ = −1/x²;<\/li><li>(sin x)′ = cos x;<\/li><li>(cos x)′ = −sin x;<\/li><li>(eˣ)′ = eˣ; (aˣ)′ = aˣ·ln a;<\/li><li>(ln x)′ = 1/x.<\/li><\/ul><h3>Правила дифференцирования<\/h3><ul><li>(u ± v)′ = u′ ± v′;<\/li><li>(C·u)′ = C·u′;<\/li><li>(u·v)′ = u′v + uv′;<\/li><li>(u/v)′ = (u′v − uv′)/v².<\/li><\/ul><h3>Применение к исследованию функций<\/h3><ul><li>f′(x) &gt; 0 на промежутке → функция <b>возрастает<\/b>; f′(x) &lt; 0 → <b>убывает<\/b>.<\/li><li>Точки, где f′(x) = 0 или не существует, — <b>критические<\/b>. При смене знака f′ с «+» на «−» — точка <b>максимума<\/b>, с «−» на «+» — точка <b>минимума<\/b>.<\/li><li>Наибольшее/наименьшее значение на отрезке: сравниваем значения в критических точках внутри отрезка и на концах.<\/li><\/ul><p>Пример: f(x) = x³ − 3x. f′(x) = 3x² − 3 = 3(x−1)(x+1). Критические точки x = ±1. При x = −1 — максимум (f = 2), при x = 1 — минимум (f = −2).<\/p>","questions":[{"type":"single","text":"Найдите производную функции f(x) = x⁵.","options":["5x⁴","x⁴","5x⁶","4x⁵"],"correct":0,"difficulty":1,"explanation":"(xⁿ)′ = n·xⁿ⁻¹ → (x⁵)′ = 5x⁴."},{"type":"single","text":"Чему равна производная постоянной функции f(x) = 7?","options":["7","1","0","x"],"correct":2,"difficulty":1,"explanation":"Производная константы равна 0."},{"type":"single","text":"Найдите f′(x), если f(x) = 3x² − 5x + 2.","options":["6x − 5","3x − 5","6x + 5","6x²− 5"],"correct":0,"difficulty":1,"explanation":"Производная суммы — сумма производных: (3x²)′ = 6x, (−5x)′ = −5, (2)′ = 0."},{"type":"single","text":"Чему равна производная функции f(x) = sin x?","options":["−cos x","cos x","−sin x","tg x"],"correct":1,"difficulty":1,"explanation":"(sin x)′ = cos x — табличная производная."},{"type":"single","text":"Найдите производную f(x) = 1/x.","options":["ln x","−1/x²","1/x²","−1/x"],"correct":1,"difficulty":2,"explanation":"(1/x)′ = (x⁻¹)′ = −1·x⁻² = −1/x²."},{"type":"single","text":"f(x) = x². Чему равен угловой коэффициент касательной в точке x₀ = 3?","options":["9","6","3","12"],"correct":1,"difficulty":2,"explanation":"f′(x) = 2x → f′(3) = 6."},{"type":"single","text":"Найдите критические точки функции f(x) = x³ − 12x.","options":["x = ±2","x = ±4","x = 0","x = 2"],"correct":0,"difficulty":2,"explanation":"f′(x) = 3x² − 12 = 0 → x² = 4 → x = ±2."},{"type":"single","text":"На каком промежутке функция f(x) = x² − 4x убывает?","options":["(2; +∞)","(−∞; 2)","(0; 4)","(−∞; 0)"],"correct":1,"difficulty":3,"explanation":"f′(x) = 2x − 4 < 0 при x < 2 → функция убывает на (−∞; 2)."},{"type":"single","text":"Найдите производную произведения f(x) = x²·sin x.","options":["2x·cos x","2x·sin x + x²·cos x","x²·cos x","2x·sin x − x²·cos x"],"correct":1,"difficulty":3,"explanation":"(uv)′ = u′v + uv′ → 2x·sin x + x²·cos x."},{"type":"single","text":"Точка x = 2 — точка максимума функции f(x), если производная меняет знак:","options":["с «+» на «−»","с «−» на «+»","не меняет знак","с «0» на «+»"],"correct":0,"difficulty":2,"explanation":"Максимум: слева f′ > 0 (функция растёт), справа f′ < 0 (убывает) — смена «+» на «−»."}]}]},{"title":"Геометрия","order":2,"topics":[{"title":"Треугольники и признаки равенства","grade_min":7,"grade_max":7,"order":1,"theory":"<h3>Основные понятия<\/h3><p><b>Треугольник<\/b> — фигура из трёх точек, не лежащих на одной прямой, и трёх отрезков, их соединяющих. Сумма углов треугольника равна <b>180°<\/b>. Внешний угол равен сумме двух внутренних углов, не смежных с ним.<\/p><h3>Виды треугольников<\/h3><ul><li><b>Остроугольный<\/b> — все углы острые (&lt; 90°);<\/li><li><b>Прямоугольный<\/b> — один угол 90° (стороны: катеты и гипотенуза);<\/li><li><b>Тупоугольный<\/b> — один угол больше 90°;<\/li><li><b>Равнобедренный<\/b> — две стороны равны; углы при основании равны;<\/li><li><b>Равносторонний<\/b> — все стороны равны, все углы по 60°.<\/li><\/ul><h3>Признаки равенства треугольников<\/h3><ol><li><b>По двум сторонам и углу между ними:<\/b> если две стороны и угол между ними одного треугольника соответственно равны двум сторонам и углу между ними другого, то треугольники равны.<\/li><li><b>По стороне и двум прилежащим углам:<\/b> если сторона и два прилежащих к ней угла одного треугольника равны стороне и двум прилежащим углам другого.<\/li><li><b>По трём сторонам:<\/b> если три стороны одного треугольника равны трём сторонам другого.<\/li><\/ol><h3>Важные линии треугольника<\/h3><ul><li><b>Медиана<\/b> — отрезок от вершины до середины противоположной стороны. Три медианы пересекаются в одной точке (центроиде), которая делит каждую медиану в отношении 2:1 от вершины.<\/li><li><b>Биссектриса<\/b> — отрезок, делящий угол пополам. Три биссектрисы пересекаются в центре вписанной окружности.<\/li><li><b>Высота<\/b> — перпендикуляр из вершины к противоположной стороне. Три высоты пересекаются в ортоцентре.<\/li><li><b>Срединный перпендикуляр<\/b> к стороне — точки, равноудалённые от концов стороны; пересечение трёх — центр описанной окружности.<\/li><\/ul><h3>Неравенство треугольника<\/h3><p>Каждая сторона треугольника меньше суммы двух других: a &lt; b + c. Иначе треугольник не существует.<\/p>","questions":[{"type":"single","text":"Чему равна сумма углов треугольника?","options":["90°","180°","270°","360°"],"correct":1,"difficulty":1,"explanation":"Сумма внутренних углов любого треугольника — 180°."},{"type":"single","text":"Два угла треугольника равны 40° и 70°. Найдите третий угол.","options":["60°","70°","80°","90°"],"correct":1,"difficulty":1,"explanation":"180° − 40° − 70° = 70°."},{"type":"single","text":"В равнобедренном треугольнике угол при основании равен 50°. Чему равен угол при вершине?","options":["50°","80°","100°","130°"],"correct":1,"difficulty":2,"explanation":"Оба угла при основании по 50°: 180 − 50 − 50 = 80°."},{"type":"single","text":"Какой признак равенства треугольников: «две стороны и угол МЕЖДУ ними»?","options":["Первый","Второй","Третий","Это не признак"],"correct":0,"difficulty":1,"explanation":"Первый признак — по двум сторонам и углу между ними."},{"type":"single","text":"Третий признак равенства треугольников — это равенство:","options":["двух сторон","трёх углов","трёх сторон","стороны и угла"],"correct":2,"difficulty":1,"explanation":"Третий признак — по трём сторонам."},{"type":"single","text":"Медиана треугольника — это отрезок, соединяющий вершину с…","options":["серединой противоположной стороны","основанием высоты","точкой на биссектрисе","любой точкой стороны"],"correct":0,"difficulty":1,"explanation":"Медиана проводится из вершины в середину противоположной стороны."},{"type":"single","text":"В каком отношении точка пересечения медиан делит каждую медиану (от вершины)?","options":["1:1","2:1","3:1","1:2"],"correct":1,"difficulty":3,"explanation":"Центроид делит медиану в отношении 2:1, считая от вершины."},{"type":"single","text":"Существует ли треугольник со сторонами 3, 4 и 8?","options":["Да","Нет","Только прямоугольный","Только тупоугольный"],"correct":1,"difficulty":2,"explanation":"Неравенство треугольника нарушено: 8 ≥ 3 + 4 = 7. Такой треугольник не существует."},{"type":"single","text":"Внешний угол треугольника равен 110°. Один из несмежных внутренних углов — 45°. Найдите второй.","options":["65°","70°","55°","75°"],"correct":0,"difficulty":2,"explanation":"Внешний угол = сумма двух несмежных внутренних: 110 − 45 = 65°."},{"type":"single","text":"Все углы равностороннего треугольника равны:","options":["45°","60°","90°","30°"],"correct":1,"difficulty":1,"explanation":"180° / 3 = 60°."}]},{"title":"Теорема Пифагора","grade_min":8,"grade_max":8,"order":2,"theory":"<h3>Формулировка<\/h3><p>В <b>прямоугольном треугольнике<\/b> квадрат гипотенузы равен сумме квадратов катетов:<\/p><p><b>c² = a² + b²<\/b><\/p><p>где c — гипотенуза (сторона напротив прямого угла, самая длинная), a и b — катеты.<\/p><h3>Следствия<\/h3><ul><li>Найти гипотенузу: c = √(a² + b²).<\/li><li>Найти катет: a = √(c² − b²).<\/li><\/ul><h3>Обратная теорема<\/h3><p>Если квадрат большей стороны треугольника равен сумме квадратов двух других сторон, то треугольник <b>прямоугольный<\/b>. Если больше — тупоугольный, если меньше — остроугольный.<\/p><h3>Пифагоровы тройки<\/h3><p>Наборы целых чисел, которые полезно помнить: <b>(3, 4, 5)<\/b>, (5, 12, 13), (8, 15, 17), (7, 24, 25) и кратные (6, 8, 10).<\/p><h3>Применение<\/h3><ul><li>Диагональ прямоугольника: d = √(a² + b²).<\/li><li>Расстояние между точками на координатной плоскости: d = √((x₂−x₁)² + (y₂−y₁)²).<\/li><li>Высота равностороннего треугольника со стороной a: h = a√3/2.<\/li><li>Задачи на лестницу у стены, телевизор по диагонали и т.д.<\/li><\/ul><p><b>Пример:<\/b> катеты 6 и 8 → гипотенуза √(36+64) = √100 = 10 (тройка 3-4-5, умноженная на 2).<\/p>","questions":[{"type":"single","text":"Катеты прямоугольного треугольника равны 3 и 4. Найдите гипотенузу.","options":["5","7","25","6"],"correct":0,"difficulty":1,"explanation":"c = √(9 + 16) = √25 = 5."},{"type":"single","text":"Гипотенуза равна 13, один катет 5. Найдите второй катет.","options":["8","12","9","10"],"correct":1,"difficulty":2,"explanation":"a = √(169 − 25) = √144 = 12."},{"type":"single","text":"Чему равна диагональ прямоугольника со сторонами 6 и 8?","options":["14","10","12","√14"],"correct":1,"difficulty":2,"explanation":"Диагональ — гипотенуза треугольника из сторон: √(36 + 64) = 10."},{"type":"single","text":"Треугольник со сторонами 5, 7, 9 является:","options":["прямоугольным","остроугольным","тупоугольным","равнобедренным"],"correct":2,"difficulty":3,"explanation":"9² = 81 > 5² + 7² = 25 + 49 = 74 → угол против большей стороны тупой (обратная теорема)."},{"type":"single","text":"Какая тройка чисел является пифагоровой?","options":["(2, 3, 4)","(5, 12, 13)","(4, 5, 6)","(6, 7, 8)"],"correct":1,"difficulty":2,"explanation":"5² + 12² = 25 + 144 = 169 = 13² ✓."},{"type":"single","text":"Найдите расстояние между точками A(0, 0) и B(3, 4).","options":["7","5","25","√7"],"correct":1,"difficulty":2,"explanation":"d = √(3² + 4²) = √25 = 5."},{"type":"single","text":"Лестница длиной 5 м приставлена к стене, её низ находится в 3 м от стены. На какой высоте касается лестница стены?","options":["2 м","4 м","3 м","√34 м"],"correct":1,"difficulty":2,"explanation":"h = √(5² − 3²) = √16 = 4 м."},{"type":"single","text":"Чему равна высота равностороннего треугольника со стороной 6?","options":["3√3","6√3","3","2√3"],"correct":0,"difficulty":3,"explanation":"h = a√3/2 = 6√3/2 = 3√3."},{"type":"single","text":"Катет прямоугольного треугольника равен 9, гипотенуза 15. Найдите второй катет.","options":["12","11","10","13"],"correct":0,"difficulty":2,"explanation":"b = √(225 − 81) = √144 = 12 (тройка 9-12-15 = 3·(3,4,5))."},{"type":"truefalse","text":"Теорема Пифагора верна для любого треугольника.","options":["Верно","Неверно"],"correct":1,"difficulty":1,"explanation":"Только для прямоугольных треугольников. Для произвольных есть теорема косинусов."}]},{"title":"Четырёхугольники и площади фигур","grade_min":8,"grade_max":9,"order":3,"theory":"<h3>Параллелограмм<\/h3><p>Четырёхугольник, у которого противоположные стороны попарно параллельны. <b>Свойства:<\/b> противоположные стороны и углы равны; диагонали пересекаются и делятся точкой пересечения пополам; сумма соседних углов 180°. <b>Признаки:<\/b> равны противоположные стороны; диагонали делятся пополам; две стороны равны и параллельны.<\/p><p>Площадь: <b>S = a·h<\/b> (сторона на высоту к ней).<\/p><h3>Прямоугольник<\/h3><p>Параллелограмм с прямыми углами. Диагонали равны. S = a·b; диагональ d = √(a²+b²).<\/p><h3>Ромб<\/h3><p>Параллелограмм с равными сторонами. Диагонали перпендикулярны и делят углы пополам. <b>S = ½·d₁·d₂<\/b> (половина произведения диагоналей) или S = a·h.<\/p><h3>Квадрат<\/h3><p>Прямоугольник с равными сторонами: S = a², диагональ d = a√2.<\/p><h3>Трапеция<\/h3><p>Четырёхугольник с одной парой параллельных сторон (основания a и b). <b>S = ½(a + b)·h<\/b> — полусумма оснований на высоту. Средняя линия = (a+b)/2.<\/p><h3>Площади других фигур<\/h3><ul><li>Треугольник: S = ½·a·h; S = ½·a·b·sin C;<\/li><li>равносторонний треугольник: S = a²√3/4;<\/li><li>Круг: S = πR²; сектор: S = πR²·(α/360°);<\/li><li>Правильный многоугольник: S = ½·P·r (периметр на апофему).<\/li><\/ul>","questions":[{"type":"single","text":"У какого четырёхугольника диагонали равны и делят друг друга пополам?","options":["ромб","прямоугольник","трапеция","параллелограмм произвольный"],"correct":1,"difficulty":1,"explanation":"У прямоугольника диагонали равны и делятся точкой пересечения пополам (равны — только у прямоугольника и квадрата)."},{"type":"single","text":"Чему равна площадь ромба с диагоналями 6 и 8?","options":["48","24","14","28"],"correct":1,"difficulty":2,"explanation":"S = ½·d₁·d₂ = ½·6·8 = 24."},{"type":"single","text":"Площадь параллелограмма со стороной 10 и высотой 6 равна:","options":["16","30","60","120"],"correct":2,"difficulty":1,"explanation":"S = a·h = 10·6 = 60."},{"type":"single","text":"Основания трапеции 5 и 9, высота 4. Найдите площадь.","options":["28","36","56","18"],"correct":0,"difficulty":2,"explanation":"S = ½(5+9)·4 = 7·4 = 28."},{"type":"single","text":"Чему равна диагональ квадрата со стороной 4?","options":["8","4√2","2√2","16"],"correct":1,"difficulty":2,"explanation":"d = a√2 = 4√2."},{"type":"single","text":"Площадь круга радиуса 3 равен:","options":["6π","9π","3π","12π"],"correct":1,"difficulty":1,"explanation":"S = πR² = π·9 = 9π."},{"type":"single","text":"Средняя линия трапеции равна 12. Чему равна сумма её оснований?","options":["6","24","12","144"],"correct":1,"difficulty":2,"explanation":"Средняя линия = (a+b)/2 → a+b = 24."},{"type":"single","text":"Стороны прямоугольника 5 и 12. Чему равна его диагональ?","options":["17","13","15","√17"],"correct":1,"difficulty":2,"explanation":"d = √(25 + 144) = √169 = 13."},{"type":"single","text":"Чему равна площадь равностороннего треугольника со стороной 4?","options":["4√3","2√3","16√3","8"],"correct":0,"difficulty":3,"explanation":"S = a²√3/4 = 16√3/4 = 4√3."},{"type":"single","text":"У ромба диагонали перпендикулярны и…","options":["равны","делят углы пополам","параллельны сторонам","равны сторонам"],"correct":1,"difficulty":2,"explanation":"Диагонали ромба перпендикулярны и являются биссектрисами его углов."}]},{"title":"Окружность: центральные и вписанные углы","grade_min":9,"grade_max":9,"order":4,"theory":"<h3>Основные элементы<\/h3><p><b>Окружность<\/b> — множество точек, равноудалённых от центра. <b>Радиус R<\/b> — от центра до любой точки; <b>диаметр d = 2R<\/b>; <b>хорда<\/b> — отрезок, соединяющий две точки окружности; <b>касательная<\/b> — прямая, имеющая с окружностью одну общую точку.<\/p><h3>Длина окружности и дуги<\/h3><ul><li>Длина окружности: <b>L = 2πR<\/b>.<\/li><li>Длина дуги с центральным углом α: l = πR·α/180°.<\/li><\/ul><h3>Центральный и вписанный углы<\/h3><ul><li><b>Центральный угол<\/b> — вершина в центре; его градусная мера равна градусной мере дуги, на которую он опирается.<\/li><li><b>Вписанный угол<\/b> — вершина на окружности; он <b>вдвое меньше<\/b> центрального угла, опирающегося на ту же дугу: вписанный = ½ дуги.<\/li><li>Вписанный угол, опирающийся на диаметр, равен <b>90°<\/b>.<\/li><li>Вписанные углы, опирающиеся на одну дугу, равны.<\/li><\/ul><h3>Касательная<\/h3><ul><li>Касательная <b>перпендикулярна радиусу<\/b>, проведённому в точку касания.<\/li><li>Отрезки касательных, проведённых из одной точки, равны.<\/li><li>Угол между касательной и хордой равен половине дуги, заключённой внутри.<\/li><\/ul><h3>Теоремы о хордах и секущих<\/h3><ul><li>Если две хорды пересекаются, то произведение отрезков одной равно произведению отрезков другой: AE·EB = CE·ED.<\/li><li>Для секущих из точки P: PA·PB = PC·PD; для касательной и секущей: PT² = PA·PB.<\/li><\/ul>","questions":[{"type":"single","text":"Центральный угол равен 80°. Чему равен вписанный угол, опирающийся на ту же дугу?","options":["80°","40°","160°","20°"],"correct":1,"difficulty":1,"explanation":"Вписанный угол вдвое меньше центрального: 80/2 = 40°."},{"type":"single","text":"Вписанный угол опирается на диаметр. Чему он равен?","options":["45°","60°","90°","180°"],"correct":2,"difficulty":1,"explanation":"Вписанный угол, опирающийся на диаметр, всегда прямой — 90°."},{"type":"single","text":"Найдите длину окружности радиуса 5 (π ≈ 3,14).","options":["15,7","31,4","78,5","25"],"correct":1,"difficulty":1,"explanation":"L = 2πR = 2·3,14·5 = 31,4."},{"type":"single","text":"Вписанный угол равен 35°. Чему равна дуга, на которую он опирается?","options":["35°","70°","17,5°","110°"],"correct":1,"difficulty":2,"explanation":"Дуга вдвое больше вписанного угла: 35·2 = 70°."},{"type":"single","text":"Касательная к окружности и радиус, проведённый в точку касания,…","options":["равны","перпендикулярны","параллельны","делятся пополам"],"correct":1,"difficulty":1,"explanation":"Касательная всегда перпендикулярна радиусу в точке касания."},{"type":"single","text":"Две хорды пересекаются. Отрезки одной равны 3 и 8, один отрезок второй равен 4. Найдите второй отрезок.","options":["6","5","24","9,6"],"correct":0,"difficulty":3,"explanation":"3·8 = 4·x → x = 24/4 = 6."},{"type":"single","text":"Чему равна длина дуги в 90° при радиусе 4?","options":["π","2π","4π","8π"],"correct":1,"difficulty":2,"explanation":"l = πR·α/180 = π·4·90/180 = 2π."},{"type":"single","text":"Центральный угол AOB равен 100°. Найдите вписанный угол ACB, опирающийся на ту же дугу AB.","options":["100°","50°","200°","25°"],"correct":1,"difficulty":1,"explanation":"Вписанный угол — половина дуги (и половины центрального): 50°."},{"type":"single","text":"Из точки к окружности проведены две касательные. Отрезки касательных от этой точки:","options":["перпендикулярны","равны","относятся как 1:2","параллельны"],"correct":1,"difficulty":2,"explanation":"Отрезки касательных, проведённых из одной точки, равны (свойство касательных)."},{"type":"single","text":"Радиус окружности 7. Чему равен её диаметр?","options":["3,5","14","7π","49"],"correct":1,"difficulty":1,"explanation":"d = 2R = 14."}]},{"title":"Координаты и векторы","grade_min":9,"grade_max":10,"order":5,"theory":"<h3>Координаты на плоскости<\/h3><p>Точка A(x; y). Расстояние между A(x₁; y₁) и B(x₂; y₂): <b>d = √((x₂−x₁)² + (y₂−y₁)²)<\/b>. Середина отрезка AB: ((x₁+x₂)/2; (y₁+y₂)/2).<\/p><h3>Векторы<\/h3><p><b>Вектор<\/b> — направленный отрезок. Координаты вектора AB = (x₂−x₁; y₂−y₁). <b>Длина (модуль)<\/b> вектора a = (x; y): |a| = √(x² + y²).<\/p><h3>Действия с векторами<\/h3><ul><li>Сложение: (x₁+x₂; y₁+y₂) — правило треугольника/параллелограмма;<\/li><li>Умножение на число k: (k·x; k·y);<\/li><li>Разность: a − b = a + (−b).<\/li><\/ul><h3>Скалярное произведение<\/h3><p><b>a·b = x₁x₂ + y₁y₂ = |a|·|b|·cos φ<\/b>, где φ — угол между векторами.<\/p><ul><li>a·b = 0 ⇔ векторы <b>перпендикулярны<\/b>;<\/li><li>cos φ = (a·b)/(|a|·|b|);<\/li><li>a·a = |a|².<\/li><\/ul><h3>Коллинеарные векторы<\/h3><p>Векторы параллельны (коллинеарны), если их координаты пропорциональны: x₁/x₂ = y₁/y₂.<\/p><h3>Уравнения прямых<\/h3><ul><li>y = kx + b — угловой коэффициент k = tg угла наклона;<\/li><li>прямые параллельны ⇔ k₁ = k₂;<\/li><li>перпендикулярны ⇔ k₁·k₂ = −1.<\/li><\/ul><p><b>Пример:<\/b> A(1; 2), B(4; 6): AB = (3; 4), |AB| = 5 (тройка 3-4-5).<\/p>","questions":[{"type":"single","text":"Найдите расстояние между точками A(1; 2) и B(4; 6).","options":["7","5","25","√7"],"correct":1,"difficulty":1,"explanation":"d = √(3² + 4²) = √25 = 5."},{"type":"single","text":"Даны точки A(2; 3) и B(6; 7). Найдите координаты середины отрезка AB.","options":["(4; 5)","(8; 10)","(3; 4)","(2; 2)"],"correct":0,"difficulty":1,"explanation":"((2+6)/2; (3+7)/2) = (4; 5)."},{"type":"single","text":"Найдите длину вектора a = (3; −4).","options":["1","7","5","25"],"correct":2,"difficulty":1,"explanation":"|a| = √(9 + 16) = 5."},{"type":"single","text":"Даны векторы a = (2; 1) и b = (3; −6). Чему равно их скалярное произведение?","options":["0","12","−12","6"],"correct":0,"difficulty":2,"explanation":"a·b = 2·3 + 1·(−6) = 6 − 6 = 0 → векторы перпендикулярны."},{"type":"single","text":"Сумма векторов a = (1; 2) и b = (3; −1) равна:","options":["(4; 1)","(4; 3)","(−2; 3)","(3; −2)"],"correct":0,"difficulty":1,"explanation":"(1+3; 2+(−1)) = (4; 1)."},{"type":"single","text":"Векторы a = (2; 4) и b = (1; 2) являются:","options":["перпендикулярными","коллинеарными","равными","единичными"],"correct":1,"difficulty":2,"explanation":"Координаты пропорциональны: 2/1 = 4/2 = 2 → векторы коллинеарны (параллельны)."},{"type":"single","text":"Прямые y = 2x + 1 и y = 2x − 5:","options":["пересекаются под углом 90°","параллельны","совпадают","перпендикулярны"],"correct":1,"difficulty":2,"explanation":"Угловые коэффициенты равны (k = 2), b разные → прямые параллельны."},{"type":"single","text":"При каком условии прямые y = k₁x + b₁ и y = k₂x + b₂ перпендикулярны?","options":["k₁ = k₂","k₁·k₂ = −1","k₁·k₂ = 1","b₁ = b₂"],"correct":1,"difficulty":2,"explanation":"Условие перпендикулярности: произведение угловых коэффициентов равно −1."},{"type":"single","text":"Найдите косинус угла между векторами a = (1; 0) и b = (1; 1).","options":["1","√2/2","1/2","0"],"correct":1,"difficulty":3,"explanation":"cos φ = (1·1 + 0·1)/(1·√2) = 1/√2 = √2/2 (угол 45°)."},{"type":"single","text":"Вектор AB, если A(3; 5) и B(1; 2), равен:","options":["(4; 7)","(−2; −3)","(2; 3)","(−2; 3)"],"correct":1,"difficulty":2,"explanation":"AB = (x_B − x_A; y_B − y_A) = (1−3; 2−5) = (−2; −3)."}]}]}]},{"title":"Физика","icon":"⚛️","color":"#e8590c","order":2,"sections":[{"title":"Механика","order":1,"topics":[{"title":"Основы кинематики","grade_min":8,"grade_max":9,"order":1,"theory":"<h3>Механическое движение<\/h3><p><b>Механическое движение<\/b> — изменение положения тела относительно других тел с течением времени. <b>Материальная точка<\/b> — тело, размерами которого в данной задаче можно пренебречь. <b>Система отсчёта<\/b> — тело отсчёта + система координат + часы.<\/p><h3>Основные величины<\/h3><ul><li><b>Путь S<\/b> — длина траектории (скаляр, всегда ≥ 0);<\/li><li><b>Перемещение<\/b> — вектор из начальной точки в конечную;<\/li><li><b>Скорость v<\/b> — вектор, v = S/t (при равномерном движении);<\/li><li><b>Ускорение a<\/b> — a = (v − v₀)/t, изменение скорости за единицу времени.<\/li><\/ul><h3>Равномерное прямолинейное движение<\/h3><p>v = const. Формулы: <b>S = v·t<\/b>, x = x₀ + v·t. График v(t) — горизонтальная прямая; путь численно равен площади под графиком.<\/p><h3>Равноускоренное движение<\/h3><ul><li>Скорость: <b>v = v₀ + a·t<\/b>;<\/li><li>Перемещение: <b>S = v₀t + at²/2<\/b>;<\/li><li>Без времени: <b>v² − v₀² = 2aS<\/b>;<\/li><li>Свободное падение: a = g ≈ 9,8 ≈ 10 м/с² (направление — вниз).<\/li><\/ul><p><b>Пример:<\/b> автомобиль разгоняется с места (v₀ = 0) с a = 2 м/с². Через 5 с: v = 10 м/с, S = 25 м.<\/p><h3>Единицы измерения (СИ)<\/h3><p>Путь — метр (м), время — секунда (с), скорость — м/с, ускорение — м/с². Перевод: 1 км/ч = 1/3,6 м/с (36 км/ч = 10 м/с).<\/p>","questions":[{"type":"single","text":"Автомобиль едет равномерно со скоростью 20 м/с. Какой путь он пройдёт за 15 с?","options":["300 м","200 м","150 м","35 м"],"correct":0,"difficulty":1,"explanation":"S = v·t = 20·15 = 300 м."},{"type":"single","text":"Чему равно ускорение тела, если его скорость за 4 с изменилась с 2 до 10 м/с?","options":["2 м/с²","8 м/с²","2,5 м/с²","40 м/с²"],"correct":0,"difficulty":1,"explanation":"a = (v − v₀)/t = (10 − 2)/4 = 2 м/с²."},{"type":"single","text":"Скорость 72 км/ч равна:","options":["7,2 м/с","20 м/с","36 м/с","72 м/с"],"correct":1,"difficulty":2,"explanation":"72 км/ч = 72/3,6 = 20 м/с."},{"type":"single","text":"Тело падает свободно без начальной скорости (g = 10 м/с²). Какой будет его скорость через 3 с?","options":["10 м/с","30 м/с","45 м/с","3 м/с"],"correct":1,"difficulty":2,"explanation":"v = g·t = 10·3 = 30 м/с."},{"type":"single","text":"Поезд начал движение из состояния покоя с ускорением 0,5 м/с². Какое расстояние он пройдёт за 20 с?","options":["100 м","200 м","50 м","400 м"],"correct":0,"difficulty":2,"explanation":"S = v₀t + at²/2 = 0 + 0,5·400/2 = 100 м."},{"type":"single","text":"Что измеряется в м/с²?","options":["скорость","ускорение","путь","перемещение"],"correct":1,"difficulty":1,"explanation":"м/с² — единица ускорения в СИ."},{"type":"single","text":"Тело движется прямолинейно равноускоренно: v₀ = 4 м/с, a = 2 м/с². Найдите скорость через 5 с.","options":["10 м/с","14 м/с","6 м/с","40 м/с"],"correct":1,"difficulty":2,"explanation":"v = v₀ + at = 4 + 2·5 = 14 м/с."},{"type":"single","text":"Путь и перемещение совпадают по модулю при движении:","options":["по окружности","прямолинейном в одну сторону","любом","колебательном"],"correct":1,"difficulty":3,"explanation":"Только при прямолинейном движении в одном направлении длина пути равна модулю перемещения."},{"type":"single","text":"Какая формула описывает перемещение при равноускоренном движении без начальной скорости?","options":["S = vt","S = at²/2","S = v₀t + at","S = a/t"],"correct":1,"difficulty":2,"explanation":"При v₀ = 0: S = at²/2."},{"type":"single","text":"Материальная точка — это:","options":["самая маленькая частица вещества","тело, размерами которого в задаче можно пренебречь","точка на траектории","атом"],"correct":1,"difficulty":1,"explanation":"Это модель: реальный объект считают точкой, когда его размеры не влияют на результат."}]},{"title":"Законы Ньютона и силы","grade_min":9,"grade_max":10,"order":2,"theory":"<h3>Первый закон Ньютона (закон инерции)<\/h3><p>Существуют такие системы отсчёта (инерциальные), в которых тело сохраняет состояние покоя или равномерного прямолинейного движения, если на него не действуют другие тела (или действие скомпенсировано).<\/p><h3>Второй закон Ньютона<\/h3><p><b>a = F/m<\/b>, или <b>F = m·a<\/b> — ускорение прямо пропорционально равнодействующей силе и обратно пропорционально массе. Единица силы — <b>ньютон (Н)<\/b>: 1 Н = 1 кг·м/с².<\/p><h3>Третий закон Ньютона<\/h3><p>Силы взаимодействия двух тел равны по модулю и противоположны по направлению: F₁ = −F₂. Силы приложены к <b>разным<\/b> телам, поэтому не компенсируют друг друга.<\/p><h3>Основные силы в механике<\/h3><ul><li><b>Сила тяжести:<\/b> F = m·g, g ≈ 9,8 Н/кг. Приложена к центру тяжести, направлена вниз.<\/li><li><b>Вес тела:<\/b> P = m·g (покоя), приложен к опоре/подвесу. При движении с ускорением: P = m(g ± a).<\/li><li><b>Сила упругости (закон Гука):<\/b> F = −k·x, где k — жёсткость, x — удлинение.<\/li><li><b>Сила трения:<\/b> Fтр = μ·N, μ — коэффициент трения, N — сила нормальной реакции опоры.<\/li><li><b>Сила всемирного тяготения:<\/b> F = G·m₁m₂/r², G = 6,67·10⁻¹¹ Н·м²/кг².<\/li><\/ul><h3>Равновесие<\/h3><p>Тело в покое или движется равномерно, если равнодействующая всех сил равна нулю: ΣF = 0.<\/p><p><b>Пример:<\/b> тело массой 2 кг тянут с силой 10 Н, трение 4 Н → a = (10−4)/2 = 3 м/с².<\/p>","questions":[{"type":"single","text":"Как формулируется второй закон Ньютона?","options":["F = m·a","F = m·g·h","F = k·x","F₁/F₂ = m₂/m₁"],"correct":0,"difficulty":1,"explanation":"Второй закон: F = m·a (равнодействующая сила равна произведению массы на ускорение)."},{"type":"single","text":"Тело массой 5 кг движется с ускорением 2 м/с². Какова равнодействующая сила?","options":["10 Н","2,5 Н","7 Н","0,4 Н"],"correct":0,"difficulty":1,"explanation":"F = m·a = 5·2 = 10 Н."},{"type":"single","text":"Сила тяжести, действующая на тело массой 3 кг (g = 10 Н/кг):","options":["30 Н","3 Н","0,3 Н","300 Н"],"correct":0,"difficulty":1,"explanation":"F = m·g = 3·10 = 30 Н."},{"type":"single","text":"Закон Гука записывается как:","options":["F = μN","F = kx","F = mg","F = ma"],"correct":1,"difficulty":1,"explanation":"Сила упругости F = k·x (жёсткость на удлинение), направлена против деформации."},{"type":"single","text":"Третий закон Ньютона утверждает, что силы взаимодействия двух тел:","options":["равны и приложены к одному телу","равны по модулю и противоположны по направлению","всегда уравновешиваются","зависят от масс тел"],"correct":1,"difficulty":2,"explanation":"F₁ = −F₂; силы приложены к разным телам, поэтому не компенсируются."},{"type":"single","text":"Сила трения скольжения вычисляется по формуле:","options":["F = kx","F = μN","F = mg/r","F = mv²/r"],"correct":1,"difficulty":1,"explanation":"Fтр = μ·N, где μ — коэффициент трения, N — реакция опоры."},{"type":"single","text":"Тело массой 2 кг тянут силой 10 Н, сила трения 4 Н. Найдите ускорение.","options":["3 м/с²","5 м/с²","2 м/с²","7 м/с²"],"correct":0,"difficulty":2,"explanation":"a = (F − Fтр)/m = (10 − 4)/2 = 3 м/с²."},{"type":"single","text":"Как изменится сила всемирного тяготения между телами при увеличении расстояния в 2 раза?","options":["уменьшится в 2 раза","уменьшится в 4 раза","увеличится в 4 раза","не изменится"],"correct":1,"difficulty":3,"explanation":"F ~ 1/r²: при r → 2r сила уменьшается в 4 раза."},{"type":"single","text":"Чему равно ускорение свободного падения у поверхности Земли (приближённо)?","options":["9,8 м/с²","9,8 км/с²","6,67 м/с²","10 Н"],"correct":0,"difficulty":1,"explanation":"g ≈ 9,8 м/с² (в задачах часто округляют до 10 м/с²)."},{"type":"single","text":"Тело находится в равновесии, если:","options":["оно покоится","равнодействующая сил равна нулю","на него не действует трение","его масса постоянна"],"correct":1,"difficulty":2,"explanation":"Условие равновесия: ΣF = 0 (покоится ИЛИ движется равномерно прямолинейно)."}]},{"title":"Работа, мощность и энергия","grade_min":8,"grade_max":9,"order":3,"theory":"<h3>Механическая работа<\/h3><p><b>A = F·S·cos α<\/b> — произведение силы, перемещения и косинуса угла между ними. Единица — <b>джоуль (Дж)<\/b>: 1 Дж = 1 Н·м.<\/p><ul><li>Если сила направлена вдоль движения (α = 0°): A = F·S;<\/li><li>если перпендикулярно (α = 90°): A = 0;<\/li><li>если против движения (α = 180°): A &lt; 0 (например, работа трения).<\/li><\/ul><h3>Мощность<\/h3><p><b>N = A/t<\/b> — работа в единицу времени. Единица — <b>ватт (Вт)<\/b>: 1 Вт = 1 Дж/с. Также N = F·v (при равномерном движении).<\/p><h3>Энергия<\/h3><ul><li><b>Кинетическая:<\/b> Eк = mv²/2 — энергия движения;<\/li><li><b>Потенциальная (в поле тяжести):<\/b> Eп = mgh;<\/li><li><b>Потенциальная упругой деформации:<\/b> E = kx²/2.<\/li><\/ul><h3>Законы сохранения<\/h3><ul><li><b>Закон сохранения механической энергии:<\/b> в замкнутой системе без трения Eк + Eп = const.<\/li><li>При наличии трения часть механической энергии переходит во внутреннюю (тепло).<\/li><\/ul><p><b>Пример:<\/b> мяч массой 0,5 кг бросили вверх со скоростью 10 м/с. На максимальной высоте Eк полностью перешла в Eп: mgh = mv²/2 → h = v²/(2g) = 5 м.<\/p><h3>КПД<\/h3><p><b>η = Aполезная / Aполная · 100%<\/b> — коэффициент полезного действия, всегда &lt; 100%.<\/p>","questions":[{"type":"single","text":"Сила 20 Н переместила тело на 5 м по направлению силы. Чему равна работа?","options":["25 Дж","100 Дж","4 Дж","15 Дж"],"correct":1,"difficulty":1,"explanation":"A = F·S = 20·5 = 100 Дж."},{"type":"single","text":"Какова работа силы, перпендикулярной направлению движения?","options":["максимальна","равна нулю","отрицательна","зависит от массы"],"correct":1,"difficulty":1,"explanation":"cos 90° = 0, поэтому A = F·S·0 = 0."},{"type":"single","text":"Двигатель совершает работу 600 Дж за 3 с. Какова его мощность?","options":["1800 Вт","200 Вт","603 Вт","0,005 Вт"],"correct":1,"difficulty":1,"explanation":"N = A/t = 600/3 = 200 Вт."},{"type":"single","text":"Кинетическая энергия тела массой 2 кг, движущегося со скоростью 3 м/с:","options":["6 Дж","9 Дж","18 Дж","3 Дж"],"correct":1,"difficulty":2,"explanation":"Eк = mv²/2 = 2·9/2 = 9 Дж."},{"type":"single","text":"Потенциальная энергия тела массой 4 кг на высоте 5 м (g = 10 м/с²):","options":["20 Дж","200 Дж","100 Дж","45 Дж"],"correct":1,"difficulty":2,"explanation":"Eп = mgh = 4·10·5 = 200 Дж."},{"type":"single","text":"Закон сохранения механической энергии выполняется в системе, где:","options":["действует трение","нет трения и сопротивления","тело движется с ускорением","есть двигатель"],"correct":1,"difficulty":2,"explanation":"Eк + Eп = const — при отсутствии диссипативных сил (трения, сопротивления)."},{"type":"single","text":"Мяч массой 0,2 кг падает с высоты 10 м. Какова его кинетическая энергия у поверхности (g = 10 м/с²)?","options":["2 Дж","20 Дж","200 Дж","0,2 Дж"],"correct":1,"difficulty":3,"explanation":"Вся потенциальная энергия перешла в кинетическую: E = mgh = 0,2·10·10 = 20 Дж."},{"type":"single","text":"Единица измерения мощности в СИ:","options":["джоуль","ньютон","ватт","паскаль"],"correct":2,"difficulty":1,"explanation":"Мощность измеряется в ваттах: 1 Вт = 1 Дж/с."},{"type":"single","text":"Кран поднимает груз равномерно со скоростью 0,5 м/с силой тяги 4000 Н. Какова мощность крана?","options":["2000 Вт","8000 Вт","200 Вт","4000 Вт"],"correct":0,"difficulty":3,"explanation":"N = F·v = 4000·0,5 = 2000 Вт."},{"type":"single","text":"КПД механизма 80%. Полезная работа при полной работе 500 Дж равна:","options":["400 Дж","625 Дж","80 Дж","450 Дж"],"correct":0,"difficulty":2,"explanation":"Aпол = η·Aполная = 0,8·500 = 400 Дж."}]}]},{"title":"Электричество и тепло","order":2,"topics":[{"title":"Электрический ток и закон Ома","grade_min":8,"grade_max":10,"order":1,"theory":"<h3>Электрический ток<\/h3><p><b>Электрический ток<\/b> — упорядоченное движение заряженных частиц. <b>Сила тока I = q/t<\/b>, единица — <b>ампер (А)<\/b>. Направление тока принято от «+» к «−» (против движения электронов).<\/p><h3>Напряжение и сопротивление<\/h3><ul><li><b>Напряжение U<\/b> — работа поля по переносу заряда: U = A/q, единица — <b>вольт (В)<\/b>.<\/li><li><b>Сопротивление R<\/b> — свойство проводника препятствовать току, единица — <b>ом (Ом)<\/b>. R = ρ·l/S, где ρ — удельное сопротивление, l — длина, S — площадь сечения.<\/li><\/ul><h3>Закон Ома для участка цепи<\/h3><p><b>I = U/R<\/b> — сила тока прямо пропорциональна напряжению и обратно пропорциональна сопротивлению.<\/p><h3>Соединения проводников<\/h3><ul><li><b>Последовательное:<\/b> I — одинаков, U = U₁ + U₂, R = R₁ + R₂;<\/li><li><b>Параллельное:<\/b> U — одинаково, I = I₁ + I₂, 1/R = 1/R₁ + 1/R₂ (для двух: R = R₁R₂/(R₁+R₂)).<\/li><\/ul><h3>Работа и мощность тока. Закон Джоуля–Ленца<\/h3><ul><li>A = U·I·t (работа, Дж);<\/li><li>P = U·I = I²R = U²/R (мощность, Вт);<\/li><li>Q = I²Rt — количество теплоты, выделяемое проводником (закон Джоуля–Ленца).<\/li><\/ul><p><b>Пример:<\/b> лампа (R = 440 Ом) в сети 220 В: I = 220/440 = 0,5 А; P = 220·0,5 = 110 Вт.<\/p>","questions":[{"type":"single","text":"Закон Ома для участка цепи:","options":["I = U·R","I = U/R","U = I/R","R = U·I"],"correct":1,"difficulty":1,"explanation":"I = U/R — сила тока равна напряжению, делённому на сопротивление."},{"type":"single","text":"Напряжение на резисторе 12 В, сопротивление 4 Ом. Найдите силу тока.","options":["48 А","3 А","0,33 А","8 А"],"correct":1,"difficulty":1,"explanation":"I = U/R = 12/4 = 3 А."},{"type":"single","text":"Единица измерения силы тока:","options":["вольт","ом","ампер","ватт"],"correct":2,"difficulty":1,"explanation":"Сила тока измеряется в амперах (А)."},{"type":"single","text":"Два резистора по 6 Ом соединены последовательно. Общее сопротивление:","options":["3 Ом","6 Ом","12 Ом","36 Ом"],"correct":2,"difficulty":2,"explanation":"При последовательном соединении сопротивления складываются: 6 + 6 = 12 Ом."},{"type":"single","text":"Два резистора по 6 Ом соединены параллельно. Общее сопротивление:","options":["3 Ом","12 Ом","6 Ом","1,5 Ом"],"correct":0,"difficulty":2,"explanation":"1/R = 1/6 + 1/6 = 2/6 → R = 3 Ом (два одинаковых параллельно — вдвое меньше)."},{"type":"single","text":"Мощность тока вычисляется по формуле:","options":["P = U·I","P = U/I","P = I·R","P = U·t"],"correct":0,"difficulty":1,"explanation":"P = U·I (также P = I²R = U²/R)."},{"type":"single","text":"Лампа работает при U = 220 В, I = 0,5 А. Какова её мощность?","options":["110 Вт","440 Вт","220 Вт","55 Вт"],"correct":0,"difficulty":2,"explanation":"P = U·I = 220·0,5 = 110 Вт."},{"type":"single","text":"Закон Джоуля–Ленца:","options":["Q = I²Rt","Q = U·t","Q = mcΔt","Q = I·R/t"],"correct":0,"difficulty":2,"explanation":"Количество теплоты в проводнике: Q = I²Rt."},{"type":"single","text":"При параллельном соединении проводников одинакова(о):","options":["сила тока","напряжение","сопротивление","мощность"],"correct":1,"difficulty":2,"explanation":"На всех параллельных ветвях одинаковое напряжение; токи могут различаться."},{"type":"single","text":"Сопротивление проводника длиной l, сечением S: R = ","options":["ρ·S/l","ρ·l/S","l/(ρ·S)","S·l/ρ"],"correct":1,"difficulty":2,"explanation":"R = ρl/S: сопротивление растёт с длиной и падает с сечением."}]},{"title":"Основы термодинамики","grade_min":10,"grade_max":10,"order":2,"theory":"<h3>Внутренняя энергия<\/h3><p><b>Внутренняя энергия U<\/b> — сумма кинетической энергии теплового движения всех молекул и потенциальной энергии их взаимодействия. Для идеального одноатомного газа: U = (3/2)·(m/M)·R·T.<\/p><h3>Способы изменения внутренней энергии<\/h3><ol><li><b>Совершение работы<\/b> (нагрев при трении, сжатие газа);<\/li><li><b>Теплопередача<\/b> — передача энергии без совершения работы (теплопроводность, конвекция, излучение).<\/li><\/ol><h3>Первый закон термодинамики<\/h3><p><b>Q = ΔU + A<\/b> — количество теплоты, переданное системе, идёт на изменение её внутренней энергии и совершение работы против внешних сил. Это закон сохранения энергии для тепловых процессов.<\/p><ul><li>Изохорный процесс (V = const): A = 0, Q = ΔU;<\/li><li>Изотермический (T = const): ΔU = 0, Q = A;<\/li><li>Изобарный (p = const): A = p·ΔV;<\/li><li>Адиабатный (Q = 0): ΔU = −A.<\/li><\/ul><h3>Работа газа<\/h3><p>A = p·ΔV (при постоянном давлении); численно равна площади под графиком в координатах p(V).<\/p><h3>Количество теплоты<\/h3><ul><li>Нагревание: Q = c·m·ΔT (c — удельная теплоёмкость);<\/li><li>Плавление: Q = λ·m; парообразование: Q = L·m;<\/li><li>Сгорание топлива: Q = q·m.<\/li><\/ul><h3>КПД теплового двигателя<\/h3><p><b>η = (Q₁ − Q₂)/Q₁<\/b>, где Q₁ — теплота от нагревателя, Q₂ — отданная холодильнику. Максимальный КПД (цикл Карно): ηmax = (T₁ − T₂)/T₁.<\/p><h3>Второй закон термодинамики<\/h3><p>Невозможно передать теплоту от холодного тела к горячему без внешних затрат; невозможен вечный двигатель второго рода.<\/p>","questions":[{"type":"single","text":"Первый закон термодинамики записывается как:","options":["Q = ΔU + A","Q = cmΔT","A = F·S","η = A/Q"],"correct":0,"difficulty":1,"explanation":"Q = ΔU + A: теплота идёт на изменение внутренней энергии и работу."},{"type":"single","text":"В изохорном процессе (V = const) работа газа равна:","options":["Q","0","pΔV","ΔU"],"correct":1,"difficulty":2,"explanation":"A = p·ΔV, а ΔV = 0 → A = 0. Вся теплота идёт на ΔU."},{"type":"single","text":"Какое количество теплоты нужно для нагревания 2 кг воды на 10 °C (c = 4200 Дж/(кг·°C))?","options":["84 000 Дж","8400 Дж","42 000 Дж","21 000 Дж"],"correct":0,"difficulty":2,"explanation":"Q = cmΔT = 4200·2·10 = 84 000 Дж."},{"type":"single","text":"Формула количества теплоты при плавлении:","options":["Q = λm","Q = cmΔT","Q = Lm","Q = qm"],"correct":0,"difficulty":1,"explanation":"λ — удельная теплота плавления: Q = λ·m. (L — парообразование, q — сгорание.)"},{"type":"single","text":"В изотермическом процессе (T = const):","options":["ΔU = 0","A = 0","Q = 0","p = 0"],"correct":0,"difficulty":2,"explanation":"Внутренняя энергия идеального газа зависит только от T → ΔU = 0, вся теплота идёт на работу."},{"type":"single","text":"Тепловой двигатель получил от нагревателя 500 Дж, отдал холодильнику 300 Дж. Найдите КПД.","options":["60%","40%","30%","167%"],"correct":1,"difficulty":2,"explanation":"η = (Q₁ − Q₂)/Q₁ = (500 − 300)/500 = 0,4 = 40%."},{"type":"single","text":"Какой процесс происходит без теплообмена?","options":["изотермический","изобарный","адиабатный","изохорный"],"correct":2,"difficulty":2,"explanation":"Адиабатный процесс: Q = 0, работа идёт за счёт внутренней энергии."},{"type":"single","text":"Внутреннюю энергию тела можно изменить:","options":["только работой","только теплопередачей","работой и теплопередачей","ни тем, ни другим"],"correct":2,"difficulty":1,"explanation":"Два способа: совершение работы и теплопередача."},{"type":"single","text":"Газ получил 200 Дж теплоты и совершил работу 50 Дж. Как изменилась его внутренняя энергия?","options":["+250 Дж","+150 Дж","−150 Дж","+200 Дж"],"correct":1,"difficulty":3,"explanation":"ΔU = Q − A = 200 − 50 = 150 Дж (увеличилась)."},{"type":"single","text":"Второй закон термодинамики запрещает:","options":["нагревать тела","передачу теплоты от холодного тела к горячему без затрат","сжатие газа","работу двигателя"],"correct":1,"difficulty":3,"explanation":"Самопроизвольная передача тепла «наоборот» невозможна — это формулировка второго закона (Клаузиус)."}]}]}]},{"title":"Химия","icon":"🧪","color":"#0ca678","order":3,"sections":[{"title":"Общая химия","order":1,"topics":[{"title":"Строение атома и периодическая система","grade_min":8,"grade_max":9,"order":1,"theory":"<h3>Строение атома<\/h3><p>Атом состоит из <b>ядра<\/b> (протоны «+» и нейтроны без заряда) и <b>электронов «−»<\/b>, движущихся вокруг ядра.<\/p><ul><li><b>Заряд ядра Z<\/b> = числу протонов = порядковому номеру в таблице Менделеева = числу электронов в нейтральном атоме.<\/li><li><b>Массовое число A<\/b> = протоны + нейтроны. Нейтроны N = A − Z.<\/li><li><b>Изотопы<\/b> — атомы одного элемента с разным числом нейтронов (¹²C и ¹³C).<\/li><\/ul><h3>Электронные оболочки<\/h3><p>Электроны размещаются по уровням: на n-м уровне максимум <b>2n²<\/b> электронов (1-й: 2, 2-й: 8, 3-й: 18). Число электронов на <b>внешнем уровне<\/b> у элементов главных подгрупп = номеру группы. Именно внешние (валентные) электроны определяют химические свойства.<\/p><p>Пример: натрий Na (№11): 1s²2s²2p⁶3s¹ → схема 2, 8, 1 — один внешний электрон, типичный металл.<\/p><h3>Периодический закон<\/h3><p><b>Д.И. Менделеев (1869):<\/b> свойства элементов находятся в периодической зависимости от заряда ядер их атомов.<\/p><h3>Периодические закономерности<\/h3><ul><li><b>В периоде (слева направо):<\/b> заряд ядра растёт, радиус атома уменьшается, металлические свойства ослабевают, неметаллические усиливаются.<\/li><li><b>В группе (сверху вниз):<\/b> радиус растёт, металлические свойства усиливаются, неметаллические ослабевают.<\/li><li>Самый сильный неметалл — <b>фтор<\/b>, самый сильный металл — <b>франций<\/b>.<\/li><\/ul><h3>Структура таблицы<\/h3><p><b>Период<\/b> — горизонтальный ряд (номер = числу электронных уровней). <b>Группа<\/b> — вертикальный столбец (главные подгруппы A: номер = числу внешних электронов). <b>Валентность<\/b> элементов главных подгрупп высшая = номеру группы (кроме F, O и др.).<\/p>","questions":[{"type":"single","text":"Заряд ядра атома равен:","options":["числу нейтронов","числу протонов","массовому числу","числу протонов и нейтронов"],"correct":1,"difficulty":1,"explanation":"Заряд ядра определяется числом протонов и равен порядковому номеру элемента."},{"type":"single","text":"Сколько электронов в атоме азота (№7)?","options":["14","7","21","3"],"correct":1,"difficulty":1,"explanation":"В нейтральном атоме число электронов = числу протонов = порядковому номеру = 7."},{"type":"single","text":"Изотопы — это атомы одного элемента с разным числом:","options":["протонов","электронов","нейтронов","уровней"],"correct":2,"difficulty":1,"explanation":"Изотопы отличаются числом нейтронов (протоны одинаковы — иначе это другой элемент)."},{"type":"single","text":"Атом имеет 11 протонов и 12 нейтронов. Чему равно массовое число?","options":["11","12","23","1"],"correct":2,"difficulty":2,"explanation":"A = Z + N = 11 + 12 = 23 (это натрий-23)."},{"type":"single","text":"Схема электронного строения атома кислорода (№8):","options":["2, 6","2, 8","8, 2","2, 4, 2"],"correct":0,"difficulty":2,"explanation":"8 электронов: 2 на первом уровне, 6 на втором → 2, 6."},{"type":"single","text":"Число электронов на внешнем уровне у элементов главной подгруппы равно:","options":["номеру периода","номеру группы","атомной массе","числу нейтронов"],"correct":1,"difficulty":2,"explanation":"У элементов подгрупп A номер группы = числу валентных (внешних) электронов."},{"type":"single","text":"В периоде слева направо металлические свойства:","options":["усиливаются","ослабевают","не изменяются","исчезают полностью"],"correct":1,"difficulty":2,"explanation":"С ростом заряда ядра радиус уменьшается, электроны удерживаются сильнее → металлические свойства ослабевают, неметаллические усиливаются."},{"type":"single","text":"Кто открыл периодический закон (1869 г.)?","options":["Ломоносов","Менделеев","Бутлеров","Бойль"],"correct":1,"difficulty":1,"explanation":"Д.И. Менделеев, 1 марта 1869 года."},{"type":"single","text":"Максимальное число электронов на втором энергетическом уровне:","options":["2","8","18","32"],"correct":1,"difficulty":2,"explanation":"2n² = 2·2² = 8."},{"type":"single","text":"Элемент с электронной схемой 2, 8, 1 — это:","options":["литий","натрий","магний","калий"],"correct":1,"difficulty":3,"explanation":"Всего 11 электронов → №11 — натрий. (У лития 2, 1; у калия 2, 8, 8, 1.)"}]},{"title":"Классы неорганических соединений","grade_min":8,"grade_max":8,"order":2,"theory":"<h3>Оксиды<\/h3><p>Бинарные соединения с кислородом (степень окисления −2): Na₂O, CO₂, SO₃. Делятся на <b>основные<\/b> (металлы в ст. ок. +1, +2: CaO, Na₂O), <b>кислотные<\/b> (неметаллы и металлы в высоких ст. ок.: SO₃, CO₂, Mn₂O₇) и <b>амфотерные<\/b> (ZnO, Al₂O₃, BeO).<\/p><h3>Основания (щёлочи)<\/h3><p>Me(OH)ₙ: NaOH, Ca(OH)₂. Растворимые основания — щёлочи (NaOH, KOH, Ca(OH)₂…). Индикаторы: лакмус — синий, фенолфталеин — малиновый. Реакции: основание + кислота → соль + вода (нейтрализация).<\/p><h3>Кислоты<\/h3><p>Hₙ(кислотный остаток): HCl, H₂SO₄, HNO₃. Классификация: по наличию кислорода (кислородсодержащие/бескислородные), по основности (числу атомов H). Сильные: HCl, H₂SO₄, HNO₃. Реагируют с металлами (до H₂ в ряду активности), основными оксидами, основаниями, солями.<\/p><h3>Соли<\/h3><p>Продукт замещения водорода в кислоте металлом: NaCl, CuSO₄, CaCO₃. Средние, кислые (NaHCO₃), основные (CuOH)₂CO₃.<\/p><h3>Генетическая связь<\/h3><p>Металл → основный оксид → основание → соль. Неметалл → кислотный оксид → кислота → соль.<\/p><p>Примеры реакций:<\/p><ul><li>CaO + H₂O → Ca(OH)₂;<\/li><li>SO₃ + H₂O → H₂SO₄;<\/li><li>NaOH + HCl → NaCl + H₂O;<\/li><li>Zn + H₂SO₄ → ZnSO₄ + H₂↑;<\/li><li>CaCO₃ → (t) CaO + CO₂↑.<\/li><\/ul><h3>Степень окисления<\/h3><p>Условный заряд атома: у простых веществ 0; H обычно +1, O обычно −2; сумма степеней окисления в молекуле = 0. У металлов главных подгрупп = номеру группы.<\/p>","questions":[{"type":"single","text":"Какое вещество является оксидом?","options":["NaCl","CO₂","H₂SO₄","NaOH"],"correct":1,"difficulty":1,"explanation":"Оксид — бинарное соединение с кислородом: CO₂ (остальное — соль, кислота, основание)."},{"type":"single","text":"NaOH относится к классу:","options":["кислот","солей","оснований (щёлочей)","оксидов"],"correct":2,"difficulty":1,"explanation":"NaOH — гидроксид натрия, растворимое основание (щёлочь)."},{"type":"single","text":"Реакция основания с кислотой называется:","options":["горением","нейтрализацией","разложением","замещением"],"correct":1,"difficulty":1,"explanation":
